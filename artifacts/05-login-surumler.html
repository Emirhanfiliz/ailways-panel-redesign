<title>Ailways Giriş</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap&subset=latin-ext" rel="stylesheet">
<style>
body { margin: 0; background: #fff; }
/* Ailways · Giriş sayfası. Token'lar panel prototipiyle aynı; hepsi .alw-login altında. */
.alw-login {
  --alw-bg: #FFFFFF;
  --alw-fg: #0F1F2C;
  --alw-muted: #4F6170;
  --alw-faint: #8A9AA8;
  --alw-line: #E3E9EE;
  --alw-soft: #F5F8FA;
  --alw-accent: #0A87C5;
  --alw-accent-2: #119DDA;
  --alw-accent-soft: #E8F5FC;
  --alw-navy: #0B2B40;
  --alw-navy-hover: #133A55;
  --alw-crit: #C8372F;
  --alw-crit-soft: #FCE8E6;
  --alw-font: "IBM Plex Sans", ui-sans-serif, system-ui, "Segoe UI", sans-serif;
  --alw-font-head: "Manrope", "IBM Plex Sans", system-ui, sans-serif;

  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  display: grid;
  grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
  background: var(--alw-bg);
  color: var(--alw-fg);
  font-family: var(--alw-font);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.alw-login *, .alw-login *::before, .alw-login *::after { box-sizing: border-box; }
.alw-login :focus-visible { outline: 2px solid var(--alw-accent); outline-offset: 2px; }
.alw-sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

/* ---------- Sağ: form (kartsız, beyaz zemin) ---------- */
.alw-login-form-side {
  display: grid; grid-template-rows: minmax(0, 1fr) auto; justify-items: center;
  padding: 24px 56px 20px; min-width: 0; min-height: 0; overflow-y: auto;
}
.alw-form-wrap { align-self: center; width: 100%; max-width: 420px; margin: 16px 0; }

.alw-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 32px; font-family: var(--alw-font-head); font-weight: 700; font-size: 17px; letter-spacing: -0.01em; }
.alw-brand img { width: 30px; height: 30px; border-radius: 8px; display: block; }
.alw-title { margin: 0; font-family: var(--alw-font-head); font-size: 36px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.15; }

.alw-alert { margin: 24px 0 0; padding: 11px 14px; border-radius: 10px; background: var(--alw-crit-soft); color: #9E2A23; font-size: 14px; }

.alw-form { margin-top: 32px; display: flex; flex-direction: column; gap: 18px; }
.alw-field label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
.alw-field-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.alw-field-row label { margin-bottom: 6px; }
.alw-field input {
  width: 100%; height: 50px; border: 1px solid var(--alw-line); border-radius: 12px; padding: 0 16px;
  font: inherit; font-size: 16px; color: var(--alw-fg); background: #fff; outline: none;
  transition: border-color .15s, box-shadow .15s;
}
.alw-field input::placeholder { color: var(--alw-faint); }
.alw-field input:hover { border-color: #C6D5E0; }
.alw-field input:focus { border-color: var(--alw-accent-2); box-shadow: 0 0 0 3px rgba(17, 157, 218, .14); }
.alw-field input[aria-invalid="true"] { border-color: var(--alw-crit); }
.alw-field input[aria-invalid="true"]:focus { box-shadow: 0 0 0 3px rgba(200, 55, 47, .12); }

.alw-pw { position: relative; }
.alw-pw input { padding-right: 48px; }
.alw-pw-toggle {
  position: absolute; right: 5px; top: 5px; width: 40px; height: 40px; border: 0; border-radius: 8px;
  background: none; color: var(--alw-muted); display: grid; place-items: center; cursor: pointer;
}
.alw-pw-toggle:hover { background: var(--alw-soft); color: var(--alw-fg); }

.alw-link { color: var(--alw-accent); font-size: 13.5px; font-weight: 500; text-decoration: none; }
.alw-link:hover { text-decoration: underline; text-underline-offset: 3px; }

.alw-check { display: inline-flex; align-items: center; gap: 9px; font-size: 14px; color: var(--alw-fg); cursor: pointer; align-self: flex-start; min-height: 24px; }
.alw-check input { width: 17px; height: 17px; margin: 0; accent-color: var(--alw-navy); cursor: pointer; }

.alw-btn {
  margin-top: 6px; height: 50px; border: 0; border-radius: 12px; background: var(--alw-navy); color: #fff;
  font: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 10px; transition: background .15s;
}
.alw-btn:hover { background: var(--alw-navy-hover); }
.alw-btn:disabled { cursor: progress; opacity: .85; }
.alw-spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .35); border-top-color: #fff; animation: alw-spin .7s linear infinite; }
@keyframes alw-spin { to { transform: rotate(360deg); } }

.alw-foot { position: relative; margin: 0; color: var(--alw-faint); font-size: 12.5px; }

/* ---------- Sağ: ana sayfa başlığı + kanal yörüngesi ---------- */
.alw-login-hero { border-right: 1px solid var(--alw-line); display: flex; align-items: center; padding: 32px 56px; min-width: 0; min-height: 0; overflow: hidden; }
.alw-hero-inner { width: 100%; max-width: 560px; margin: 0 auto; }
.alw-lede { margin: 0; font-family: var(--alw-font-head); font-size: clamp(26px, 2.5vw, 36px); line-height: 1.18; font-weight: 700; letter-spacing: -0.03em; text-align: center; }
/* İki sabit satır: kanal adı uzayıp kısalınca satırlar kaymaz, yörünge yerinde kalır */
.alw-lede-line { display: block; white-space: nowrap; }
.alw-pill { display: inline-flex; vertical-align: bottom; overflow: hidden; padding: 0 .14em; margin: 0 -.02em; border-radius: 12px; background: var(--alw-accent-soft); color: var(--alw-accent); line-height: 1.12; }
.alw-rt { display: inline-flex; flex-wrap: wrap; white-space: pre-wrap; position: relative; }
.alw-rt-word { display: inline-flex; overflow: hidden; padding-bottom: .08em; }
.alw-rt-char { display: inline-block; }
.alw-rt-char.is-in { animation: alw-rt-in .42s cubic-bezier(.2, .9, .3, 1.2) both; }
@keyframes alw-rt-in { from { transform: translateY(100%); opacity: 0; } to { transform: none; opacity: 1; } }

.alw-orbit { container-type: inline-size; position: relative; width: min(100%, 500px, calc(100vh - 230px)); width: min(100%, 500px, calc(100dvh - 230px)); aspect-ratio: 1; margin: 20px auto 0; }
.alw-orbit::before { content: ""; position: absolute; inset: 9%; border-radius: 50%; background: radial-gradient(circle, #EEF7FC 0%, #F6FBFE 55%, rgba(255, 255, 255, 0) 72%); }
.alw-orbit-ring { position: absolute; inset: 12%; border-radius: 50%; border: 1px dashed #CFE3EE; }
.alw-orbit-ring.is-inner { inset: 26.5%; border: 1px solid #EAF2F7; }
.alw-orbit-spin { position: absolute; inset: 0; animation: alw-orbit 60s linear infinite; }
.alw-orbit-node { position: absolute; z-index: 1; width: var(--alw-node, 13.5%); aspect-ratio: 1; transform: translate(-50%, -50%); transition: transform .45s cubic-bezier(.2, .9, .3, 1.2); }
.alw-orbit-node.is-active { z-index: 2; transform: translate(-50%, -50%) scale(1.22); }
.alw-orbit-node .alw-orbit-face { transition: box-shadow .35s; }
.alw-orbit-node.is-active .alw-orbit-face { box-shadow: 0 0 0 2px var(--alw-accent-2), 0 0 0 7px rgba(17, 157, 218, .14), 0 10px 24px rgba(10, 135, 197, .22); }
/* Merkezden etkin kanala çizilen ince çizgi; her kanal değişiminde baştan çizilir */
.alw-orbit-link { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.alw-orbit-link line { stroke: var(--alw-accent-2); stroke-width: .32; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: alw-link-in .5s ease-out forwards; }
@keyframes alw-link-in { to { stroke-dashoffset: 0; } }
.alw-orbit-face {
  width: 100%; height: 100%; border-radius: 50%; background: #fff; display: grid; place-items: center; color: var(--alw-accent);
  box-shadow: 0 0 0 1px #E4EBF1, 0 6px 16px rgba(14, 34, 51, .08);
  animation: alw-orbit 60s linear infinite reverse;
}
.alw-orbit-face img { width: 56%; height: 56%; object-fit: contain; border-radius: 6px; }
@keyframes alw-orbit { to { transform: rotate(360deg); } }
.alw-orbit-core {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 33%; aspect-ratio: 1; border-radius: 50%;
  background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  box-shadow: 0 0 0 1px #E4EBF1, 0 18px 40px rgba(10, 135, 197, .16);
}
.alw-orbit-core img { width: 44%; border-radius: 12px; display: block; }

/* tagline: merkezde logo ile yazı yer değiştirir */
.alw-core-logo { transition: opacity .35s ease, transform .5s cubic-bezier(.2, .9, .3, 1.2); }
.alw-core-logo.is-out { opacity: 0; transform: scale(.6); }
/* cycle: kanallar merkeze girince logo büyür, sonra biraz küçülür */
.alw-core-logo.is-pulse { animation: alw-core-pulse var(--alw-pulse, .65s) cubic-bezier(.3, .7, .3, 1) both; }
@keyframes alw-core-pulse { 0% { transform: scale(1); } 45% { transform: scale(1.32); } 100% { transform: scale(1.1); } }
.alw-core-text {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  font-family: var(--alw-font-head); font-weight: 700; font-size: 4.3cqi; line-height: 1.14; letter-spacing: -0.02em; color: var(--alw-fg);
  opacity: 0; transition: opacity .3s ease; pointer-events: none;
}
.alw-core-text.is-on { opacity: 1; }
.alw-core-line { display: flex; overflow: hidden; padding-bottom: .06em; }
.alw-core-line.is-accent { color: var(--alw-accent); }

/* cycle: grup başına iki tur; düğümler merkezden çıkar, sonda merkeze girer */
.alw-orbit.is-cycle .alw-orbit-spin { animation: alw-orbit-2x var(--alw-cycle) linear forwards; }
.alw-orbit.is-cycle .alw-orbit-face { animation: alw-orbit-2x var(--alw-cycle) linear forwards reverse; }
.alw-orbit.is-cycle .alw-orbit-node {
  transition: left var(--alw-move) cubic-bezier(.4, 0, .2, 1), top var(--alw-move) cubic-bezier(.4, 0, .2, 1),
              transform var(--alw-move) cubic-bezier(.4, 0, .2, 1), opacity calc(var(--alw-move) * .7) ease;
}
.alw-orbit.is-cycle .alw-orbit-node.is-closed { transform: translate(-50%, -50%) scale(.2); opacity: 0; }
.alw-orbit.is-still .alw-orbit-spin, .alw-orbit.is-still .alw-orbit-face { animation: none; }
@keyframes alw-orbit-2x { to { transform: rotate(var(--alw-turn, 720deg)); } }

/* live: formun altında müşteri sorusu ve asistan cevabı */
.alw-chat { margin-top: 36px; min-height: 150px; display: flex; flex-direction: column; gap: 10px; }
.alw-msg { display: flex; align-items: flex-end; gap: 8px; max-width: 90%; animation: alw-msg-in .4s cubic-bezier(.2, .9, .3, 1.15) both; }
.alw-msg.is-bot { align-self: flex-end; flex-direction: row-reverse; }
.alw-msg-av { flex: none; width: 28px; height: 28px; border-radius: 50%; background: #fff; display: grid; place-items: center; box-shadow: 0 0 0 1px #E4EBF1; overflow: hidden; color: var(--alw-accent); }
.alw-msg-av .alw-orbit-face { box-shadow: none; animation: none; background: none; }
.alw-msg-av img { width: 60%; height: 60%; object-fit: contain; border-radius: 4px; }
.alw-msg-av svg { width: 16px; height: 16px; }
.alw-msg.is-bot .alw-msg-av img { width: 100%; height: 100%; border-radius: 50%; }
.alw-msg-body { min-width: 0; }
.alw-msg-body small { display: block; margin: 0 4px 3px; font-size: 11.5px; color: var(--alw-muted); }
.alw-msg.is-bot .alw-msg-body small { text-align: right; }
.alw-msg-body p { margin: 0; padding: 9px 13px; border-radius: 14px 14px 14px 4px; background: var(--alw-soft); font-size: 14px; line-height: 1.45; color: var(--alw-fg); }
.alw-msg.is-bot .alw-msg-body p { border-radius: 14px 14px 4px 14px; background: var(--alw-accent-soft); }
.alw-typing { display: inline-flex; gap: 4px; align-items: center; height: 38px; padding: 0 14px !important; }
.alw-typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--alw-accent); opacity: .35; animation: alw-typing 1s ease-in-out infinite; }
.alw-typing i:nth-child(2) { animation-delay: .15s; }
.alw-typing i:nth-child(3) { animation-delay: .3s; }
@keyframes alw-msg-in { from { opacity: 0; transform: translateY(8px) scale(.97); } to { opacity: 1; transform: none; } }
@keyframes alw-typing { 0%, 100% { opacity: .3; transform: none; } 50% { opacity: 1; transform: translateY(-3px); } }

/* glow: formun arkasında yavaşça kayan iki yumuşak ışık; zemin beyaz kalır */
.alw-login-form-side.is-glow { position: relative; isolation: isolate; }
/* Işıklar alanın içinde arka plan olarak kayar; kenardan taşmaz, kaydırma çubuğu çıkarmaz */
.alw-login-form-side.is-glow::before, .alw-login-form-side.is-glow::after {
  content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none; background-repeat: no-repeat;
}
.alw-login-form-side.is-glow::before {
  background-image: radial-gradient(circle, rgba(17, 157, 218, .16) 0%, rgba(17, 157, 218, .06) 40%, rgba(17, 157, 218, 0) 68%);
  background-size: 600px 600px; background-position: 115% -25%;
  animation: alw-drift-a 16s ease-in-out infinite alternate;
}
.alw-login-form-side.is-glow::after {
  background-image: radial-gradient(circle, rgba(92, 196, 238, .13) 0%, rgba(92, 196, 238, .04) 45%, rgba(92, 196, 238, 0) 70%);
  background-size: 520px 520px; background-position: -20% 120%;
  animation: alw-drift-b 19s ease-in-out infinite alternate;
}
@keyframes alw-drift-a { to { background-position: 70% 25%; } }
@keyframes alw-drift-b { to { background-position: 35% 75%; } }

/* glow: butonun üzerinden ara ara geçen parıltı */
.alw-btn.is-shine { position: relative; overflow: hidden; }
.alw-btn.is-shine::after {
  content: ""; position: absolute; top: 0; bottom: 0; left: -60%; width: 45%; pointer-events: none;
  background: linear-gradient(100deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, .22), rgba(255, 255, 255, 0));
  animation: alw-shine 5s ease-in-out infinite;
}
@keyframes alw-shine { 0%, 62% { left: -60%; } 100% { left: 130%; } }

/* Alçak ekran (ör. 1366×640): form ve sohbet sıkışır, sayfa yine kaydırmasız sığar */
@media (max-height: 760px) and (min-width: 861px) {
  .alw-brand { margin-bottom: 20px; }
  .alw-form { margin-top: 22px; gap: 14px; }
  .alw-field input, .alw-btn { height: 46px; }
  .alw-pw-toggle { top: 3px; }
  .alw-chat { margin-top: 20px; min-height: 0; gap: 8px; }
  .alw-msg-body small { display: none; }
  .alw-msg-body p { padding: 7px 12px; font-size: 13.5px; }
}

@media (prefers-reduced-motion: reduce) {
  .alw-rt-char.is-in, .alw-orbit-spin, .alw-orbit-face { animation: none; }
  .alw-orbit-link line { animation: none; stroke-dashoffset: 0; }
  .alw-orbit-node, .alw-orbit.is-cycle .alw-orbit-node, .alw-core-logo { transition: none; }
  .alw-core-logo.is-pulse, .alw-msg, .alw-typing i { animation: none; }
  .alw-login-form-side.is-glow::before, .alw-login-form-side.is-glow::after, .alw-btn.is-shine::after { animation: none; }
}

/* ---------- Dar ekran ---------- */
@media (max-width: 1100px) {
  .alw-login-hero { padding: 40px 36px; }
}
@media (max-width: 860px) {
  .alw-login { grid-template-columns: 1fr; }
  .alw-login-hero { display: none; }
  .alw-login-form-side { padding: 20px 16px; }
  .alw-chat { display: none; }
  .alw-title { font-size: 30px; }
}

/* Yalnızca önizleme: durum değiştirici */
.pv-bar { position: fixed; left: 16px; bottom: 16px; z-index: 10; display: flex; gap: 8px; flex-wrap: wrap; }
.pv-states { display: inline-flex; gap: 2px; padding: 4px; border-radius: 12px; background: #F1F5F8; box-shadow: 0 1px 3px rgba(15,30,42,.12); font: 12.5px "IBM Plex Sans", system-ui, sans-serif; }
.pv-states button { border: 0; background: none; border-radius: 9px; padding: 6px 11px; cursor: pointer; color: #4F6170; font: inherit; }
.pv-states button[aria-pressed="true"] { background: #fff; color: #0F1F2C; font-weight: 600; box-shadow: 0 1px 2px rgba(15,30,42,.1); }
</style>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>
<script type="text/babel" data-presets="react">
const { useEffect, useMemo, useRef, useState } = React;
/* Ailways · Giriş sayfası
   Yalnızca React'a bağlı; stiller LoginPage.css içinde, hepsi .alw-login altında (projedeki diğer stillere taşmaz).
   Fontlar: projede Manrope (600–800) ve IBM Plex Sans (400–600) yüklü olmalı.

   Kullanım:
     import LoginPage from './login/LoginPage';
     <LoginPage
       variant="focus"   // 'focus' | 'tagline' | 'cycle' | 'live' | 'glow' (aşağıda)
       logo={logoUrl}
       channels={[{ label: 'Trendyol', src: trendyolUrl, phrase: 'Trendyol’da', group: 'marketplace' }, { label: 'Web sitesi', phrase: 'web sitende', group: 'store' }, …]}
         // src yoksa küre ikonu; phrase olan kanallar sırayla cümlede döner ve yörüngede vurgulanır
         // group: 'social' | 'marketplace' | 'store' (yalnızca 'cycle' ve 'live' sürümleri kullanır)
       onSubmit={({ email, password, remember }) => …}
       forgotHref="/sifremi-unuttum"
       loading={false}
       error="E-posta ya da şifre hatalı."
     />
   Giriş mantığı bu bileşende yok; form verisini onSubmit'e verir.

   Sürümler (sol taraftaki kanal yörüngesi):
     focus   — cümlede adı geçen kanal yörüngede büyür, merkeze çizgiyle bağlanır.
     tagline — focus + merkezde Ailways logosu ile "Yapay zeka, gerçek satış" yazısı sırayla yer değiştirir.
     cycle   — kanallar gruplar halinde döner: sosyal medya → pazar yerleri → e-ticaret siteleri.
               Her grup hızlıca iki tur döner ve merkeze girer; logo büyüyüp biraz küçülür, yerini
               "Yapay zeka, gerçek satış" yazısına bırakır, sonra geri gelir ve sonraki grup merkezden çıkar.
     live    — cycle + formun altında o anki gruptan bir kanalda müşteri sorusu ve asistanın cevabı.
     glow    — cycle + sağ tarafta ortam: formun arkasında yavaşça kayan mavi ışık, e-posta alanında
               yazılıp silinen örnek adresler, butonda ara ara geçen parıltı. */



const ROT_INTERVAL = 2400;   // focus/tagline: kanal başına süre
const SWAP_INTERVAL = 3200;  // tagline: logo ↔ yazı
// cycle zamanlaması (ms): çıkış + tur + giriş → logo nabzı → yazı → logo geri
const TURNS = 1;             // grup başına tur sayısı
const SPIN_MS = 3400;        // dönüş süresi (çıkış ve giriş bu sürenin içinde)
const MOVE_MS = 650;         // merkezden çıkma / merkeze girme
const PULSE_MS = 650;        // logo büyür, biraz küçülür
const TEXT_MS = 2200;        // "Yapay zeka, gerçek satış"
const BACK_MS = 450;         // logo geri gelir

const DEFAULT_TAGLINE = ['Yapay zeka', 'gerçek satış'];
const EMAIL_EXAMPLES = ['ornek@magazan.com', 'destek@butigin.com', 'siparis@markan.com.tr'];

// live: grup başına örnek müşteri sorusu ve asistan cevabı (sırayla)
const DEFAULT_CHATS = {
  social: [
    { q: 'Bu elbisenin M bedeni kaldı mı?', a: 'Evet, M bedeni stokta. İstersen hemen sepetine ekleyeyim.' },
    { q: 'Siyah rengi ne zaman gelir?', a: 'Perşembe stoğa giriyor. Gelince sana haber vereyim mi?' },
  ],
  marketplace: [
    { q: 'Siparişim ne zaman kargoya verilir?', a: 'Siparişin bugün kargoya veriliyor, takip numarası SMS ile gelecek.' },
    { q: 'Ürün orijinal ve faturalı mı?', a: 'Evet, ürün orijinal ve faturasıyla birlikte gönderiliyor.' },
  ],
  store: [
    { q: 'İade süresi kaç gün?', a: 'Teslimattan sonra 14 gün içinde ücretsiz iade edebilirsin.' },
    { q: 'Kapıda ödeme var mı?', a: 'Evet, kapıda nakit ya da kartla ödeyebilirsin.' },
  ],
};

const GROUPS = [
  { key: 'social', phrase: 'sosyal medyada' },
  { key: 'marketplace', phrase: 'pazar yerlerinde' },
  { key: 'store', phrase: 'e-ticaret sitende' },
];

const prefersReducedMotion = () =>
  typeof window !== 'undefined' && window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;

/* React Bits RotatingText'ten uyarlandı (panel ana sayfasındakiyle aynı): harfler CSS animasyonuyla aşağıdan gelir.
   Sıra dışarıdan (idx) gelir; böylece yörüngedeki vurgu ile aynı anda değişir. */
function RotatingText({ texts, idx, stagger = 0.018 }) {
  const rotated = useRef(false);
  const first = useRef(idx);
  if (idx !== first.current) rotated.current = true;
  const split = t => (typeof Intl !== 'undefined' && Intl.Segmenter)
    ? Array.from(new Intl.Segmenter('tr', { granularity: 'grapheme' }).segment(t), x => x.segment)
    : Array.from(t);
  const words = useMemo(
    () => texts[idx].split(' ').map((w, i, arr) => ({ chars: split(w), space: i !== arr.length - 1 })),
    [texts, idx]
  );
  let n = 0;
  return (
    <span className="alw-rt">
      <span className="alw-sr">{texts[idx]}</span>
      <span key={idx} className="alw-rt" aria-hidden="true">
        {words.map((w, wi) => (
          <span key={wi} className="alw-rt-word">
            {w.chars.map((ch, ci) => (
              <span
                key={ci}
                className={`alw-rt-char${rotated.current ? ' is-in' : ''}`}
                style={rotated.current ? { animationDelay: `${(n++) * stagger}s` } : undefined}
              >{ch}</span>
            ))}
            {w.space && <span style={{ whiteSpace: 'pre' }}> </span>}
          </span>
        ))}
      </span>
    </span>
  );
}

const GlobeIcon = () => (
  <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" aria-hidden="true">
    <circle cx="12" cy="12" r="9" /><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z" />
  </svg>
);

/* Ana sayfadaki kanal yörüngesi; framer-motion yerine saf CSS dönüşü.
   active: cümlede adı geçen kanal; büyür, mavi halka alır ve merkeze ince bir çizgiyle bağlanır. */
const orbitPos = (i, n) => {
  const a = (i / n) * 2 * Math.PI - Math.PI / 2;
  return { x: 50 + 38 * Math.cos(a), y: 50 + 38 * Math.sin(a) };
};
// Kanal sayısı arttıkça düğümler küçülür, birbirine değmez
const nodeSize = n => `${Math.min(13.5, 150 / Math.max(n, 1))}%`;

const ChannelFace = ({ c }) => (
  <span className="alw-orbit-face">{c.src ? <img src={c.src} alt="" /> : <GlobeIcon />}</span>
);

function ChannelOrbit({ channels, active, core }) {
  const target = active >= 0 ? orbitPos(active, channels.length) : null;
  return (
    <div className="alw-orbit" style={{ '--alw-node': nodeSize(channels.length) }} aria-hidden="true">
      <span className="alw-orbit-ring" />
      <span className="alw-orbit-ring is-inner" />
      <div className="alw-orbit-spin">
        {target && (
          <svg key={active} className="alw-orbit-link" viewBox="0 0 100 100" preserveAspectRatio="none">
            <line x1="50" y1="50" x2={target.x} y2={target.y} pathLength="1" />
          </svg>
        )}
        {channels.map((c, i) => {
          const p = orbitPos(i, channels.length);
          return (
            <span key={c.label} className={`alw-orbit-node${i === active ? ' is-active' : ''}`} style={{ left: `${p.x}%`, top: `${p.y}%` }} title={c.label}>
              <ChannelFace c={c} />
            </span>
          );
        })}
      </div>
      {core}
    </div>
  );
}

/* cycle: yörüngede tek grup; open=false iken düğümler merkezde ve görünmez.
   Dönüş her grupta baştan başlar (key) ve iki tur sürer; düğümler başta merkezden çıkar, sonda merkeze girer. */
function CycleOrbit({ channels, open, cycleKey, reduce, core }) {
  return (
    <div
      className={`alw-orbit is-cycle${reduce ? ' is-still' : ''}`}
      style={{ '--alw-node': nodeSize(channels.length), '--alw-cycle': `${SPIN_MS}ms`, '--alw-turn': `${TURNS * 360}deg`, '--alw-move': `${MOVE_MS}ms` }}
      aria-hidden="true"
    >
      <span className="alw-orbit-ring" />
      <span className="alw-orbit-ring is-inner" />
      <div key={cycleKey} className="alw-orbit-spin">
        {channels.map((c, i) => {
          const p = open ? orbitPos(i, channels.length) : { x: 50, y: 50 };
          return (
            <span key={c.label} className={`alw-orbit-node${open ? '' : ' is-closed'}`} style={{ left: `${p.x}%`, top: `${p.y}%` }} title={c.label}>
              <ChannelFace c={c} />
            </span>
          );
        })}
      </div>
      {core}
    </div>
  );
}

/* Merkez: logo. Logo ile "Yapay zeka, gerçek satış" yer değiştirir; yazı harf harf gelir.
   tagline sürümünde kendi sayacıyla; cycle/live sürümünde mode dışarıdan gelir ('logo' | 'pulse' | 'text'). */
function OrbitCore({ logo, tagline, reduce, mode, textKey }) {
  const [tick, setTick] = useState(0);
  const swaps = !!tagline && !reduce && !mode;
  useEffect(() => {
    if (!swaps) return;
    const id = setInterval(() => setTick(t => t + 1), SWAP_INTERVAL);
    return () => clearInterval(id);
  }, [swaps]);
  const showText = !!tagline && (mode ? mode === 'text' : tick % 2 === 1);
  let n = 0;
  const chars = t => Array.from(t).map((ch, i) => (
    <span key={i} className="alw-rt-char is-in" style={{ animationDelay: `${(n++) * 0.03}s` }}>{ch === ' ' ? '\u00A0' : ch}</span>
  ));
  const logoState = showText ? ' is-out' : mode === 'pulse' ? ' is-pulse' : '';
  return (
    <div className="alw-orbit-core">
      {logo && <img className={`alw-core-logo${logoState}`} src={logo} alt="" />}
      {tagline && (
        <span key={mode ? textKey : tick} className={`alw-core-text${showText ? ' is-on' : ''}`}>
          <span className="alw-core-line">{showText && chars(tagline[0])}</span>
          <span className="alw-core-line is-accent">{showText && chars(tagline[1])}</span>
        </span>
      )}
    </div>
  );
}

/* cycle zamanlaması: grup değişir → düğümler merkezden çıkar → iki tur → merkeze girer
   → logo büyüyüp biraz küçülür → yerini yazıya bırakır → logo geri gelir → sonraki grup.
   round her grupta bir artar (sohbet örneklerini ve animasyonları baştan başlatmak için). */
function useCycle(enabled, count, reduce) {
  const [state, setState] = useState({ g: 0, round: 0, phase: 'closed' });
  useEffect(() => {
    if (!enabled || !count) return;
    if (reduce) {
      setState({ g: 0, round: 0, phase: 'open' });
      const id = setInterval(() => setState(s => ({ g: (s.g + 1) % count, round: s.round + 1, phase: 'open' })), 5000);
      return () => clearInterval(id);
    }
    let timers = [];
    let round = 0;
    const at = (ms, fn) => timers.push(setTimeout(fn, ms));
    const run = gi => {
      timers = [];
      const r = round++;
      const set = phase => setState({ g: gi, round: r, phase });
      set('closed');
      let t = 40;
      at(t, () => set('open'));
      t = SPIN_MS - MOVE_MS;      at(t, () => set('closing'));
      t = SPIN_MS;                at(t, () => set('pulse'));
      t += PULSE_MS;              at(t, () => set('text'));
      t += TEXT_MS;               at(t, () => set('back'));
      t += BACK_MS;               at(t, () => run((gi + 1) % count));
    };
    run(0);
    return () => timers.forEach(clearTimeout);
  }, [enabled, count, reduce]);
  return state;
}

/* live: müşteri sorusu → asistan yazıyor → cevap. runKey değişince baştan başlar. */
function LiveChat({ channel, sample, logo, runKey, reduce }) {
  const [step, setStep] = useState(reduce ? 3 : 0);
  useEffect(() => {
    if (reduce) { setStep(3); return; }
    setStep(0);
    const ts = [setTimeout(() => setStep(1), 250), setTimeout(() => setStep(2), 1150), setTimeout(() => setStep(3), 2300)];
    return () => ts.forEach(clearTimeout);
  }, [runKey, reduce]);
  if (!channel || !sample) return <div className="alw-chat" aria-hidden="true" />;
  return (
    <div className="alw-chat" aria-hidden="true">
      {step >= 1 && (
        <div className="alw-msg">
          <span className="alw-msg-av"><ChannelFace c={channel} /></span>
          <div className="alw-msg-body"><small>{channel.label} · müşteri</small><p>{sample.q}</p></div>
        </div>
      )}
      {step === 2 && (
        <div className="alw-msg is-bot">
          <span className="alw-msg-av">{logo && <img src={logo} alt="" />}</span>
          <div className="alw-msg-body"><p className="alw-typing"><i /><i /><i /></p></div>
        </div>
      )}
      {step >= 3 && (
        <div className="alw-msg is-bot">
          <span className="alw-msg-av">{logo && <img src={logo} alt="" />}</span>
          <div className="alw-msg-body"><small>Ailways asistanı</small><p>{sample.a}</p></div>
        </div>
      )}
    </div>
  );
}

/* glow: e-posta alanının örnek metni harf harf yazılır, bekler, silinir; sıradaki örneğe geçer */
function useTypedPlaceholder(texts, enabled) {
  const [txt, setTxt] = useState(texts[0]);
  useEffect(() => {
    if (!enabled) { setTxt(texts[0]); return; }
    let i = 0, n = 0, dir = 1, t;
    const step = () => {
      const full = texts[i];
      n += dir;
      setTxt(full.slice(0, n));
      if (dir === 1 && n === full.length) { dir = -1; t = setTimeout(step, 1800); return; }
      if (dir === -1 && n === 0) { dir = 1; i = (i + 1) % texts.length; t = setTimeout(step, 350); return; }
      t = setTimeout(step, dir === 1 ? 75 : 32);
    };
    setTxt('');
    t = setTimeout(step, 700);
    return () => clearTimeout(t);
  }, [texts, enabled]);
  return txt;
}

const EyeIcon = ({ off }) => (
  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
    <path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z" /><circle cx="12" cy="12" r="3" />
    {off && <path d="M4 4l16 16" />}

function LoginPage({
  variant = 'focus',
  logo,
  channels = [],
  tagline = DEFAULT_TAGLINE,
  chats = DEFAULT_CHATS,
  onSubmit,
  forgotHref = '#',
  loading = false,
  error = '',
}) {
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [remember, setRemember] = useState(true);
  const [showPw, setShowPw] = useState(false);
  const reduce = useMemo(prefersReducedMotion, []);

  const isCycle = variant === 'cycle' || variant === 'live' || variant === 'glow';
  const isGlow = variant === 'glow';
  const emailHint = useTypedPlaceholder(EMAIL_EXAMPLES, isGlow && !reduce);
  const isLive = variant === 'live';

  // focus/tagline: cümlede dönen kanal ve yörüngedeki vurgu aynı sırayı izler
  const spoken = useMemo(() => channels.map((c, i) => ({ i, phrase: c.phrase })).filter(c => c.phrase), [channels]);
  const [turn, setTurn] = useState(0);
  useEffect(() => {
    if (isCycle || reduce || spoken.length < 2) return;
    const id = setInterval(() => setTurn(t => (t + 1) % spoken.length), ROT_INTERVAL);
    return () => clearInterval(id);
  }, [isCycle, reduce, spoken.length]);

  // cycle: yalnızca kanalı olan gruplar, sırayla
  const groups = useMemo(
    () => GROUPS.map(gr => ({ ...gr, items: channels.filter(c => c.group === gr.key) })).filter(gr => gr.items.length),
    [channels]
  );
  const cycle = useCycle(isCycle, groups.length, reduce);
  const group = groups[cycle.g % (groups.length || 1)];
  const cycleOpen = cycle.phase === 'open';
  const coreMode = cycle.phase === 'pulse' ? 'pulse' : cycle.phase === 'text' ? 'text' : 'logo';

  // live: o anki gruptan sırayla bir kanal ve bir örnek konuşma
  const chatList = group ? chats[group.key] || [] : [];
  const chatChannel = group ? group.items[cycle.round % group.items.length] : null;
  const chatSample = chatList.length ? chatList[Math.floor(cycle.round / (groups.length || 1)) % chatList.length] : null;

  const phrases = isCycle ? groups.map(gr => gr.phrase) : spoken.map(c => c.phrase);
  const phraseIdx = isCycle ? cycle.g % (groups.length || 1) : turn % (spoken.length || 1);
  const current = isCycle ? null : spoken[phraseIdx];
  const core = isCycle
    ? <OrbitCore logo={logo} tagline={tagline} reduce={reduce} mode={reduce ? 'logo' : coreMode} textKey={cycle.round} />
    : <OrbitCore logo={logo} tagline={variant === 'tagline' ? tagline : null} reduce={reduce} />;

  const submit = e => {
    e.preventDefault();
    if (!loading) onSubmit?.({ email, password, remember });
  };

  return (
    <div className="alw-login">
      <aside className="alw-login-hero" aria-label="Ailways">
        <div className="alw-hero-inner">
          <p className="alw-lede">
            <span className="alw-lede-line">
              Asistanın{' '}
              {phrases.length > 0 && (
                <span className="alw-pill">
                  {reduce ? phrases[phraseIdx] : <RotatingText key={variant} texts={phrases} idx={phraseIdx} />}
                </span>
              )}
            </span>
            <span className="alw-lede-line">müşterilerine cevap veriyor.</span>
          </p>
          {isCycle
            ? group && <CycleOrbit channels={group.items} open={cycleOpen} cycleKey={cycle.round} reduce={reduce} core={core} />
            : channels.length > 0 && <ChannelOrbit channels={channels} active={current ? current.i : -1} core={core} />}
        </div>
      </aside>

      <main className={`alw-login-form-side${isGlow ? ' is-glow' : ''}`}>
        <div className="alw-form-wrap">
          <div className="alw-brand">
            {logo && <img src={logo} alt="" />}
            <span>Ailways</span>
          </div>
          <h1 className="alw-title">Panele giriş yap</h1>

          {error && <p className="alw-alert" role="alert">{error}</p>}

          <form className="alw-form" onSubmit={submit} noValidate>
            <div className="alw-field">
              <label htmlFor="alw-email">E-posta</label>
              <input
                id="alw-email" type="email" autoComplete="email" inputMode="email" required
                placeholder={isGlow ? emailHint : EMAIL_EXAMPLES[0]}
                value={email} onChange={e => setEmail(e.target.value)}
                aria-invalid={error ? true : undefined}
              />
            </div>

            <div className="alw-field">
              <div className="alw-field-row">
                <label htmlFor="alw-password">Şifre</label>
                <a href={forgotHref} className="alw-link">Şifremi unuttum</a>
              </div>
              <div className="alw-pw">
                <input
                  id="alw-password" type={showPw ? 'text' : 'password'} autoComplete="current-password" required
                  value={password} onChange={e => setPassword(e.target.value)}
                  aria-invalid={error ? true : undefined}
                />
                <button type="button" className="alw-pw-toggle" onClick={() => setShowPw(v => !v)} aria-label={showPw ? 'Şifreyi gizle' : 'Şifreyi göster'} aria-pressed={showPw}>
                  <EyeIcon off={showPw} />
                </button>
              </div>
            </div>

            <label className="alw-check">
              <input type="checkbox" checked={remember} onChange={e => setRemember(e.target.checked)} />
              Beni hatırla
            </label>

            <button type="submit" className={`alw-btn${isGlow ? ' is-shine' : ''}`} disabled={loading} aria-busy={loading || undefined}>
              {loading && <span className="alw-spin" aria-hidden="true" />}
              {loading ? 'Giriş yapılıyor' : 'Giriş yap'}
            </button>
          </form>

          {isLive && <LiveChat channel={chatChannel} sample={chatSample} logo={logo} runKey={cycle.round} reduce={reduce} />}
        </div>

        <p className="alw-foot">© {new Date().getFullYear()} Ailways</p>
      </main>
    </div>
  );

const VARIANTS = [['focus', '1 · Vurgu'], ['tagline', '2 · Yapay zeka'], ['cycle', '3 · Döngü'], ['live', '4 · Canlı sohbet'], ['glow', '5 · Işık']];
function Preview() {
  const [st, setSt] = useState('normal');
  const fromHash = location.hash.slice(1);
  const [v, setV] = useState(SETS[fromHash] ? fromHash : 'focus');
  const choose = k => { setV(k); try { history.replaceState(null, '', '#' + k); } catch (e) {} };
  return (
    <>

        <div className="pv-states" role="group" aria-label="Sürüm">

            <button key={k} type="button" aria-pressed={v === k} onClick={() => choose(k)}>{l}</button>

        </div>
        <div className="pv-states" role="group" aria-label="Form durumu">

            <button key={k} type="button" aria-pressed={st === k} onClick={() => setSt(k)}>{l}</button>

        </div>
      </div>
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Preview />);
