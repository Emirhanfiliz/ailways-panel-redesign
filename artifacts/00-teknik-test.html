// ---- import satırlarının yerine geçen global'ler ----
const { useCallback, useEffect, useRef, useState } = React;
const { motion, useInView, useMotionValue, useSpring } = Motion;
const { AreaChart, Area, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer } = Recharts;

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* =========================================================================
   React Bits · CountUp (src/tailwind/TextAnimations/CountUp)
   Değişiklik: yalnızca import satırları. Kod birebir.
   ========================================================================= */
function CountUp({ to, from = 0, direction = 'up', delay = 0, duration = 2, className = '', startWhen = true, separator = '', onStart, onEnd }) {
  const ref = useRef(null);
  const motionValue = useMotionValue(direction === 'down' ? to : from);
  const damping = 20 + 40 * (1 / duration);
  const stiffness = 100 * (1 / duration);
  const springValue = useSpring(motionValue, { damping, stiffness });
  const isInView = useInView(ref, { once: true, margin: '0px' });
  const getDecimalPlaces = num => {
    const str = num.toString();
    if (str.includes('.')) { const decimals = str.split('.')[1]; if (parseInt(decimals) !== 0) return decimals.length; }
    return 0;
  };
  const maxDecimals = Math.max(getDecimalPlaces(from), getDecimalPlaces(to));
  const formatValue = useCallback(latest => {
    const hasDecimals = maxDecimals > 0;
    const options = { useGrouping: !!separator, minimumFractionDigits: hasDecimals ? maxDecimals : 0, maximumFractionDigits: hasDecimals ? maxDecimals : 0 };
    const formattedNumber = Intl.NumberFormat('en-US', options).format(latest);
    return separator ? formattedNumber.replace(/,/g, separator) : formattedNumber;
  }, [maxDecimals, separator]);
  useEffect(() => { if (ref.current) ref.current.textContent = formatValue(direction === 'down' ? to : from); }, [from, to, direction, formatValue]);
  useEffect(() => {
    if (isInView && startWhen) {
      if (typeof onStart === 'function') onStart();
      const timeoutId = setTimeout(() => { motionValue.set(direction === 'down' ? from : to); }, delay * 1000);
      const durationTimeoutId = setTimeout(() => { if (typeof onEnd === 'function') onEnd(); }, delay * 1000 + duration * 1000);
      return () => { clearTimeout(timeoutId); clearTimeout(durationTimeoutId); };
    }
  }, [isInView, startWhen, motionValue, direction, from, to, delay, onStart, onEnd, duration]);
  useEffect(() => {
    const unsubscribe = springValue.on('change', latest => { if (ref.current) ref.current.textContent = formatValue(latest); });
    return () => unsubscribe();
  }, [springValue, formatValue]);
  return <span className={className} ref={ref} />;
}

/* =========================================================================
   React Bits · SpotlightCard (src/tailwind/Components/SpotlightCard)
   Değişiklik: sabit koyu renkler (border-neutral-800 bg-neutral-900, rounded-3xl p-8)
   panel token'larıyla değiştirildi. Davranış birebir.
   ========================================================================= */
const SpotlightCard = ({ children, className = '', spotlightColor = 'rgba(255, 255, 255, 0.25)' }) => {
  const divRef = useRef(null);
  const [isFocused, setIsFocused] = useState(false);
  const [position, setPosition] = useState({ x: 0, y: 0 });
  const [opacity, setOpacity] = useState(0);
  const handleMouseMove = e => {
    if (!divRef.current || isFocused) return;
    const rect = divRef.current.getBoundingClientRect();
    setPosition({ x: e.clientX - rect.left, y: e.clientY - rect.top });
  };
  return (
    <div ref={divRef} onMouseMove={handleMouseMove}
      onFocus={() => { setIsFocused(true); setOpacity(0.6); }} onBlur={() => { setIsFocused(false); setOpacity(0); }}
      onMouseEnter={() => setOpacity(0.6)} onMouseLeave={() => setOpacity(0)}
      className={`relative rounded-2xl border border-line bg-surface overflow-hidden p-5 ${className}`}>
      <div className="pointer-events-none absolute inset-0 opacity-0 transition-opacity duration-500 ease-in-out"
        style={{ opacity, background: `radial-gradient(circle at ${position.x}px ${position.y}px, ${spotlightColor}, transparent 80%)` }} />
      {children}
    </div>
  );
};

/* =========================================================================
   React Bits · AnimatedList (src/tailwind/Components/AnimatedList)
   Değişiklikler: w-[500px] → w-full; koyu sabit renkler (#111, #222, #120F17) → token;
   item içeriği string yerine render fonksiyonu. enableArrowNavigation=false ile kullanılıyor,
   çünkü açıkken window üzerinde Tab tuşunu yakalıyor ve sayfanın klavye gezintisini bozuyor.
   ========================================================================= */
const AnimatedItem = ({ children, delay = 0, index, onMouseEnter, onClick }) => {
  const ref = useRef(null);
  const inView = useInView(ref, { amount: 0.5, triggerOnce: false });
  return (
    <motion.div ref={ref} data-index={index} onMouseEnter={onMouseEnter} onClick={onClick}
      initial={{ scale: 0.7, opacity: 0 }}
      animate={inView ? { scale: 1, opacity: 1 } : { scale: 0.7, opacity: 0 }}
      transition={{ duration: reduceMotion ? 0 : 0.2, delay: reduceMotion ? 0 : delay }}
      className="mb-2 cursor-pointer">
      {children}
    </motion.div>
  );
};

const AnimatedList = ({ items = [], renderItem, onItemSelect, showGradients = true, className = '', initialSelectedIndex = -1 }) => {
  const listRef = useRef(null);
  const [selectedIndex, setSelectedIndex] = useState(initialSelectedIndex);
  const [topGradientOpacity, setTopGradientOpacity] = useState(0);
  const [bottomGradientOpacity, setBottomGradientOpacity] = useState(1);
  const handleScroll = useCallback(e => {
    const { scrollTop, scrollHeight, clientHeight } = e.target;
    setTopGradientOpacity(Math.min(scrollTop / 50, 1));
    const bottomDistance = scrollHeight - (scrollTop + clientHeight);
    setBottomGradientOpacity(scrollHeight <= clientHeight ? 0 : Math.min(bottomDistance / 50, 1));
  }, []);
  return (
    <div className={`relative w-full ${className}`}>
      <div ref={listRef} className="max-h-[340px] overflow-y-auto p-3" onScroll={handleScroll} style={{ scrollbarWidth: 'thin' }}>
        {items.map((item, index) => (
          <AnimatedItem key={index} delay={0.1} index={index}
            onMouseEnter={() => setSelectedIndex(index)}
            onClick={() => { setSelectedIndex(index); onItemSelect && onItemSelect(item, index); }}>
            <div className={`p-3 rounded-xl border transition-colors ${selectedIndex === index ? 'bg-accent-soft border-accent/30' : 'bg-surface border-line'}`}>
              {renderItem ? renderItem(item, selectedIndex === index) : <p className="m-0">{item}</p>}
            </div>
          </AnimatedItem>
        ))}
      </div>
      {showGradients && (<>
        <div className="absolute top-0 left-0 right-0 h-[40px] bg-gradient-to-b from-surface-2 to-transparent pointer-events-none transition-opacity duration-300" style={{ opacity: topGradientOpacity }} />
        <div className="absolute bottom-0 left-0 right-0 h-[70px] bg-gradient-to-t from-surface-2 to-transparent pointer-events-none transition-opacity duration-300" style={{ opacity: bottomGradientOpacity }} />
      </>)}
    </div>
  );
};

// ---- Tema token'larını JS'ten okumak (Recharts SVG attribute'ları var() kabul etmiyor) ----
function useTokens(names) {
  const read = () => { const cs = getComputedStyle(document.documentElement); return Object.fromEntries(names.map(n => [n, cs.getPropertyValue('--' + n).trim()])); };
  const [t, setT] = useState(read);
  useEffect(() => {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const upd = () => setT(read());
    mq.addEventListener('change', upd);
    const mo = new MutationObserver(upd);
    mo.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
    return () => { mq.removeEventListener('change', upd); mo.disconnect(); };
  }, []);
  return t;
}
