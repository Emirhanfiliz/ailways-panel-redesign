<title>Ailways Ana Sayfa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap&subset=latin-ext" rel="stylesheet">
<style>
  /* Varyant C (refs/image copy.png): sade beyaz kenar çubuğu + kartlı ana sayfa. Yazı: IBM Plex Sans (resmî, kurumsal).
     Menüde üzerine gelinen satırın ikonu maviye boyanır, seçili satır açık mavi zemin ve solda mavi çizgi alır.
     Ana sayfa v3: eski Ana Sayfa'nın bölümleri ve sırası korunur (asistanlar, bu ay, kanal dağılımı + kullanım, hızlı erişim, son siparişler); tek kolon, sade kartlar. */
  :root {
    --bg: #FFFFFF;
    --surface: #FFFFFF;
    --soft: #F4F7FA;          /* hover zemini, ikon kutusu */
    --soft-2: #EAF0F5;
    --line: #E6ECF1;
    --fg: #0F1F2C;
    --muted: #66788A;
    --faint: #94A3B1;
    --accent: #0A87C5;
    --accent-2: #119DDA;
    --accent-3: #5CC4EE;
    --accent-soft: #E7F5FC;
    --ink-btn: #0F1F2C;
    --ok: #13875F;
    --ok-soft: #E3F6EE;
    --crit: #D2392F;
    --crit-soft: #FDECEA;
    --warn: #B45F00;
    --warn-soft: #FFF3E1;
    --shadow-sm: 0 1px 2px rgba(15, 31, 44, .05);
    --shadow: 0 1px 2px rgba(15, 31, 44, .04), 0 6px 18px rgba(15, 31, 44, .06);
    --font-sans: "IBM Plex Sans", ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
    color-scheme: light;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-sans); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; }
  h1, h2, h3 { margin: 0; text-wrap: balance; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
  .num { font-variant-numeric: tabular-nums; }
  #root { height: 100%; }
  .app { display: flex; height: 100%; }

  /* ================= Kenar çubuğu ================= */
  .sb { flex: none; width: 256px; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; padding: 18px 14px 14px; border-right: 1px solid var(--line); background: var(--surface); transition: width 220ms cubic-bezier(.23,1,.32,1), padding 220ms cubic-bezier(.23,1,.32,1); position: relative; z-index: 30; overflow: hidden; }
  .sb[data-collapsed] { width: 76px; padding-left: 12px; padding-right: 12px; }
  .sb-top { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 4px 0 6px; margin-bottom: 16px; }
  .sb[data-collapsed] .sb-top { flex-direction: column; height: auto; gap: 12px; padding: 0; }
  .logo { width: 30px; height: 30px; border-radius: 9px; flex: none; display: block; }
  .brand { font-size: 19px; font-weight: 600; letter-spacing: -0.01em; flex: 1; white-space: nowrap; }
  .icon-btn { width: 32px; height: 32px; border-radius: 9px; border: 0; background: none; color: var(--muted); display: grid; place-items: center; cursor: pointer; flex: none; transition: background-color 150ms ease, color 150ms ease; }
  .icon-btn:hover { background: var(--soft); color: var(--fg); }

  .ws { display: flex; align-items: center; gap: 10px; width: 100%; height: 42px; padding: 0 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); cursor: pointer; margin-bottom: 14px; box-shadow: var(--shadow-sm); text-align: left; }
  .ws:hover { border-color: #D3DEE7; }
  .ws-dot { width: 20px; height: 20px; border-radius: 50%; flex: none; background: conic-gradient(from 200deg, var(--accent-3), var(--accent), var(--accent-2), var(--accent-3)); }
  .ws b { flex: 1; min-width: 0; font-weight: 550; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sb[data-collapsed] .ws { width: 52px; justify-content: center; padding: 0; }

  .sb-scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; margin: 0 -4px; padding: 0 4px; scrollbar-width: none; }
  .sb-scroll::-webkit-scrollbar { display: none; }
  .group { font-size: 12px; color: var(--faint); font-weight: 500; padding: 12px 10px 4px; white-space: nowrap; }
  .sb[data-collapsed] .group { height: 1px; padding: 0; margin: 12px 10px; background: var(--line); color: transparent; overflow: hidden; }

  .nav { position: relative; display: flex; align-items: center; gap: 10px; width: 100%; height: 38px; padding: 0 8px 0 5px; margin-bottom: 2px; border: 0; border-radius: 11px; background: none; cursor: pointer; text-align: left; color: var(--muted); font-size: 14px; white-space: nowrap; transition: background-color 160ms ease, color 160ms ease, box-shadow 160ms ease; }
  .nav-ic { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; flex: none; color: var(--muted); transition: background 180ms ease, color 180ms ease, box-shadow 180ms ease, transform 180ms ease; }
  .nav-lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  /* üzerine gelince: satır açık zemin, ikon maviye boyanır */
  .nav:hover { background: var(--soft); color: var(--fg); }
  .nav:hover .nav-ic { color: var(--accent); }
  /* seçili: ikon dolu mavi kutu, satır beyaz kart */
  .nav[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .nav[aria-current="page"] .nav-ic { color: var(--accent); }
  .nav[aria-current="page"]::before { content: ""; position: absolute; left: -14px; top: 9px; bottom: 9px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
  .sb[data-collapsed] .nav { width: 52px; padding: 0; justify-content: center; }
  .sb[data-collapsed] .nav-ic { width: 36px; height: 36px; border-radius: 11px; }
  .sb[data-collapsed] .nav[aria-current="page"] { background: none; }
  .sb[data-collapsed] .nav[aria-current="page"] .nav-ic { background: var(--accent-soft); }
  .sb[data-collapsed] .nav[aria-current="page"]::before { left: -12px; }
  .badge { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 999px; font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums; flex: none; background: var(--soft-2); color: var(--muted); }
  .badge.crit { background: var(--crit-soft); color: var(--crit); }
  .badge.accent { background: var(--accent-soft); color: var(--accent); }
  .badge-dot { position: absolute; top: 3px; right: 4px; width: 9px; height: 9px; border-radius: 50%; background: var(--crit); box-shadow: 0 0 0 2px #fff; }
  .badge-dot.accent { background: var(--accent-2); }

  .btn-sm { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 500; font-size: 13px; box-shadow: var(--shadow-sm); }
  .btn-sm:hover { border-color: #CCD8E2; }

  /* Kurulum baloncuğu: sağ altta, tıklayınca adım listesi açılır */
  .bubble { position: fixed; right: 24px; bottom: 24px; z-index: 50; width: 56px; height: 56px; border-radius: 50%; border: 0; padding: 0; cursor: pointer; background: var(--surface); box-shadow: 0 0 0 1px var(--line), 0 10px 28px rgba(15, 31, 44, .14); display: grid; place-items: center; transition: transform 160ms ease, box-shadow 160ms ease; }
  .bubble:hover { transform: translateY(-2px); box-shadow: 0 0 0 1px #D3E3EE, 0 14px 32px rgba(15, 31, 44, .18); }
  .bubble svg.ring { position: absolute; inset: 0; transform: rotate(-90deg); }
  .bubble .core { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: #fff; }
  .bubble .cnt { position: absolute; top: -4px; right: -4px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--fg); color: #fff; font-size: 11px; font-weight: 600; display: grid; place-items: center; box-shadow: 0 0 0 2px #fff; }
  .checklist { position: fixed; right: 24px; bottom: 92px; z-index: 50; width: 320px; max-width: calc(100vw - 32px); background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 2px 4px rgba(15,31,44,.05), 0 20px 48px rgba(15,31,44,.16); overflow: hidden; transform-origin: bottom right; animation: pop 180ms cubic-bezier(.23,1,.32,1); }
  @keyframes pop { from { opacity: 0; transform: scale(.96) translateY(6px); } }
  .cl-head { padding: 16px 16px 12px; border-bottom: 1px solid var(--line); }
  .cl-head b { display: block; font-size: 15px; font-weight: 600; }
  .cl-head p { margin: 2px 0 10px; color: var(--muted); font-size: 13px; }
  .cl-bar { height: 6px; border-radius: 3px; background: var(--soft-2); overflow: hidden; }
  .cl-bar i { display: block; height: 100%; background: var(--accent); }
  .cl-list { list-style: none; margin: 0; padding: 6px; }
  .cl-item { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px; border: 0; background: none; border-radius: 12px; cursor: pointer; text-align: left; }
  .cl-item:hover { background: var(--soft); }
  .cl-check { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid #C8D5DF; flex: none; }
  .cl-item b { display: block; font-weight: 550; font-size: 13.5px; }
  .cl-item span.d { display: block; color: var(--muted); font-size: 12.5px; }
  .cl-item .go { margin-left: auto; color: var(--faint); display: inline-grid; }
  .tip { position: fixed; z-index: 60; pointer-events: none; transform: translateY(-50%); padding: 6px 10px; border-radius: 8px; background: var(--fg); color: #fff; font-size: 12.5px; font-weight: 500; white-space: nowrap; }

  /* ================= Ana alan ================= */
  .main { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; }
  .topbar { flex: none; height: 60px; display: flex; align-items: center; gap: 10px; padding: 0 28px; border-bottom: 1px solid var(--line); }
  .topbar .ttl { font-weight: 550; font-size: 15px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .search { display: flex; align-items: center; gap: 8px; height: 38px; width: 300px; max-width: 34vw; padding: 0 8px 0 12px; border-radius: 11px; background: var(--soft); color: var(--faint); box-sizing: border-box; }
  .search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font: inherit; color: var(--fg); }
  .search input::placeholder { color: var(--faint); }
  kbd { font-family: var(--font-mono); font-size: 11px; padding: 2px 6px; border-radius: 6px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); }
  .tb-btn { position: relative; width: 38px; height: 38px; border-radius: 11px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; color: var(--muted); cursor: pointer; flex: none; }
  .tb-btn:hover { color: var(--fg); border-color: #CCD8E2; }
  .tb-dot { position: absolute; top: 8px; right: 9px; width: 7px; height: 7px; border-radius: 50%; background: var(--crit); box-shadow: 0 0 0 2px #fff; }
  .avatar { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; color: #fff; background: linear-gradient(160deg, var(--accent-3), var(--accent)); flex: none; }

  .content { flex: 1; min-height: 0; overflow-y: auto; padding: 26px 28px 96px; }
  .wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
  .welcome { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 4px; }
  .welcome h1 { font-size: 30px; font-weight: 600; letter-spacing: -0.015em; line-height: 1.2; }
  .welcome h1 .name { color: var(--accent); }
  .welcome p { margin: 6px 0 0; color: var(--muted); font-size: 15px; }
  .btn-dark { display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px; border-radius: 12px; border: 0; background: var(--ink-btn); color: #fff; font-weight: 550; cursor: pointer; box-shadow: 0 6px 16px rgba(15, 31, 44, .18); }
  .btn-dark:hover { background: #1B3142; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 18px; min-width: 0; }
  .card-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .card-h h2 { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; display: flex; align-items: center; gap: 6px; }
  .link { display: inline-flex; align-items: center; gap: 4px; color: var(--accent); font-weight: 550; font-size: 13.5px; background: none; border: 0; cursor: pointer; padding: 4px 0; }
  .link:hover { text-decoration: underline; text-underline-offset: 3px; }

  /* ================= Ana sayfa v3: eski yapı, yeni görünüm ================= */
  .wrap { gap: 32px; }
  .hello { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .hello h1 { font-size: 28px; font-weight: 600; letter-spacing: -0.015em; line-height: 1.2; }
  .hello p { margin: 6px 0 0; color: var(--muted); font-size: 15px; }
  .btn-primary { display: inline-flex; align-items: center; gap: 8px; height: 42px; padding: 0 16px; border-radius: 11px; border: 0; background: var(--accent); color: #fff; font-weight: 550; cursor: pointer; box-shadow: 0 4px 12px rgba(10, 135, 197, .25); }
  .btn-primary:hover { background: #0979B1; }

  .sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .sec-h h2 { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .sec-h .aside { font-size: 13px; color: var(--faint); }

  /* Asistanlar */
  .assts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
  .as { border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; transition: border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease; }
  .as:hover { border-color: #CFE3EE; box-shadow: 0 8px 24px rgba(10, 135, 197, .08); transform: translateY(-1px); }
  .as-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .as-ic { width: 44px; height: 44px; border-radius: 13px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
  .live-pill { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 999px; background: var(--ok-soft); color: var(--ok); font-size: 12px; font-weight: 600; }
  .live-pill i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .as b { display: block; font-size: 15.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .as small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
  .as-ch { display: flex; gap: 6px; flex-wrap: wrap; }
  .as-ch span { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 9px 0 6px; border-radius: 8px; background: var(--soft); font-size: 12.5px; font-weight: 500; }
  .as-ch img { width: 15px; height: 15px; border-radius: 3px; object-fit: contain; }
  .as-ch .gl { color: var(--accent); display: inline-grid; }
  .as-act { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: auto; }
  .as-act button { height: 36px; border-radius: 10px; font-weight: 550; font-size: 13.5px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .as-act .t { border: 0; background: var(--accent); color: #fff; }
  .as-act .t:hover { background: #0979B1; }
  .as-act .y { border: 1px solid var(--line); background: #fff; color: var(--fg); }
  .as-act .y:hover { border-color: #C9D7E2; }

  /* Bu ay */
  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
  .kpi { border: 1px solid var(--line); border-radius: 18px; padding: 18px; min-width: 0; }
  .kpi-l { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13.5px; }
  .kpi-l .ic { width: 30px; height: 30px; border-radius: 9px; background: var(--soft); display: grid; place-items: center; color: var(--muted); }
  .kpi-v { font-size: 32px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; margin: 16px 0 8px; }
  .kpi-c { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
  .delta { display: inline-flex; align-items: center; gap: 2px; font-weight: 600; font-size: 12.5px; padding: 2px 7px; border-radius: 7px; }
  .delta.down { color: var(--crit); background: var(--crit-soft); }
  .kpi.hero { border: 0; color: #fff; background: radial-gradient(120% 120% at 100% 0%, rgba(255,255,255,.22), transparent 55%), linear-gradient(150deg, #2BB0E8, #0A82BE); box-shadow: 0 10px 28px rgba(10, 130, 190, .25); }
  .kpi.hero .kpi-l { color: rgba(255,255,255,.88); }
  .kpi.hero .kpi-l .ic { background: rgba(255,255,255,.2); color: #fff; }
  .kpi.hero .kpi-c { color: rgba(255,255,255,.85); }
  .kpi.hero .delta.down { background: rgba(255,255,255,.2); color: #fff; }

  /* Kanal dağılımı + kullanım */
  .duo { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
  .panel { border: 1px solid var(--line); border-radius: 18px; padding: 20px; min-width: 0; }
  .panel-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
  .panel-h h3 { font-size: 16px; font-weight: 600; }
  .empty-row { display: flex; align-items: center; gap: 16px; padding: 4px 0; }
  .empty-ic { width: 48px; height: 48px; border-radius: 14px; background: var(--soft); color: var(--faint); display: grid; place-items: center; flex: none; }
  .empty-row b { display: block; font-weight: 600; font-size: 14.5px; }
  .empty-row p { margin: 2px 0 0; color: var(--muted); font-size: 13.5px; }
  .logos-row { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
  .logos-row span { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); display: grid; place-items: center; color: var(--accent); }
  .logos-row img { width: 20px; height: 20px; object-fit: contain; border-radius: 4px; }
  .meters { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 24px; }
  .meter .top { display: flex; justify-content: space-between; align-items: baseline; font-size: 13.5px; margin-bottom: 8px; }
  .meter .top span { color: var(--muted); }
  .meter .top b { font-weight: 600; }
  .track { height: 8px; border-radius: 4px; background: var(--soft); overflow: hidden; }
  .track i { display: block; height: 100%; border-radius: 4px; background: var(--accent-2); min-width: 0; }
  .meter.full .top b { color: var(--warn); }
  .meter.full .track i { background: #F0A030; }

  /* Hızlı erişim */
  .quick { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
  .qa { display: flex; align-items: center; gap: 14px; padding: 16px; border: 1px solid var(--line); border-radius: 18px; background: #fff; cursor: pointer; text-align: left; min-width: 0; transition: border-color 160ms ease, background-color 160ms ease; }
  .qa:hover { border-color: #CFE3EE; background: #FAFDFF; }
  .qa:hover .qa-ic { background: var(--accent); color: #fff; }
  .qa-ic { width: 44px; height: 44px; border-radius: 13px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; transition: background-color 160ms ease, color 160ms ease; }
  .qa b { display: block; font-weight: 600; font-size: 15px; }
  .qa small { display: block; color: var(--muted); font-size: 13px; margin-top: 1px; }
  .qa .go { margin-left: auto; color: var(--faint); display: inline-grid; }

  /* Son siparişler */
  .orders-empty { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }

  .placeholder { border: 1.5px dashed var(--line); border-radius: 20px; min-height: 360px; display: grid; place-items: center; text-align: center; color: var(--muted); padding: 24px; }
  .placeholder h2 { font-size: 22px; color: var(--fg); margin: 12px 0 6px; }
  .placeholder p { margin: 0 auto 16px; max-width: 46ch; }

  .scrim { display: none; }
  .only-mobile { display: none !important; }
  @media (max-width: 1180px) {
    .assts, .kpis, .quick { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 760px) {
    .duo { grid-template-columns: 1fr; }
  }
  @media (max-width: 860px) {
    .sb { position: fixed; inset: 0 auto 0 0; width: 272px !important; padding: 18px 14px 14px !important; transform: translateX(-100%); transition: transform 240ms cubic-bezier(.23,1,.32,1); box-shadow: 0 20px 50px rgba(15,31,44,.18); }
    .sb[data-mobile-open] { transform: none; }
    .scrim { display: block; position: fixed; inset: 0; z-index: 25; background: rgba(8, 20, 30, .3); opacity: 0; pointer-events: none; transition: opacity 200ms ease; }
    .scrim[data-on] { opacity: 1; pointer-events: auto; }
    .only-mobile { display: grid !important; }
    .only-desktop { display: none !important; }
    .topbar { padding: 0 16px; }
    .search { display: none; }
    .content { padding: 20px 16px 48px; }
    .hello h1 { font-size: 24px; }
  }
  @media (max-width: 560px) {
    .assts, .quick { grid-template-columns: 1fr; }
    .kpi-v { font-size: 26px; }
    .meters { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) { .sb, .scrim, .nav, .nav-ic { transition: none; } }

/* React Bits · CountUp (yalnızca import satırları değişti) */
function CountUp({ to, from = 0, direction = 'up', delay = 0, duration = 2, className = '', startWhen = true, separator = '', onStart, onEnd }) {
  const ref = useRef(null);
  const motionValue = useMotionValue(direction === 'down' ? to : from);
  const damping = 20 + 40 * (1 / duration);
  const stiffness = 100 * (1 / duration);
  const springValue = useSpring(motionValue, { damping, stiffness });
  const isInView = useInView(ref, { once: true, margin: '0px' });
  const getDecimalPlaces = num => { const str = num.toString(); if (str.includes('.')) { const d = str.split('.')[1]; if (parseInt(d) !== 0) return d.length; } return 0; };
  const maxDecimals = Math.max(getDecimalPlaces(from), getDecimalPlaces(to));
  const formatValue = useCallback(latest => {
    const hasDecimals = maxDecimals > 0;
    const options = { useGrouping: !!separator, minimumFractionDigits: hasDecimals ? maxDecimals : 0, maximumFractionDigits: hasDecimals ? maxDecimals : 0 };
    const formattedNumber = Intl.NumberFormat('en-US', options).format(latest);
    return separator ? formattedNumber.replace(/,/g, separator) : formattedNumber;
  }, [maxDecimals, separator]);
  useEffect(() => { if (ref.current) ref.current.textContent = formatValue(direction === 'down' ? to : from); }, [from, to, direction, formatValue]);
  useEffect(() => {
    if (isInView && startWhen) {
      if (typeof onStart === 'function') onStart();
      const t1 = setTimeout(() => { motionValue.set(direction === 'down' ? from : to); }, delay * 1000);
      const t2 = setTimeout(() => { if (typeof onEnd === 'function') onEnd(); }, delay * 1000 + duration * 1000);
      return () => { clearTimeout(t1); clearTimeout(t2); };
    }
  }, [isInView, startWhen, motionValue, direction, from, to, delay, onStart, onEnd, duration]);
  useEffect(() => { const u = springValue.on('change', l => { if (ref.current) ref.current.textContent = formatValue(l); }); return () => u(); }, [springValue, formatValue]);
  return <span className={className} ref={ref} />;
}
const Count = ({ to, sep = '.' }) => <CountUp to={to} separator={sep} duration={reduceMotion ? 0.01 : 1.4} className="num" />;

function Sidebar({ active, onNav, collapsed, onToggle, mobileOpen, onCloseMobile }) {
  const [tip, setTip] = useState(null);
  const show = (e, label) => { if (!collapsed || mobileOpen) return; const r = e.currentTarget.getBoundingClientRect(); setTip({ label, top: r.top + r.height / 2, left: r.right + 12 }); };
  const isC = collapsed && !mobileOpen;
  return (
    <aside className="sb" data-collapsed={isC ? '' : undefined} data-mobile-open={mobileOpen ? '' : undefined}>
      <div className="sb-top">
        <img className="logo" src={LOGO} alt="" />
        {!isC && <span className="brand">Ailways</span>}
        <button type="button" className="icon-btn only-desktop" onClick={() => { setTip(null); onToggle(); }} aria-label={isC ? 'Menüyü genişlet' : 'Menüyü daralt'} aria-expanded={!isC}
          onMouseEnter={e => show(e, 'Menüyü genişlet  [')} onMouseLeave={() => setTip(null)}>
          <Icon icon={I.SidebarLeft} size={18} />
        </button>
        <button type="button" className="icon-btn only-mobile" onClick={onCloseMobile} aria-label="Menüyü kapat"><Icon icon={I.Cancel01} size={18} /></button>
      </div>

      <button type="button" className="ws" aria-label="Asistan seç: Tüm asistanlar" onMouseEnter={e => show(e, 'Tüm asistanlar')} onMouseLeave={() => setTip(null)}>
        <span className="ws-dot" aria-hidden="true" />
        {!isC && <><b>Tüm asistanlar</b><span style={{ color: 'var(--faint)', display: 'inline-grid' }}><Icon icon={I.UnfoldMore} size={16} /></span></>}
      </button>

      <nav className="sb-scroll" aria-label="Ana menü">
        {NAV.map((g, gi) => (
          <div key={gi}>
            {g.group && <div className="group">{g.group}</div>}
            {g.items.map(it => (
              <button key={it.v} type="button" className="nav" aria-current={active === it.v ? 'page' : undefined}
                aria-label={isC ? (it.badge ? `${it.label}, ${it.badge}` : it.label) : undefined}
                onClick={() => onNav(it.v)} onMouseEnter={e => show(e, it.label)} onMouseLeave={() => setTip(null)}>
                <span className="nav-ic"><Icon icon={it.icon} size={18} /></span>
                {!isC && <span className="nav-lbl">{it.label}</span>}
                {!isC && it.badge ? <span className={`badge ${it.tone}`}>{it.badge}</span> : null}
                {isC && it.badge ? <span className={`badge-dot ${it.tone === 'accent' ? 'accent' : ''}`} aria-hidden="true" /> : null}
              </button>
            ))}
          </div>
        ))}
      </nav>

      {tip && <div className="tip" role="tooltip" style={{ top: tip.top, left: tip.left }}>{tip.label}</div>}
    </aside>
  );
}

const STEPS = [
  { t: 'Kanal bağla', d: 'Instagram, web sitesi veya pazaryeri', v: 'channels' },
  { t: 'Ürünlerini aktar', d: 'Kataloğunu asistanına tanıt', v: 'products' },
  { t: 'Bilgi bankasını doldur', d: 'Kargo, iade ve ödeme bilgileri', v: 'assistants' },
  { t: 'Asistanını test et', d: 'Birkaç soru sor, cevaplarına bak', v: 'test' },
  { t: "Widget'ı sitene ekle", d: 'Tek satır kodla yayına al', v: 'channels' },
];
function SetupBubble({ onNav }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  const done = 0, total = STEPS.length, C = 2 * Math.PI * 26;
  useEffect(() => {
    if (!open) return;
    const onDown = e => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    const onKey = e => { if (e.key === 'Escape') setOpen(false); };
    document.addEventListener('mousedown', onDown); document.addEventListener('keydown', onKey);
    return () => { document.removeEventListener('mousedown', onDown); document.removeEventListener('keydown', onKey); };
  }, [open]);
  return (
    <div ref={ref}>
      {open && (
        <div className="checklist" role="dialog" aria-label="Kurulum adımları">
          <div className="cl-head">
            <b>Kurulumu tamamla</b>
            <p><span className="num">{done}/{total}</span> adım tamamlandı. Kalan adımlar asistanının daha iyi cevap vermesini sağlar.</p>
            <div className="cl-bar"><i style={{ width: `${done / total * 100}%` }} /></div>
          </div>
          <ul className="cl-list">
            {STEPS.map(st => (
              <li key={st.t}>
                <button type="button" className="cl-item" onClick={() => { setOpen(false); onNav(st.v); }}>
                  <span className="cl-check" aria-hidden="true" />
                  <span><b>{st.t}</b><span className="d">{st.d}</span></span>
                  <span className="go"><Icon icon={I.ArrowRight01} size={16} /></span>
                </button>
              </li>
            ))}
          </ul>
        </div>
      )}
      <button type="button" className="bubble" onClick={() => setOpen(o => !o)} aria-expanded={open} aria-label={`Kurulumu tamamla, ${done}/${total}`}>
        <svg className="ring" width="56" height="56" viewBox="0 0 56 56" aria-hidden="true">
          <circle cx="28" cy="28" r="26" fill="none" stroke="var(--soft-2)" strokeWidth="3" />
          <circle cx="28" cy="28" r="26" fill="none" stroke="var(--accent)" strokeWidth="3" strokeLinecap="round" strokeDasharray={C} strokeDashoffset={C * (1 - done / total)} />
        </svg>
        <span className="core"><Icon icon={open ? I.Cancel01 : I.Rocket01} size={20} /></span>
        {!open && <span className="cnt num">{done}/{total}</span>}
      </button>
    </div>
  );
}

function App() {
  const readC = () => { try { return localStorage.getItem('ailways-c-sb') === '1'; } catch { return false; } };
  const [collapsed, setCollapsed] = useState(readC);
  const [mobileOpen, setMobileOpen] = useState(false);
  const [active, setActive] = useState('home');
  const contentRef = useRef(null);
  const item = ALL.find(x => x.v === active);

  useEffect(() => { try { localStorage.setItem('ailways-c-sb', collapsed ? '1' : '0'); } catch {} }, [collapsed]);
  useEffect(() => {
    const onKey = e => {
      if (e.key !== '[' || e.metaKey || e.ctrlKey || e.altKey) return;
      const t = e.target; if (t && (t.isContentEditable || /INPUT|TEXTAREA|SELECT/.test(t.tagName))) return;
      e.preventDefault(); setCollapsed(c => !c);
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);
  const nav = v => { setActive(v); setMobileOpen(false); contentRef.current?.scrollTo({ top: 0 }); };

  return (
    <div className="app">
      <div className="scrim" data-on={mobileOpen ? '' : undefined} onClick={() => setMobileOpen(false)} />
      <Sidebar active={active} onNav={nav} collapsed={collapsed} onToggle={() => setCollapsed(c => !c)} mobileOpen={mobileOpen} onCloseMobile={() => setMobileOpen(false)} />
      <main className="main">
        <header className="topbar">
          <button type="button" className="icon-btn only-mobile" onClick={() => setMobileOpen(true)} aria-label="Menüyü aç"><Icon icon={I.Menu01} size={20} /></button>
          <span className="ttl">{active === 'home' ? 'Ailways Paneli' : item.label}</span>
          <label className="search">
            <Icon icon={I.Search01} size={17} />
            <input id="search" type="search" placeholder="Ürün, konuşma, sipariş ara" aria-label="Panelde ara" />
            <kbd>Ctrl K</kbd>
          </label>
          <button type="button" className="tb-btn" aria-label="Bildirimler, yeni var"><Icon icon={I.Notification03} size={18} /><span className="tb-dot" /></button>
          <button type="button" className="tb-btn" aria-label="Destek"><Icon icon={I.HelpCircle} size={18} /></button>
          <span className="avatar" title="yusufailways@tuz.com">A</span>
        </header>
        <div className="content" ref={contentRef}>
          {active === 'home' ? <Home onNav={nav} /> : <Placeholder item={item} onNav={nav} />}
        </div>
      </main>
      <SetupBubble onNav={nav} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
