/* =========================================================================
   React Bits · BranchedMenu (JS + CSS varyantı)
   Değişiklikler: @hugeicons/react import'u → HugeiconsReact global'i; ikon tanımları satır içi;
   kontrollü "active" (sayfa değişince menü de değişsin); çocuk satırında sayaç rozeti;
   kapalı bölüm başlığında o bölümdeki rozetlerin toplamı. Çizim ve katlama mantığı birebir.
   ========================================================================= */
const PAD = 6;
const MARK = 16;
const renderIcon = icon => (isValidElement(icon) ? icon : <HugeiconsIcon icon={icon} size={17} strokeWidth={1.7} />);
const toSet = open => new Set(Array.isArray(open) ? open : open >= 0 ? [open] : []);

function BranchedMenu({
  items, defaultOpen = 0, active, onSelect, onToggle,
  width = 240, rowHeight = 36, indent = 40, trunk = 14, radius = 10, lineWidth = 1.5, fontSize = 14,
  drawDuration = 400, foldDuration = 300, className = ''
}) {
  const [open, setOpen] = useState(() => toSet(defaultOpen));
  const navRef = useRef(null);
  const heads = useRef([]);
  const markerRef = useRef(null);
  const latest = useRef({});
  latest.current = { onSelect, onToggle };

  const activeSection = items.findIndex(it => it.children?.some(kid => kid.value === active));
  const markerShown = activeSection >= 0 && open.has(activeSection);

  // Dışarıdan seçilen sayfanın bölümü kapalıysa aç
  useEffect(() => {
    if (activeSection >= 0 && !open.has(activeSection)) setOpen(p => new Set(p).add(activeSection));
  }, [activeSection]);

  useLayoutEffect(() => {
    const place = glide => {
      const m = markerRef.current;
      const el = heads.current[activeSection];
      if (!m) return;
      const on = markerShown && el;
      if (!glide) m.style.transition = 'none';
      if (on) m.style.top = `${el.offsetTop + (el.offsetHeight - MARK) / 2}px`;
      m.toggleAttribute('data-on', Boolean(on));
      if (!glide) { void m.offsetHeight; m.style.transition = ''; }
    };
    place(true);
    let first = true;
    const ro = new ResizeObserver(() => { if (first) { first = false; return; } place(false); });
    if (navRef.current) ro.observe(navRef.current);
    return () => ro.disconnect();
  }, [activeSection, markerShown, items, fontSize, rowHeight]);

  const select = (value, item) => latest.current.onSelect?.(value, item);
  const toggle = i => {
    setOpen(prev => {
      const next = new Set(prev);
      const isOpen = !next.has(i);
      if (isOpen) next.add(i); else next.delete(i);
      latest.current.onToggle?.(i, isOpen);
      return next;
    });
  };

  const r = Math.min(radius, rowHeight / 2 - 2);
  const endX = indent - 8;
  const rowY = k => PAD + k * rowHeight + rowHeight / 2;
  const branch = k => `M ${trunk} ${rowY(k) - r} A ${r} ${r} 0 0 0 ${trunk + r} ${rowY(k)} H ${endX}`;
  const reach = k => `M ${trunk} 0 V ${rowY(k) - r} A ${r} ${r} 0 0 0 ${trunk + r} ${rowY(k)} H ${endX}`;
  const length = k => rowY(k) - r + (Math.PI * r) / 2 + (endX - trunk - r);

  return (
    <nav ref={navRef} aria-label="Ana menü" className={`branched-menu${className ? ` ${className}` : ''}`}
      style={{ '--bm-w': `${width}px`, '--bm-font': `${fontSize}px`, '--bm-row': `${rowHeight}px`, '--bm-indent': `${indent}px`,
        '--bm-line-w': lineWidth, '--bm-draw': `${drawDuration}ms`, '--bm-fold': `${foldDuration}ms` }}>
      <span ref={markerRef} className="branched-menu__marker" aria-hidden="true" />
      {items.map((item, i) => {
        const kids = item.children;
        const isOpen = kids ? open.has(i) : false;
        const bodyH = kids ? PAD * 2 + kids.length * rowHeight : 0;
        const crit = kids?.filter(k => k.tone === 'crit').reduce((s, k) => s + (k.badge || 0), 0) || 0;
        return (
          <div key={item.label} className="branched-menu__section" data-open={isOpen ? '' : undefined}>
            <button ref={el => { heads.current[i] = el; }} type="button" className="branched-menu__head"
              aria-expanded={kids ? isOpen : undefined} onClick={() => toggle(i)}>
              <span>{item.label}</span>
              {crit > 0 && <span className="pill pill-crit num" aria-label={`${crit} bekleyen`}>{crit}</span>}
            </button>
            <div className="branched-menu__body">
              <div className="branched-menu__fold">
                <div className="branched-menu__tree" style={{ height: bodyH }}>
                  <svg className="branched-menu__lines" width={indent} height={bodyH} aria-hidden="true">
                    <path className="branched-menu__base" d={`M ${trunk} 0 V ${rowY(kids.length - 1) - r}`} />
                    {kids.map((kid, k) => <path key={kid.value} className="branched-menu__base" d={branch(k)} />)}
                    {kids.map((kid, k) => (
                      <path key={kid.value} className="branched-menu__reach" d={reach(k)}
                        style={{ strokeDasharray: length(k), strokeDashoffset: kid.value === active ? 0 : length(k) }} />
                    ))}
                  </svg>
                  {kids.map(kid => (
                    <button key={kid.value} type="button" className="branched-menu__item"
                      aria-current={kid.value === active ? 'page' : undefined}
                      data-active={kid.value === active ? '' : undefined}
                      tabIndex={isOpen ? 0 : -1} onClick={() => select(kid.value, kid)}>
                      {kid.icon ? <span className="branched-menu__icon" aria-hidden="true">{renderIcon(kid.icon)}</span> : null}
                      <span className="branched-menu__label">{kid.label}</span>
                      {kid.badge ? <span className={`pill num ${kid.tone === 'crit' ? 'pill-crit' : 'pill-accent'}`}>{kid.badge}</span> : null}
                    </button>
                  ))}
                </div>
              </div>
            </div>
          </div>
        );
      })}
    </nav>
  );
}

/* ---- Daraltılmış ray: her bölümün ikonları, bölümler arasında ince çizgi ---- */
function Rail({ items, active, onSelect, showTip, hideTip }) {
  return (
    <nav aria-label="Ana menü" className="rail">
      {items.map((sec, si) => (
        <React.Fragment key={sec.label}>
          {si > 0 && <div className="rail-sep" aria-hidden="true" />}
          {sec.children.map(kid => (
            <button key={kid.value} type="button" className="rail-btn"
              aria-label={kid.badge ? `${kid.label}, ${kid.badge}` : kid.label}
              aria-current={kid.value === active ? 'page' : undefined}
              onClick={() => onSelect(kid.value)}
              onMouseEnter={e => showTip(e, kid.label, sec.label)} onMouseLeave={hideTip}
              onFocus={e => showTip(e, kid.label, sec.label)} onBlur={hideTip}>
              <Icon icon={kid.icon} size={19} />
              {kid.badge ? <span className={`rail-dot ${kid.tone}`}>{kid.badge > 99 ? '99+' : kid.badge}</span> : null}
            </button>
          ))}
        </React.Fragment>
      ))}
    </nav>
  );
}

function AccountMenu({ anchor, onClose }) {
  const ref = useRef(null);
  useEffect(() => {
    const onDown = e => { if (ref.current && !ref.current.contains(e.target) && !anchor.contains(e.target)) onClose(); };
    const onKey = e => { if (e.key === 'Escape') { onClose(); anchor.focus(); } };
    document.addEventListener('mousedown', onDown); document.addEventListener('keydown', onKey);
    ref.current?.querySelector('button')?.focus();
    return () => { document.removeEventListener('mousedown', onDown); document.removeEventListener('keydown', onKey); };
  }, []);
  const rect = anchor.getBoundingClientRect();
  const style = { left: Math.min(rect.left, window.innerWidth - 256), bottom: window.innerHeight - rect.top + 8 };
  if (rect.width < 60) { style.left = rect.right + 10; style.bottom = window.innerHeight - rect.bottom; }
  return (
    <div ref={ref} className="pop" role="menu" style={style}>
      <div style={{ padding: '8px 10px 10px' }}>
        <div style={{ fontWeight: 600 }}>Ailways</div>
        <div className="sub" style={{ color: 'var(--muted)', fontSize: 12.5 }}>yusufailways@tuz.com</div>

      </button>
    </div>
  );
}

        </header>
        <div className="content">
          {active === 'home' ? <Home onNav={go} /> : active === 'stats' ? <Stats onNav={go} /> : active === 'assistants' ? <AssistantsPage onNav={go} /> : active === 'test' ? <TestPage onNav={go} /> : active === 'daily' ? <DailyCheck onNav={go} /> : active === 'products' ? <ProductsPage onNav={go} /> : active === 'orders' ? <OrdersPage onNav={go} /> : active === 'posts' ? <PostsPage onNav={go} /> : active === 'channels' ? <ChannelsPage onNav={go} /> : ['profile', 'plan', 'billing', 'tools'].includes(active) ? <SettingsPage tab={active} onTab={go} onNav={go} /> : active === 'chats' ? <Conversations onNav={go} /> : active === 'findings' ? <Findings onNav={go} /> : (
            <>
              <div className="page-h">
                <div>
                  <h1>{item.label}</h1>
                  <p>{item.desc}</p>
                </div>
              </div>
              <div className="placeholder">
                <div>
                  <span style={{ display: 'inline-grid', placeItems: 'center', width: 48, height: 48, borderRadius: 14, background: 'var(--accent-soft)', color: 'var(--accent)' }}>
                    <Icon icon={item.icon} size={24} />
                  </span>
                  <h2>Bu ekranın tasarımı sırada</h2>
                  <p>Şimdilik kenar çubuğu ve Ana Sayfa hazır. Menüyü sol üstteki düğmeyle ya da <kbd>[</kbd> tuşuyla daraltabilirsin.</p>
                </div>
              </div>
            </>
          )}
        </div>
      </main>

      {tip && isCollapsed && (
        <div className="tip" style={{ top: tip.top, left: tip.left }} role="tooltip">{tip.label}{tip.section && <small>{tip.section}</small>}</div>
      )}
      {acct && <AccountMenu anchor={acct} onClose={() => setAcct(null)} />}
      <SetupBubble onNav={go} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
