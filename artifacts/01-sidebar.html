<title>Ailways Panel A</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&family=Manrope:wght@600;700;800&display=swap&subset=latin-ext" rel="stylesheet">
<style>
  /* Tek tema: beyaz zemin + logo mavisi, koyu tema yok.
     Uygulama kabuğu: solda daraltılabilir kenar çubuğu (272px ↔ 72px), sağda üst çubuk + sayfa alanı. Telefonda çekmece. */
  :root {
    --bg: #FFFFFF;          /* zemin her yerde beyaz */
    --surface: #FFFFFF;     /* kenar çubuğu, kartlar */
    --surface-2: #EEF3F8;   /* hover, ikincil yüzey */
    --line: #E3E9EE;        /* çizgiler, ağaç dalları */
    --fg: #0F1F2C;          /* mürekkep */
    --muted: #4F6170;       /* ikincil metin: eskisinden koyu */
    --accent: #0A87C5;      /* logo mavisi, koyu ucu */
    --accent-2: #119DDA;    /* logo mavisi, açık ucu */
    --accent-soft: #E8F5FC;
    --accent-ink: #FFFFFF;
    --crit: #C8372F;
    --crit-soft: #FCE8E6;
    --shadow: 0 1px 2px rgba(15, 31, 44, .06), 0 8px 24px rgba(15, 31, 44, .08);
    --font-sans: "IBM Plex Sans", ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
    --font-head: "Manrope", "IBM Plex Sans", system-ui, sans-serif;
    --soft: #F5F8FA;
    --soft-2: #EBF1F5;
    --faint: #8A9AA8;
    --accent-3: #5CC4EE;
    --ok: #13875F;
    --ok-soft: #E3F6EE;
    --warn: #B2620A;        /* dikkat: yalnızca seni bekleyenler */
    --warn-soft: #FDF1E3;
    --attn: #E8912D;
    --navy: #0B2B40;        /* ana buton, seçili menü, başlık vurgusu */
    --navy-hover: #133A55;
    --navy-soft: #E9EEF2;
    --shadow-sm: 0 1px 2px rgba(15, 31, 44, .05);
    --sb-open: 272px;
    --sb-closed: 72px;
  }
  :root { color-scheme: light; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-sans); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; }
  h1, h2, h3 { margin: 0; text-wrap: balance; font-family: var(--font-head); letter-spacing: -0.02em; }
  .wordmark, .lede, .claim, .lg-val, .keys b, .strip .v, .f-q, .core b, .facts-list b, .month-h h2, .dd-head h3, .wait .n, .donut-c b { font-family: var(--font-head); }
  .lede, .claim, .f-q { font-weight: 700; letter-spacing: -0.03em; }
  .lg-val, .keys b, .core b { font-weight: 700; letter-spacing: -0.03em; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  .num { font-variant-numeric: tabular-nums; }

  /* ---------- Kabuk ---------- */
  #root { height: 100%; }
  .app { display: flex; height: 100%; }
  .sb {
    flex: none; width: var(--sb-open); height: 100%;
    display: flex; flex-direction: column;
    background: var(--surface); border-right: 1px solid var(--line);
    transition: width 220ms cubic-bezier(0.23, 1, 0.32, 1);
    position: relative; z-index: 30;
  }
  .sb[data-collapsed] { width: var(--sb-closed); }
  .sb-head { display: flex; align-items: center; gap: 10px; height: 64px; padding: 0 14px 0 18px; flex: none; }
  .sb[data-collapsed] .sb-head { flex-direction: column; justify-content: center; height: auto; padding: 16px 0 8px; gap: 10px; }
  .logo { width: 32px; height: 32px; border-radius: 8px; flex: none; display: block; }
  .wordmark { font-weight: 650; font-size: 17px; letter-spacing: -0.01em; }
  .icon-btn {
    display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 8px;
    border: 0; background: none; color: var(--muted); cursor: pointer; flex: none;
    transition: background-color 150ms ease, color 150ms ease;
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--fg); }
  .sb-scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 6px 16px 16px 18px; scrollbar-width: none; }
  .sb-scroll::-webkit-scrollbar { display: none; }
  .sb[data-collapsed] .sb-scroll { padding: 4px 0 12px; }
  .sb-foot { flex: none; border-top: 1px solid var(--line); padding: 10px; display: flex; flex-direction: column; gap: 4px; }

  .row-btn {
    display: flex; align-items: center; gap: 10px; width: 100%; min-height: 40px; padding: 0 10px;
    border: 0; border-radius: 10px; background: none; cursor: pointer; text-align: left; color: var(--fg);
    transition: background-color 150ms ease;
  }
  .row-btn:hover { background: var(--surface-2); }
  .row-btn .sub { color: var(--muted); font-size: 12px; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: 600; font-size: 13px;
    background: linear-gradient(180deg, var(--accent-2), var(--accent)); color: var(--accent-ink); }
  .sb[data-collapsed] .sb-foot { align-items: center; padding: 10px 0; }
  .sb[data-collapsed] .row-btn { width: 44px; justify-content: center; padding: 0; }

  .pill { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 999px; font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums; flex: none; }
  .pill-accent { background: var(--accent-soft); color: var(--accent); }
  .pill-crit { background: var(--warn-soft); color: var(--warn); }
  .progress { width: 100%; height: 4px; border-radius: 2px; background: var(--surface-2); overflow: hidden; }
  .progress > i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }

  /* ---------- Daraltılmış ray ---------- */
  .rail { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .rail-sep { width: 28px; height: 1px; background: var(--line); margin: 8px 0; flex: none; }
  .rail-btn {
    position: relative; width: 44px; height: 40px; border-radius: 10px; border: 0; background: none;
    display: grid; place-items: center; color: var(--muted); cursor: pointer;
    transition: background-color 150ms ease, color 150ms ease;
  }
  .rail-btn:hover { background: var(--surface-2); color: var(--fg); }
  .rail-btn[aria-current] { background: var(--navy); color: #fff; }
  .rail-btn[aria-current]::before { content: ""; position: absolute; left: -14px; top: 10px; bottom: 10px; width: 3px; border-radius: 0 2px 2px 0; background: var(--navy); }
  .rail-dot { position: absolute; top: 5px; right: 6px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; font-size: 10px; font-weight: 700; line-height: 16px; text-align: center; border: 2px solid var(--surface); box-sizing: content-box; font-variant-numeric: tabular-nums; }
  .rail-dot.crit { background: var(--attn); color: #fff; }
  .rail-dot.accent { background: var(--accent); color: var(--accent-ink); }
  .tip {
    position: fixed; z-index: 60; pointer-events: none; padding: 6px 10px; border-radius: 8px; font-size: 12.5px; font-weight: 500;
    background: var(--fg); color: var(--surface); white-space: nowrap; transform: translateY(-50%); box-shadow: var(--shadow);
  }
  .tip small { color: color-mix(in srgb, var(--surface) 65%, transparent); font-weight: 400; margin-left: 6px; }

  /* ---------- Hesap menüsü ---------- */
  .pop { position: fixed; z-index: 70; width: 240px; padding: 6px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); }
  .pop-label { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 8px 10px 6px; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; padding: 3px; margin: 0 4px 6px; border-radius: 8px; background: var(--surface-2); }
  .seg button { height: 30px; border: 0; border-radius: 7px; background: none; cursor: pointer; font-size: 12.5px; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; gap: 5px; }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .pop hr { border: 0; height: 1px; background: var(--line); margin: 4px 0; }

  /* ---------- Ana alan ---------- */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100%; }
  .topbar { flex: none; height: 64px; display: flex; align-items: center; gap: 10px; padding: 0 28px; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 85%, transparent); }
  .crumb { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13.5px; min-width: 0; }
  .crumb b { color: var(--fg); font-weight: 550; }
  .content { flex: 1; min-height: 0; overflow-y: auto; padding: 32px 28px 96px; }
  .page-h { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
  .page-h h1 { margin: 0; font-size: 26px; font-weight: 650; letter-spacing: -0.02em; text-wrap: balance; }
  .page-h p { margin: 4px 0 0; color: var(--muted); max-width: 60ch; }
  .placeholder { border: 1.5px dashed var(--line); border-radius: 12px; min-height: 340px; display: grid; place-items: center; text-align: center; padding: 32px 16px; color: var(--muted); background: color-mix(in srgb, var(--surface) 50%, transparent); }
  .placeholder h2 { color: var(--fg); font-size: 16px; font-weight: 600; margin: 12px 0 4px; }
  .placeholder p { margin: 0 auto; max-width: 46ch; }
  kbd { font-family: var(--font-mono); font-size: 11.5px; padding: 1px 6px; border-radius: 5px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); }
  .notes { margin-top: 20px; display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
  .note { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .note h3 { margin: 0 0 4px; font-size: 14px; font-weight: 600; }
  .note p { margin: 0; color: var(--muted); font-size: 13.5px; }


  /* ---------- Ana sayfa (03-ana-sayfa.html ile aynı) ---------- */
  .wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
  .link { display: inline-flex; align-items: center; gap: 4px; color: var(--accent); font-weight: 550; font-size: 13.5px; background: none; border: 0; cursor: pointer; padding: 4px 0; }
  .link:hover { text-decoration: underline; text-underline-offset: 3px; }
  .search { display: flex; align-items: center; gap: 8px; height: 38px; width: 300px; max-width: 34vw; padding: 0 8px 0 12px; border-radius: 10px; background: var(--soft); color: var(--faint); box-sizing: border-box; }
  .search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font: inherit; color: var(--fg); }
  .search input::placeholder { color: var(--faint); }
  kbd { font-family: var(--font-mono); font-size: 11px; padding: 2px 6px; border-radius: 6px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); }
  .tb-btn { position: relative; width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; color: var(--muted); cursor: pointer; flex: none; }
  .tb-btn:hover { color: var(--fg); border-color: #CCD8E2; }
  .tb-dot { position: absolute; top: 8px; right: 9px; width: 7px; height: 7px; border-radius: 50%; background: var(--crit); box-shadow: 0 0 0 2px #fff; }
  .btn-sm { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 500; font-size: 13px; box-shadow: var(--shadow-sm); }
  .btn-sm:hover { border-color: #CCD8E2; }

  /* Kurulum baloncuğu: sağ altta, tıklayınca adım listesi açılır */
  .bubble { position: fixed; right: 24px; bottom: 24px; z-index: 50; width: 56px; height: 56px; border-radius: 50%; border: 0; padding: 0; cursor: pointer; background: var(--surface); box-shadow: 0 0 0 1px var(--line), 0 10px 28px rgba(15, 31, 44, .14); display: grid; place-items: center; transition: transform 160ms ease, box-shadow 160ms ease; }
  .bubble:hover { transform: translateY(-2px); box-shadow: 0 0 0 1px #D3E3EE, 0 14px 32px rgba(15, 31, 44, .18); }
  .bubble svg.ring { position: absolute; inset: 0; transform: rotate(-90deg); }
  .bubble .core { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--navy); color: #fff; }
  .bubble .cnt { position: absolute; top: -4px; right: -4px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--fg); color: #fff; font-size: 11px; font-weight: 600; display: grid; place-items: center; box-shadow: 0 0 0 2px #fff; }
  .checklist { position: fixed; right: 24px; bottom: 92px; z-index: 50; width: 320px; max-width: calc(100vw - 32px); background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: 0 2px 4px rgba(15,31,44,.05), 0 20px 48px rgba(15,31,44,.16); overflow: hidden; transform-origin: bottom right; animation: pop 180ms cubic-bezier(.23,1,.32,1); }
  @keyframes pop { from { opacity: 0; transform: scale(.96) translateY(6px); } }
  .cl-head { padding: 16px 16px 12px; border-bottom: 1px solid var(--line); }
  .cl-head b { display: block; font-size: 15px; font-weight: 600; }
  .cl-head p { margin: 2px 0 10px; color: var(--muted); font-size: 13px; }
  .cl-bar { height: 6px; border-radius: 3px; background: var(--soft-2); overflow: hidden; }
  .cl-bar i { display: block; height: 100%; background: var(--accent); }
  .cl-list { list-style: none; margin: 0; padding: 6px; }
  .cl-item { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px; border: 0; background: none; border-radius: 12px; cursor: pointer; text-align: left; }
  .cl-item:hover { background: var(--soft); }
  .cl-check { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid #C8D5DF; flex: none; }
  .cl-item b { display: block; font-weight: 550; font-size: 13.5px; }
  .cl-item span.d { display: block; color: var(--muted); font-size: 12.5px; }
  .cl-item .go { margin-left: auto; color: var(--faint); display: inline-grid; }
  /* ================= Ana sayfa v4 =================
     Fikir: Ailways bir santral gibi çalışır; müşteriler farklı kanallardan yazar, asistan hepsine cevap verir.
     Sayfanın tek gösterişli öğesi bu santral: ortada Ailways, etrafında bağlı kanallar döner (React Bits OrbitImages).
     Geri kalan her şey sakin: kutu yok, ince çizgilerle ayrılmış satırlar ve büyük, okunaklı rakamlar.
     Renk: kâğıt #FFFFFF · mürekkep #0E2233 · arduvaz #5E7183 · çizgi #E4EBF1 · Ailways mavisi #0A87C5 · gök #119DDA · sis #EEF7FC
     Yazı: IBM Plex Sans, tek aile. Başlık 44/1.12 ağırlık 500, rakamlar 600 ve eş genişlikli. */
  .home { max-width: 1160px; margin: 0 auto; display: flex; flex-direction: column; }

  /* Santral (hero) */
  .hub { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 32px; align-items: center; padding-bottom: 28px; }
  .greet { color: var(--muted); font-size: 16px; margin: 0 0 14px; }
  .lede { font-size: 44px; line-height: 1.12; font-weight: 500; letter-spacing: -0.02em; margin: 0; color: var(--fg); max-width: 19ch; }
  .lede .rot { display: inline-flex; vertical-align: bottom; overflow: hidden; padding: 0 .14em; margin: 0 -.02em; border-radius: 12px; background: var(--accent-soft); color: var(--accent); line-height: 1.12; }
  .rt-main { display: inline-flex; flex-wrap: wrap; white-space: pre-wrap; position: relative; }
  .rt-word { display: inline-flex; overflow: hidden; padding-bottom: .08em; }
  .rt-char { display: inline-block; }
  .rt-in { animation: rtIn .42s cubic-bezier(.2,.9,.3,1.2) both; }
  @keyframes rtIn { from { transform: translateY(100%); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .rt-in { animation: none; } }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
  .hub-sub { margin: 18px 0 0; color: var(--muted); font-size: 16px; max-width: 46ch; line-height: 1.55; }
  .hub-act { display: flex; gap: 10px; margin-top: 28px; flex-wrap: wrap; }
  .btn-solid { display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px; border-radius: 12px; border: 0; background: var(--navy); color: #fff; font-weight: 550; cursor: pointer; }
  .btn-solid:hover { background: var(--navy-hover); }
  .btn-quiet { display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line); background: #fff; color: var(--fg); font-weight: 550; cursor: pointer; }
  .btn-quiet:hover { border-color: #C6D5E0; }

  .orbit-wrap { position: relative; width: 100%; max-width: 420px; justify-self: center; aspect-ratio: 1; }
  .orbit-wrap::before { content: ""; position: absolute; inset: 9%; border-radius: 50%; background: radial-gradient(circle, #EEF7FC 0%, #F6FBFE 55%, rgba(255,255,255,0) 72%); }
  .orbit-ring { position: absolute; border-radius: 50%; border: 1px dashed #CFE3EE; }
  .orbit-node { width: 100%; height: 100%; border-radius: 50%; background: #fff; display: grid; place-items: center; box-shadow: 0 0 0 1px #E4EBF1, 0 6px 16px rgba(14, 34, 51, .08); color: var(--accent); }
  .orbit-node img { width: 56%; height: 56%; object-fit: contain; border-radius: 6px; }
  .core { width: 132px; height: 132px; border-radius: 50%; background: #fff; display: grid; place-items: center; text-align: center; box-shadow: 0 0 0 1px #E4EBF1, 0 18px 40px rgba(10, 135, 197, .16); }
  .core img { width: 44px; height: 44px; border-radius: 12px; display: block; margin: 0 auto 6px; }
  .core b { display: block; font-size: 22px; font-weight: 600; line-height: 1; }
  .core small { display: block; font-size: 12px; color: var(--muted); margin-top: 3px; }

  /* Bu ay: tek bir açık mavi bant, dört sütun. Görünür olunca çubuklar büyür, sayılar sayar, değişim rozeti belirir. */
  .month { border-radius: 20px; background: linear-gradient(180deg, #F3FAFE 0%, #FFFFFF 100%); box-shadow: inset 0 0 0 1px #E2ECF2; padding: 6px; }
  .month-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 14px 18px 8px; }
  .month-h h2 { font-size: 18px; font-weight: 600; }
  .month-h span { color: var(--muted); font-size: 14px; }
  .ledger { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .lg-col { position: relative; display: flex; flex-direction: column; min-width: 0; padding: 18px 18px 16px; border-radius: 20px; transition: background-color 200ms ease, box-shadow 200ms ease; }
  .lg-col:hover { background: #fff; box-shadow: 0 1px 2px rgba(14,34,51,.04), 0 10px 24px rgba(10,135,197,.08); }
  .lg-name { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
  .lg-name .ic { width: 28px; height: 28px; border-radius: 8px; background: #fff; box-shadow: inset 0 0 0 1px #E2ECF2; color: var(--accent); display: grid; place-items: center; }
  .lg-body { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-top: 14px; }
  .lg-val { font-size: 36px; font-weight: 600; letter-spacing: -0.02em; line-height: 1; }
  .lg-prev { margin-top: 10px; font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .lg-prev b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
  .delta { display: inline-flex; align-items: center; gap: 2px; height: 22px; padding: 0 7px; border-radius: 7px; font-size: 12px; font-weight: 600; }
  .delta.down { color: var(--crit); background: var(--crit-soft); }
  .twin { display: flex; align-items: flex-end; gap: 6px; height: 64px; flex: none; }
  .twin .bar { display: flex; flex-direction: column; align-items: center; gap: 5px; height: 100%; justify-content: flex-end; }
  .twin .bar i { display: block; width: 14px; border-radius: 5px 5px 3px 3px; transform-origin: bottom; }
  .twin .bar.prev i { background: #CAD9E4; }
  .twin .bar.now i { background: linear-gradient(180deg, #2BB0E8, #0A87C5); }
  .twin .bar.zero i { background: none; box-shadow: inset 0 0 0 1.5px #9FD2EC; height: 4px; }
  .twin .bar small { font-size: 10.5px; color: var(--faint); line-height: 1; }
  .week { display: flex; align-items: flex-end; gap: 5px; height: 64px; }
  .week .d { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .week .d i { display: block; width: 10px; height: 10px; border-radius: 50%; background: #D6E3EC; }
  .week .d small { font-size: 10.5px; color: var(--faint); line-height: 1; }
  .week .d.peak i { position: relative; width: 14px; height: 40px; border-radius: 7px; background: linear-gradient(180deg, #2BB0E8, #0A87C5); }
  .week .d.peak i::after { content: ""; position: absolute; inset: -5px; border-radius: 10px; border: 2px solid rgba(17, 157, 218, .35); animation: halo 2.4s ease-out infinite; }
  .week .d.peak small { color: var(--accent); font-weight: 600; }
  @keyframes halo { 0% { opacity: .9; transform: scale(.9); } 70%, 100% { opacity: 0; transform: scale(1.35); } }
  @media (prefers-reduced-motion: reduce) { .week .d.peak i::after { animation: none; opacity: 0; } }

  /* Bölümler */
  .block { padding-top: 40px; }
  .block-h { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 8px; }
  .block-h h2 { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
  .block-h p { margin: 0; color: var(--muted); font-size: 14px; }

  /* Asistanlar: liste + ayrıntı. Solda dört asistan, sağda seçilenin kanalları ve hazır olma durumu.
     Tek çerçeve, içi ince bir dikey çizgiyle bölünmüş. Süs yok; vurgu sadece seçili satırda. */
  .desk { display: grid; grid-template-columns: 300px minmax(0, 1fr); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
  .desk-list { list-style: none; margin: 0; padding: 8px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; }
  .pick { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px; border: 0; border-radius: 12px; background: none; cursor: pointer; text-align: left; color: var(--fg); transition: background-color 150ms ease; }
  .pick:hover { background: var(--soft); }
  .pick[aria-selected="true"] { background: var(--accent-soft); }
  .pick-ic { width: 38px; height: 38px; border-radius: 12px; background: var(--soft); color: var(--muted); display: grid; place-items: center; flex: none; transition: background-color 150ms ease, color 150ms ease; }
  .pick[aria-selected="true"] .pick-ic { background: #fff; color: var(--accent); }
  .pick-tx { flex: 1; min-width: 0; }
  .pick-tx b { display: block; font-size: 14.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pick-tx span { display: block; font-size: 12.5px; color: var(--muted); margin-top: 1px; }
  .pick .flag { width: 8px; height: 8px; border-radius: 50%; background: var(--attn); flex: none; }

  .desk-detail { padding: 24px 28px; min-width: 0; }
  .dd-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .dd-head h3 { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
  .dd-head p { margin: 4px 0 0; color: var(--muted); font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .dd-head p i { width: 7px; height: 7px; border-radius: 50%; background: #1A9E6B; }
  .dd-act { display: flex; gap: 8px; }
  .dd-act button { height: 40px; border-radius: 10px; font-weight: 550; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; padding: 0 16px; }
  .dd-act .t { border: 0; background: var(--navy); color: #fff; }
  .dd-act .t:hover { background: var(--navy-hover); }
  .dd-act .y { border: 1px solid var(--line); background: #fff; color: var(--fg); }
  .dd-act .y:hover { border-color: #C6D5E0; }
  .dd-sub { font-size: 13.5px; color: var(--muted); margin: 24px 0 10px; }
  .dd-ch { display: flex; gap: 8px; flex-wrap: wrap; }
  .dd-ch span, .dd-ch button { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px 0 10px; border-radius: 10px; border: 1px solid var(--line); background: #fff; font-size: 14px; color: var(--fg); }
  .dd-ch img { width: 18px; height: 18px; object-fit: contain; border-radius: 4px; }
  .dd-ch .gl { color: var(--accent); display: inline-grid; }
  .dd-ch button { border-style: dashed; color: var(--muted); cursor: pointer; padding: 0 14px 0 10px; }
  .dd-ch button:hover { color: var(--accent); border-color: #9FD2EC; }
  .dd-rows { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .dd-rows li { display: grid; grid-template-columns: 150px minmax(0, 1fr) auto; align-items: center; gap: 16px; padding: 13px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .dd-rows li > span:first-child { color: var(--muted); }
  .dd-rows b { font-weight: 600; font-variant-numeric: tabular-nums; margin-right: 6px; }
  .dd-rows .warn { color: var(--warn); }
  .dd-rows button { border: 0; background: none; color: var(--accent); font-weight: 550; font-size: 13.5px; cursor: pointer; padding: 4px 0; }
  .dd-rows button.strong { background: var(--navy); color: #fff; padding: 0 12px; height: 32px; border-radius: 8px; }
  .crew-note { display: flex; align-items: center; gap: 8px; margin-top: 14px; color: var(--muted); font-size: 13.5px; }
  .crew-note b { color: var(--warn); font-weight: 600; }
  @media (max-width: 860px) {
    .desk { grid-template-columns: 1fr; }
    .desk-list { border-right: 0; border-bottom: 1px solid var(--line); flex-direction: row; overflow-x: auto; }
    .pick { flex: none; width: auto; }
    .desk-detail { padding: 20px; }
    .dd-rows li { grid-template-columns: 1fr auto; }
    .dd-rows li > span:first-child { grid-column: 1 / -1; }
  }

  /* Alt iki sütun */
  .split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 56px; }
  .jump { list-style: none; margin: 0; padding: 0; }
  .jump button { display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px 4px; border: 0; border-bottom: 1px solid var(--line); background: none; cursor: pointer; text-align: left; color: var(--fg); }
  .jump li:first-child button { border-top: 1px solid var(--line); }
  .jump .ji { color: var(--muted); display: inline-grid; transition: color 150ms ease; }
  .jump .jl { font-size: 16px; font-weight: 500; flex: 1; }
  .jump .jn { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
  .jump .ja { color: var(--faint); display: inline-grid; transition: transform 150ms ease, color 150ms ease; }
  .jump button:hover .ji, .jump button:hover .ja { color: var(--accent); }
  .jump button:hover .ja { transform: translateX(3px); }
  .usage-list { list-style: none; margin: 0; padding: 0; }
  .usage-list li { padding: 14px 4px; border-bottom: 1px solid var(--line); }
  .usage-list li:first-child { border-top: 1px solid var(--line); }
  .ul-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .ul-top span { font-size: 15px; }
  .ul-top b { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .ul-top b.inf { color: var(--muted); font-weight: 500; }
  .ul-bar { height: 6px; border-radius: 3px; background: var(--soft); overflow: hidden; }
  .ul-bar i { display: block; height: 100%; border-radius: 3px; background: var(--accent-2); }
  .usage-list li.full b { color: var(--warn); }
  .usage-list li.full .ul-bar i { background: #E8962B; }

  .orders-line { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 18px 4px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .orders-line .oi { width: 44px; height: 44px; border-radius: 12px; background: var(--soft); color: var(--faint); display: grid; place-items: center; flex: none; }
  .orders-line div { flex: 1; min-width: 220px; }
  .orders-line b { display: block; font-weight: 600; font-size: 15px; }
  .orders-line p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }

  @media (max-width: 1100px) {
    .hub { grid-template-columns: 1fr; }
    .orbit-wrap { max-width: 340px; }
    .ledger { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 760px) {
    .lede { font-size: 34px; }
    .split { grid-template-columns: 1fr; gap: 40px; }
    .search { display: none; }
  }
  @media (max-width: 480px) {
    .ledger { grid-template-columns: 1fr; }
  }


  /* ================= Ortak sayfa iskeleti (İstatistikler, Asistanlarım, Test Et) ================= */
  .pg { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
  .pg-h { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .pg-h h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.025em; }
  .pg-h .sub { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
  .pg-tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .segm { display: inline-flex; padding: 3px; border-radius: 10px; background: var(--soft); }
  .segm button { height: 32px; padding: 0 12px; border: 0; border-radius: 8px; background: none; color: var(--muted); font-weight: 500; font-size: 13.5px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .segm button[aria-pressed="true"] { background: #fff; color: var(--fg); box-shadow: 0 1px 2px rgba(14,34,51,.1); }
  .segm .c { font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .month-pick { display: inline-flex; align-items: center; height: 38px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #fff; }
  .month-pick button { width: 34px; height: 100%; border: 0; background: #fff; color: var(--muted); display: grid; place-items: center; cursor: pointer; }
  .month-pick button:hover:not(:disabled) { color: var(--fg); background: var(--soft); }
  .month-pick button:disabled { color: #C9D4DC; cursor: default; }
  .month-pick b { padding: 0 8px; font-weight: 600; font-size: 13.5px; min-width: 88px; text-align: center; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 20px 22px; min-width: 0; }
  .card-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .card-h h2 { font-size: 17px; font-weight: 700; letter-spacing: -0.02em; }
  .card-h p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
  .btn-n { height: 40px; padding: 0 16px; border-radius: 10px; border: 0; background: var(--navy); color: #fff; font-weight: 600; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
  .btn-n:hover:not(:disabled) { background: var(--navy-hover); }
  .btn-n:disabled { background: #B8C6D1; cursor: not-allowed; }
  .btn-l { height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: #fff; color: var(--fg); font-weight: 600; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
  .btn-l:hover { border-color: #C6D3DD; }
  .btn-l.sm, .btn-n.sm { height: 34px; padding: 0 12px; font-size: 13px; }
  .tipbox { background: var(--navy); color: #fff; padding: 8px 11px; border-radius: 10px; font-size: 12.5px; box-shadow: 0 8px 20px rgba(14,34,51,.18); }
  .tipbox b { display: block; font-size: 15px; font-weight: 700; font-family: var(--font-head); }

  /* ---- İstatistikler v3 ---- */
  .kpi-row { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: #fff; border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
  .kpi-c { padding: 18px 20px; border-left: 1px solid var(--line); min-width: 0; }
  .kpi-c:first-child { border-left: 0; }
  .kpi-c .k { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--muted); }
  .kpi-c .k i { width: 8px; height: 8px; border-radius: 2px; flex: none; }
  .kpi-c .v { font-family: var(--font-head); font-size: 30px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.1; margin: 10px 0 6px; font-variant-numeric: tabular-nums; }
  .kpi-c .v.none { color: #B9C6D0; }
  .kpi-c .n { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .chg { display: inline-flex; align-items: center; gap: 2px; height: 20px; padding: 0 6px; border-radius: 6px; font-size: 12px; font-weight: 600; background: var(--crit-soft); color: var(--crit); }
  .main-chart .chart { height: 300px; margin: 0 -6px; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 10px; height: 10px; border-radius: 3px; }
  .legend i.ln { width: 14px; height: 0; border-top: 2px dashed #9AAAB7; border-radius: 0; }
  .fact-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); }
  .fact-row span { display: block; font-size: 12.5px; color: var(--muted); }
  .fact-row b { display: block; font-family: var(--font-head); font-size: 19px; font-weight: 700; margin-top: 2px; letter-spacing: -0.02em; }
  .fact-row small { display: block; font-size: 12px; color: var(--faint); }
  .grid-2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; }
  .src-row { display: grid; grid-template-columns: 30px minmax(0, 1fr) 54px 44px; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .src-row:first-of-type { border-top: 1px solid var(--line); }
  .src-row .lg { width: 30px; height: 30px; border-radius: 9px; border: 1px solid var(--line); display: grid; place-items: center; background: #fff; }
  .src-row .lg img { width: 18px; height: 18px; border-radius: 4px; object-fit: contain; }
  .src-row .t b { display: block; font-size: 14px; font-weight: 600; }
  .src-row .t span { display: flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--muted); }
  .src-row .t span img { width: 13px; height: 13px; border-radius: 3px; }
  .src-row .bar { grid-column: 2 / 3; height: 6px; border-radius: 3px; background: var(--soft); overflow: hidden; margin-top: 8px; }
  .src-row .bar i { display: block; height: 100%; border-radius: 3px; background: var(--accent); }
  .src-row .num-v { text-align: right; font-weight: 700; font-family: var(--font-head); font-size: 16px; font-variant-numeric: tabular-nums; }
  .src-row .pct { text-align: right; font-size: 12.5px; color: var(--muted); }
  .quiet-ch { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 14px; font-size: 12.5px; color: var(--muted); }
  .quiet-ch span.l { width: 24px; height: 24px; border-radius: 7px; border: 1px solid var(--line); display: grid; place-items: center; color: var(--muted); opacity: .6; filter: grayscale(1); }
  .quiet-ch span.l img { width: 14px; height: 14px; object-fit: contain; }
  .hours .chart { height: 200px; margin: 0 -6px; }
  .abil-t { width: 100%; border-collapse: collapse; font-size: 14px; }
  .abil-t th { text-align: left; font-weight: 500; font-size: 12.5px; color: var(--muted); padding: 0 0 10px; border-bottom: 1px solid var(--line); }
  .abil-t th.r, .abil-t td.r { text-align: right; }
  .abil-t td { padding: 11px 0; border-bottom: 1px solid var(--line); }
  .abil-t tr:last-child td { border-bottom: 0; }
  .abil-t td.nm b { display: block; font-weight: 600; }
  .abil-t td.nm span { display: block; font-size: 12.5px; color: var(--muted); }
  .abil-t td.v { font-family: var(--font-head); font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; width: 70px; }
  .abil-t td.p { color: var(--muted); font-variant-numeric: tabular-nums; width: 70px; }
  .abil-t td.ch { width: 96px; }
  .abil-t .dash { color: #B9C6D0; }
  .abil-t .same { font-size: 12px; color: var(--muted); }
  .nodata { display: flex; flex-wrap: wrap; gap: 8px; }
  .nodata span { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 999px; border: 1px dashed #CFD9E1; font-size: 13px; color: var(--muted); }

  /* ---- Test Et ---- */
  .test-wrap { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 20px; align-items: start; }
  .test-side { display: flex; flex-direction: column; gap: 16px; }
  .pick-list { display: flex; flex-direction: column; gap: 4px; }
  .pick-a { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px; border: 1px solid transparent; border-radius: 12px; background: none; cursor: pointer; text-align: left; color: var(--fg); }
  .pick-a:hover { background: var(--soft); }
  .pick-a[aria-pressed="true"] { border-color: var(--navy); background: #fff; box-shadow: 0 0 0 3px rgba(11,43,64,.06); }
  .pick-a .ic { width: 34px; height: 34px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
  .pick-a b { display: block; font-size: 14px; font-weight: 600; }
  .pick-a span { display: block; font-size: 12px; color: var(--muted); }
  .pick-a .rd { margin-left: auto; width: 18px; height: 18px; border-radius: 50%; border: 2px solid #C6D3DD; flex: none; }
  .pick-a[aria-pressed="true"] .rd { border: 5px solid var(--navy); }
  .quota { display: grid; gap: 12px; }
  .quota .top { display: flex; justify-content: space-between; font-size: 13.5px; margin-bottom: 6px; }
  .quota .top span { color: var(--muted); }
  .quota .top b { font-weight: 600; font-variant-numeric: tabular-nums; }
  .quota .tr { height: 6px; border-radius: 3px; background: var(--soft); overflow: hidden; }
  .quota .tr i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
  .quota small { font-size: 12px; color: var(--muted); }
  .stage { border: 1px solid var(--line); border-radius: 20px; min-height: 620px; display: grid; place-items: center; padding: 28px; position: relative; overflow: hidden;
    background-color: #FAFCFD; background-image: radial-gradient(#DCE5EC 1px, transparent 1px); background-size: 18px 18px; }
  .stage-bar { position: absolute; top: 14px; left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .stage-bar .site { font-size: 12.5px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; background: #fff; border: 1px solid var(--line); height: 30px; padding: 0 10px; border-radius: 8px; }
  .widget { width: 380px; max-width: 100%; height: 540px; background: #fff; border-radius: 20px; box-shadow: 0 2px 6px rgba(14,34,51,.06), 0 24px 60px rgba(14,34,51,.16); display: flex; flex-direction: column; overflow: hidden; }
  .stage.full .widget { width: 100%; max-width: 760px; height: 560px; }
  .w-head { display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: var(--navy); color: #fff; }
  .w-head img { width: 36px; height: 36px; border-radius: 10px; background: #fff; }
  .w-head b { display: block; font-family: var(--font-head); font-weight: 700; font-size: 15px; }
  .w-head span { display: flex; align-items: center; gap: 6px; font-size: 12px; opacity: .85; }
  .w-head span i { width: 6px; height: 6px; border-radius: 50%; background: #3DDC97; }
  .w-head button { margin-left: auto; width: 32px; height: 32px; border-radius: 8px; border: 0; background: rgba(255,255,255,.12); color: #fff; display: grid; place-items: center; cursor: pointer; }
  .w-msgs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; background: #F7FAFC; }
  .w-m { max-width: 82%; padding: 9px 12px; border-radius: 14px; font-size: 13.5px; line-height: 1.45; white-space: pre-line; }
  .w-m.b { align-self: flex-start; background: #fff; border: 1px solid var(--line); border-top-left-radius: 4px; }
  .w-m.u { align-self: flex-end; background: var(--accent); color: #fff; border-top-right-radius: 4px; }
  .w-m small { display: block; font-size: 11px; opacity: .6; margin-top: 3px; }
  .w-typing { align-self: flex-start; display: inline-flex; gap: 4px; background: #fff; border: 1px solid var(--line); border-radius: 4px 14px 14px 14px; padding: 11px 12px; }
  .w-typing i { width: 6px; height: 6px; border-radius: 50%; background: #9FB4C3; animation: blink 1s infinite ease-in-out; }
  .w-typing i:nth-child(2) { animation-delay: .15s; } .w-typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .35; } 40% { opacity: 1; } }
  .w-kvkk { display: flex; align-items: center; gap: 8px; margin: 0 12px 8px; padding: 9px 12px; border-radius: 10px; background: var(--accent-soft); font-size: 12.5px; color: var(--fg); }
  .w-kvkk a { color: var(--accent); font-weight: 600; }
  .w-kvkk button { margin-left: auto; border: 0; background: none; color: var(--muted); cursor: pointer; display: grid; place-items: center; }
  .w-in { display: flex; align-items: center; gap: 8px; margin: 0 12px; padding: 6px 6px 6px 12px; border: 1px solid var(--line); border-radius: 14px; }
  .w-in:focus-within { border-color: var(--accent-2); box-shadow: 0 0 0 3px rgba(17,157,218,.12); }
  .w-in input { flex: 1; min-width: 0; border: 0; outline: none; font: inherit; font-size: 13.5px; color: var(--fg); }
  .w-in .ib { width: 34px; height: 34px; border-radius: 10px; border: 0; background: none; color: var(--muted); display: grid; place-items: center; cursor: pointer; }
  .w-in .send { background: var(--navy); color: #fff; }
  .w-in .send:disabled { background: #C7D2DB; }
  .w-foot { text-align: center; font-size: 11.5px; color: var(--faint); padding: 8px 0 10px; }
  .w-foot b { color: var(--muted); }
  .bubble-launch { position: absolute; right: 24px; bottom: 24px; display: inline-flex; align-items: center; gap: 10px; height: 52px; padding: 0 18px 0 8px; border-radius: 999px; border: 0; background: var(--navy); color: #fff; font-weight: 600; cursor: pointer; box-shadow: 0 10px 28px rgba(11,43,64,.3); }
  .bubble-launch img { width: 36px; height: 36px; border-radius: 50%; background: #fff; }
  .stage.bub { place-items: end; }
  .stage.bub .widget { margin: 0 0 76px; }

  @media (max-width: 1150px) {
    .kpi-row { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .kpi-c:nth-child(4) { border-left: 0; }

  .shared { display: flex; gap: 16px; flex-wrap: wrap; padding: 0 22px 16px; font-size: 13.5px; color: var(--muted); }
  .shared span { display: inline-flex; align-items: center; gap: 6px; }
  .shared svg { color: var(--ok); }
  .sel-time { height: 36px; border: 1px solid var(--line); border-radius: 9px; padding: 0 10px; font: inherit; font-size: 14px; background: #fff; color: var(--fg); }
  .save-float { position: sticky; bottom: 12px; z-index: 5; display: flex; align-items: center; gap: 12px; padding: 12px 14px 12px 18px; border-radius: 14px; background: var(--navy); color: #fff; box-shadow: 0 12px 30px rgba(11,43,64,.3); }
  .save-float span { flex: 1; font-size: 14px; }
  .save-float .btn-w { height: 38px; padding: 0 16px; border-radius: 10px; border: 0; background: #fff; color: var(--navy); font-weight: 700; cursor: pointer; }
  .save-float .ghost { height: 38px; padding: 0 12px; border-radius: 10px; border: 0; background: none; color: rgba(255,255,255,.8); font-weight: 600; cursor: pointer; }
  .saved-toast { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 12px; background: #EEF8F3; color: #13724F; font-size: 14px; font-weight: 500; }
  .plan-band { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; padding: 22px 24px; border-radius: 18px; color: #fff; background: radial-gradient(90% 140% at 100% 0%, rgba(17,157,218,.45) 0%, rgba(17,157,218,0) 55%), linear-gradient(135deg, #0B2B40, #0E3A57); }
  .plan-band .tx { flex: 1; min-width: 220px; }
  .plan-band b { display: block; font-family: var(--font-head); font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
  .plan-band span { display: block; color: rgba(255,255,255,.8); font-size: 14px; margin-top: 4px; }
  .plan-band .btn-w { height: 42px; padding: 0 18px; border-radius: 10px; border: 0; background: #fff; color: var(--navy); font-weight: 700; cursor: pointer; }
  .u-row { padding: 16px 22px; border-top: 1px solid var(--line); }
  .u-row:first-child { border-top: 0; }
  .u-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; font-size: 14.5px; }
  .u-top b { font-family: var(--font-head); font-weight: 700; font-variant-numeric: tabular-nums; }
  .u-top b.full { color: var(--warn); }
  .u-tr { height: 8px; border-radius: 4px; background: var(--soft); overflow: hidden; }
  .u-tr i { display: block; height: 100%; border-radius: 4px; background: var(--accent-2); }
  .u-tr i.full { background: var(--attn); }
  .u-row small { display: block; font-size: 12.5px; color: var(--muted); margin-top: 6px; }
  .empty-mini { padding: 28px 22px; text-align: center; color: var(--muted); font-size: 14px; }
  .empty-mini b { display: block; color: var(--fg); font-family: var(--font-head); font-size: 16px; font-weight: 700; margin-bottom: 4px; }
  @media (max-width: 900px) { .set-sec { grid-template-columns: 1fr; gap: 14px; } .field-2 { grid-template-columns: 1fr; } }


  /* ================= Kalan sayfalar: Günlük Kontrol, Ürünler, Siparişler, Kayıtlı Gönderiler, Kanallar ================= */
  .pz { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
  .pz-h { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .pz-h h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.03em; }
  .pz-h p { margin: 6px 0 0; color: var(--muted); font-size: 15px; }
  .pz-h .acts { display: flex; gap: 8px; flex-wrap: wrap; }
  .bar-tools { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .bar-tools .srch { flex: 1; min-width: 220px; height: 42px; background: #fff; border: 1px solid var(--line); }
  .fchips { display: flex; gap: 6px; flex-wrap: wrap; }
  .fchips button { height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: #fff; font-size: 13.5px; font-weight: 600; color: var(--muted); cursor: pointer; display: inline-flex; align-items: center; gap: 7px; }
  .fchips button:hover { color: var(--fg); border-color: #C6D3DD; }
  .fchips button[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: #fff; }
  .fchips .c { font-size: 12px; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--soft); color: var(--muted); font-variant-numeric: tabular-nums; }
  .fchips button[aria-pressed="true"] .c { background: rgba(255,255,255,.18); color: #fff; }
  .fchips .c.attn { background: var(--warn-soft); color: var(--warn); }
  .fchips img { width: 16px; height: 16px; border-radius: 4px; }

  /* Günlük Kontrol */
  .review { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }
  .rv-prog { display: flex; align-items: center; gap: 14px; padding: 16px 20px; border-radius: 16px; background: linear-gradient(135deg, #0B2B40, #0E3A57); color: #fff; }
  .rv-prog b { font-family: var(--font-head); font-size: 22px; font-weight: 800; }
  .rv-prog span { color: rgba(255,255,255,.8); font-size: 14px; }
  .rv-prog .tr { flex: 1; height: 8px; border-radius: 4px; background: rgba(255,255,255,.15); overflow: hidden; min-width: 120px; }
  .rv-prog .tr i { display: block; height: 100%; background: #5CC4EE; border-radius: 4px; transition: width 300ms ease; }
  .rv-card { background: #fff; border: 1px solid var(--line); border-radius: 20px; box-shadow: 0 8px 28px rgba(14,34,51,.06); overflow: hidden; }
  .rv-top { display: flex; align-items: center; gap: 10px; padding: 14px 20px; border-bottom: 1px solid var(--line); font-size: 13.5px; color: var(--muted); flex-wrap: wrap; }
  .rv-top img { width: 18px; height: 18px; border-radius: 4px; }
  .rv-top b { color: var(--fg); font-weight: 600; }
  .rv-body { padding: 22px 24px; display: flex; flex-direction: column; gap: 14px; background: #FAFCFE; }
  .bub { max-width: 80%; padding: 12px 15px; border-radius: 18px; font-size: 15px; line-height: 1.5; }
  .bub.c { align-self: flex-start; background: #fff; border: 1px solid var(--line); border-top-left-radius: 6px; }
  .bub.a { align-self: flex-end; background: var(--accent); color: #fff; border-top-right-radius: 6px; }
  .bub small { display: block; font-size: 12px; opacity: .7; margin-top: 4px; }
  .rv-fix { padding: 0 24px 18px; background: #FAFCFE; }
  .rv-fix textarea { width: 100%; min-height: 80px; border: 1.5px solid var(--accent-2); border-radius: 14px; padding: 12px 14px; font: inherit; font-size: 15px; outline: none; resize: vertical; box-shadow: 0 0 0 4px rgba(17,157,218,.1); }
  .rv-acts { display: flex; gap: 10px; padding: 16px 20px; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .rv-acts button { height: 46px; padding: 0 18px; border-radius: 12px; font-weight: 700; font-size: 14.5px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
  .rv-ok { border: 0; background: #1A9E6B; color: #fff; flex: 1; justify-content: center; }
  .rv-ok:hover { background: #158A5D; }
  .rv-edit { border: 1px solid var(--line); background: #fff; color: var(--fg); flex: 1; justify-content: center; }
  .rv-edit:hover { border-color: var(--warn); color: var(--warn); }
  .rv-skip { border: 0; background: none; color: var(--muted); }
  .rv-acts kbd { font-family: var(--font-mono); font-size: 11px; padding: 1px 6px; border-radius: 5px; background: rgba(255,255,255,.2); border: 0; color: inherit; }
  .rv-edit kbd, .rv-skip kbd { background: var(--soft); }
  .rv-side { display: flex; flex-direction: column; gap: 16px; }
  .rv-list { list-style: none; margin: 0; padding: 6px; background: #fff; border: 1px solid var(--line); border-radius: 16px; }
  .rv-list li { display: flex; gap: 10px; align-items: center; padding: 10px; border-radius: 10px; font-size: 13.5px; }
  .rv-list li.cur { background: var(--accent-soft); }
  .rv-list li img { width: 16px; height: 16px; border-radius: 4px; flex: none; }
  .rv-list li span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rv-list li small { color: var(--faint); flex: none; }
  .rv-stat { display: grid; grid-template-columns: 1fr 1fr 1fr; background: #fff; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .rv-stat div { padding: 14px; text-align: center; }
  .rv-stat div + div { border-left: 1px solid var(--line); }
  .rv-stat b { display: block; font-family: var(--font-head); font-size: 22px; font-weight: 800; }
  .rv-stat span { font-size: 12.5px; color: var(--muted); }

  /* Ürünler */
  .train { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  .tr-card { display: flex; align-items: center; gap: 14px; padding: 16px 18px; background: #fff; border: 1px solid var(--line); border-radius: 16px; }
  .tr-card .ti { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; flex: none; }
  .tr-card .tx { flex: 1; min-width: 0; }
  .tr-card b { display: block; font-family: var(--font-head); font-weight: 700; font-size: 15px; }
  .tr-card span { display: block; font-size: 13px; color: var(--muted); margin-top: 1px; }
  .ptable { background: #fff; border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
  .pt-head, .pt-row { display: grid; grid-template-columns: 36px minmax(0, 2.6fr) minmax(0, 1.4fr) 110px 150px 96px; align-items: center; gap: 14px; padding: 0 18px; }
  .pt-head { height: 44px; font-size: 12.5px; color: var(--muted); background: #FAFCFD; border-bottom: 1px solid var(--line); }
  .pt-row { min-height: 72px; border-bottom: 1px solid var(--line); }
  .pt-row:hover { background: #FAFCFD; }
  .pt-row input[type=checkbox], .pt-head input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--navy); }
  .pt-prod { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .thumb { width: 48px; height: 48px; border-radius: 10px; flex: none; position: relative; overflow: hidden; }
  .thumb::after { content: ""; position: absolute; inset: 0; background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.35) 0 4px, transparent 4px 10px); }
  .pt-prod b { display: block; font-weight: 600; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pt-prod code { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); background: var(--soft); padding: 1px 6px; border-radius: 5px; }
  .pt-cat { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pt-price { font-family: var(--font-head); font-weight: 700; font-size: 15px; text-align: right; font-variant-numeric: tabular-nums; }
  .pt-tr { display: flex; gap: 6px; }
  .pt-tr span { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 8px; border-radius: 999px; font-size: 12px; font-weight: 600; background: #EEF8F3; color: #13724F; }
  .pt-tr span.no { background: var(--soft); color: var(--muted); }
  .pt-act { display: flex; gap: 2px; justify-content: flex-end; }
  .pt-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 18px; font-size: 13.5px; color: var(--muted); flex-wrap: wrap; }
  .pager { display: flex; gap: 4px; }
  .pager button { min-width: 36px; height: 36px; padding: 0 10px; border-radius: 9px; border: 1px solid var(--line); background: #fff; color: var(--fg); font-weight: 600; cursor: pointer; display: grid; place-items: center; }
  .pager button[aria-current="page"] { background: var(--navy); border-color: var(--navy); color: #fff; }
  .pager button:disabled { color: #C9D4DC; cursor: default; }

  /* Siparişler */
  .ord-kpi { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: #fff; border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
  .ord-kpi div { padding: 18px 22px; }
  .ord-kpi div + div { border-left: 1px solid var(--line); }
  .ord-kpi span { font-size: 13.5px; color: var(--muted); }
  .ord-kpi b { display: block; font-family: var(--font-head); font-size: 30px; font-weight: 800; letter-spacing: -0.03em; margin-top: 8px; }
  .ord-kpi small { font-size: 12.5px; color: var(--muted); }
  .ord-empty { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 32px; align-items: center; padding: 36px; background: #fff; border: 1px solid var(--line); border-radius: 20px; }
  .ord-empty h2 { font-size: 24px; font-weight: 800; letter-spacing: -0.03em; }
  .ord-empty p { margin: 8px 0 20px; color: var(--muted); font-size: 15px; line-height: 1.55; }
  .steps { list-style: none; margin: 0; padding: 0; counter-reset: st; display: flex; flex-direction: column; gap: 12px; }
  .steps li { display: flex; gap: 14px; align-items: flex-start; padding: 16px; border-radius: 14px; background: #F5F8FB; }
  .steps li::before { counter-increment: st; content: counter(st); width: 30px; height: 30px; border-radius: 50%; background: var(--navy); color: #fff; display: grid; place-items: center; font-family: var(--font-head); font-weight: 800; font-size: 14px; flex: none; }
  .steps b { display: block; font-weight: 600; font-size: 14.5px; }
  .steps span { display: block; color: var(--muted); font-size: 13.5px; margin-top: 2px; }

  /* Kayıtlı Gönderiler */
  .match { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; padding: 20px 24px; border-radius: 18px; background: #fff; border: 1px solid var(--line); }
  .ring { position: relative; width: 72px; height: 72px; flex: none; }
  .ring svg { transform: rotate(-90deg); }
  .ring b { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-head); font-weight: 800; font-size: 17px; }
  .match .tx { flex: 1; min-width: 240px; }
  .match .tx b { display: block; font-family: var(--font-head); font-size: 18px; font-weight: 700; }
  .match .tx span { display: block; color: var(--muted); font-size: 14px; margin-top: 3px; }
  .match .warnline { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 13.5px; color: var(--warn); }
  .match .warnline button { border: 0; background: none; color: var(--navy); font-weight: 700; cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 3px; }
  .posts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
  .post { background: #fff; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; transition: box-shadow 160ms ease, border-color 160ms ease; }
  .post:hover { border-color: #CBD8E2; box-shadow: 0 10px 26px rgba(11,43,64,.07); }
  .post-img { position: relative; aspect-ratio: 1 / 1; }
  .post-img .ph { position: absolute; inset: 0; display: grid; place-items: center; color: rgba(14,34,51,.35); }
  .post-img .tp { position: absolute; top: 10px; left: 10px; height: 24px; padding: 0 9px; border-radius: 999px; background: rgba(255,255,255,.95); font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 5px; }
  .post-img .tp img { width: 14px; height: 14px; }
  .post-b { padding: 14px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .post-need { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 12px; background: var(--warn-soft); }
  .post-need b { font-size: 13.5px; font-weight: 600; color: #7A4507; }
  .post-need span { font-size: 12.5px; color: var(--warn); }
  .post-need button { align-self: flex-start; height: 32px; padding: 0 12px; border-radius: 9px; border: 0; background: var(--navy); color: #fff; font-weight: 600; font-size: 13px; cursor: pointer; }
  .post-linked { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 12px; background: #EEF8F3; }
  .post-linked .thumb { width: 36px; height: 36px; border-radius: 8px; }
  .post-linked b { display: block; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .post-linked span { font-size: 12px; color: #13724F; }
  .post-meta { display: flex; align-items: center; gap: 12px; font-size: 12.5px; color: var(--muted); margin-top: auto; }
  .post-meta span { display: inline-flex; align-items: center; gap: 4px; }
  .post-meta button { margin-left: auto; border: 0; background: none; color: var(--navy); font-weight: 600; font-size: 13px; cursor: pointer; }

  @media (max-width: 1150px) {
    .review { grid-template-columns: 1fr; }
    .train { grid-template-columns: 1fr; }
    .pt-head { display: none; }
    .pt-row { grid-template-columns: 28px minmax(0, 1fr) auto; padding: 12px 14px; }
    .pt-row > .pt-cat, .pt-row > .pt-tr { display: none; }
    .ord-empty { grid-template-columns: 1fr; }
    .posts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 640px) {
    .posts { grid-template-columns: 1fr; }
    .ord-kpi { grid-template-columns: 1fr; }
    .ord-kpi div + div { border-left: 0; border-top: 1px solid var(--line); }
    .pt-row > .pt-act { display: none; }
  }


  /* ---- Kanallar v2: lacivert özet bandı, solda kategori menüsü, sağda marka renkli kartlar ---- */
  .chband { position: relative; overflow: hidden; display: flex; align-items: center; gap: 24px; flex-wrap: wrap; padding: 24px 26px; border-radius: 22px; color: #fff;
    background: radial-gradient(80% 140% at 100% 0%, rgba(17,157,218,.45) 0%, rgba(17,157,218,0) 55%), linear-gradient(135deg, #0B2B40 0%, #0E3A57 100%); }
  .chband::after { content: ""; position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.07) 1px, transparent 1px); background-size: 16px 16px; pointer-events: none; }
  .chband > * { position: relative; z-index: 1; }
  .chband .tx { flex: 1; min-width: 240px; }
  .chband h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.03em; color: #fff; }
  .chband p { margin: 6px 0 0; color: rgba(255,255,255,.8); font-size: 15px; }
  .chband .ok { display: inline-flex; align-items: center; gap: 6px; margin-top: 12px; height: 28px; padding: 0 12px; border-radius: 999px; background: rgba(61,220,151,.16); color: #7CF0BE; font-weight: 600; font-size: 13px; }
  .chband .ok i { width: 7px; height: 7px; border-radius: 50%; background: #3DDC97; }
  .logo-stack { display: flex; }
  .logo-stack span { width: 46px; height: 46px; border-radius: 50%; background: #fff; display: grid; place-items: center; margin-left: -10px; box-shadow: 0 0 0 3px #0D3550; color: var(--accent); }
  .logo-stack span:first-child { margin-left: 0; }
  .logo-stack img { width: 26px; height: 26px; object-fit: contain; border-radius: 5px; }
  .logo-stack .more { background: rgba(255,255,255,.14); color: #fff; font-weight: 700; font-size: 13px; }
  .chlay { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 24px; align-items: start; }
  .chnav { position: sticky; top: 0; display: flex; flex-direction: column; gap: 2px; }
  .chnav .srch { height: 40px; margin-bottom: 10px; background: #fff; border: 1px solid var(--line); }
  .chnav button { display: flex; align-items: center; gap: 10px; height: 42px; padding: 0 12px; border: 0; border-radius: 11px; background: none; color: var(--muted); font-size: 14.5px; font-weight: 500; cursor: pointer; text-align: left; }
  .chnav button:hover { background: var(--soft); color: var(--fg); }
  .chnav button[aria-current="true"] { background: var(--navy); color: #fff; font-weight: 600; }
  .chnav button .c { margin-left: auto; font-size: 12px; font-weight: 700; opacity: .75; font-variant-numeric: tabular-nums; }
  .chnav hr { border: 0; height: 1px; background: var(--line); margin: 8px 4px; }
  .chsec + .chsec { margin-top: 28px; }
  .chsec-h { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; }
  .chsec-h h2 { font-size: 19px; font-weight: 800; letter-spacing: -0.02em; }
  .chsec-h span { color: var(--muted); font-size: 13.5px; }
  .chcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
  .chk { display: flex; flex-direction: column; background: #fff; border: 1px solid var(--line); border-radius: 18px; overflow: hidden; transition: border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease; }
  .chk:hover { border-color: #C9D7E2; box-shadow: 0 12px 28px rgba(11,43,64,.08); transform: translateY(-2px); }
  .chk-top { position: relative; height: 76px; display: flex; align-items: flex-end; padding: 0 16px; }
  .chk-logo { width: 54px; height: 54px; border-radius: 16px; background: #fff; display: grid; place-items: center; box-shadow: 0 6px 16px rgba(14,34,51,.12); transform: translateY(18px); color: var(--accent); }
  .chk-logo img { width: 32px; height: 32px; object-fit: contain; border-radius: 6px; }
  .chk-st { position: absolute; top: 12px; right: 12px; display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 999px; background: rgba(255,255,255,.92); font-size: 12px; font-weight: 600; color: #13724F; }
  .chk-st i { width: 6px; height: 6px; border-radius: 50%; background: #1A9E6B; }
  .chk-st.off { color: var(--muted); }
  .chk-st.off i { background: #B8C6D1; }
  .chk-st.soon { color: var(--warn); }

/* React Bits · CountUp (yalnızca import satırları değişti) */
function CountUp({ to, from = 0, direction = 'up', delay = 0, duration = 2, className = '', startWhen = true, separator = '', onStart, onEnd }) {
  const ref = useRef(null);
  const motionValue = useMotionValue(direction === 'down' ? to : from);
  const damping = 20 + 40 * (1 / duration);
  const stiffness = 100 * (1 / duration);
  const springValue = useSpring(motionValue, { damping, stiffness });
  const isInView = useInView(ref, { once: true, margin: '0px' });
  const getDecimalPlaces = num => { const str = num.toString(); if (str.includes('.')) { const d = str.split('.')[1]; if (parseInt(d) !== 0) return d.length; } return 0; };
  const maxDecimals = Math.max(getDecimalPlaces(from), getDecimalPlaces(to));
  const formatValue = useCallback(latest => {
    const hasDecimals = maxDecimals > 0;
    const options = { useGrouping: !!separator, minimumFractionDigits: hasDecimals ? maxDecimals : 0, maximumFractionDigits: hasDecimals ? maxDecimals : 0 };
    const formattedNumber = Intl.NumberFormat('en-US', options).format(latest);
    return separator ? formattedNumber.replace(/,/g, separator) : formattedNumber;
  }, [maxDecimals, separator]);
  useEffect(() => { if (ref.current) ref.current.textContent = formatValue(direction === 'down' ? to : from); }, [from, to, direction, formatValue]);
  useEffect(() => {
    if (isInView && startWhen) {
      if (typeof onStart === 'function') onStart();
      const t1 = setTimeout(() => { motionValue.set(direction === 'down' ? from : to); }, delay * 1000);
      const t2 = setTimeout(() => { if (typeof onEnd === 'function') onEnd(); }, delay * 1000 + duration * 1000);
      return () => { clearTimeout(t1); clearTimeout(t2); };
    }
  }, [isInView, startWhen, motionValue, direction, from, to, delay, onStart, onEnd, duration]);
  useEffect(() => { const u = springValue.on('change', l => { if (ref.current) ref.current.textContent = formatValue(l); }); return () => u(); }, [springValue, formatValue]);
  return <span className={className} ref={ref} />;
}
const Count = ({ to, sep = '.' }) => <CountUp to={to} separator={sep} duration={reduceMotion ? 0.01 : 1.4} className="num" />;

const STEPS = [
  { t: 'Kanal bağla', d: 'Instagram, web sitesi veya pazaryeri', v: 'channels' },
  { t: 'Ürünlerini aktar', d: 'Kataloğunu asistanına tanıt', v: 'products' },
  { t: 'Bilgi bankasını doldur', d: 'Kargo, iade ve ödeme bilgileri', v: 'assistants' },
  { t: 'Asistanını test et', d: 'Birkaç soru sor, cevaplarına bak', v: 'test' },
  { t: "Widget'ı sitene ekle", d: 'Tek satır kodla yayına al', v: 'channels' },
];
function SetupBubble({ onNav }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  const done = 0, total = STEPS.length, C = 2 * Math.PI * 26;
  useEffect(() => {
    if (!open) return;
    const onDown = e => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    const onKey = e => { if (e.key === 'Escape') setOpen(false); };
    document.addEventListener('mousedown', onDown); document.addEventListener('keydown', onKey);
    return () => { document.removeEventListener('mousedown', onDown); document.removeEventListener('keydown', onKey); };
  }, [open]);
  return (
    <div ref={ref}>
      {open && (
        <div className="checklist" role="dialog" aria-label="Kurulum adımları">
          <div className="cl-head">
            <b>Kurulumu tamamla</b>
            <p><span className="num">{done}/{total}</span> adım tamamlandı. Kalan adımlar asistanının daha iyi cevap vermesini sağlar.</p>
            <div className="cl-bar"><i style={{ width: `${done / total * 100}%` }} /></div>
          </div>
          <ul className="cl-list">
            {STEPS.map(st => (
              <li key={st.t}>
                <button type="button" className="cl-item" onClick={() => { setOpen(false); onNav(st.v); }}>
                  <span className="cl-check" aria-hidden="true" />
                  <span><b>{st.t}</b><span className="d">{st.d}</span></span>
                  <span className="go"><Icon icon={I.ArrowRight01} size={16} /></span>
                </button>
              </li>
            ))}
          </ul>
        </div>
      )}
      <button type="button" className="bubble" onClick={() => setOpen(o => !o)} aria-expanded={open} aria-label={`Kurulumu tamamla, ${done}/${total}`}>
        <svg className="ring" width="56" height="56" viewBox="0 0 56 56" aria-hidden="true">
          <circle cx="28" cy="28" r="26" fill="none" stroke="var(--soft-2)" strokeWidth="3" />
          <circle cx="28" cy="28" r="26" fill="none" stroke="var(--accent)" strokeWidth="3" strokeLinecap="round" strokeDasharray={C} strokeDashoffset={C * (1 - done / total)} />
        </svg>
        <span className="core"><Icon icon={open ? I.Cancel01 : I.Rocket01} size={20} /></span>
        {!open && <span className="cnt num">{done}/{total}</span>}
      </button>
    </div>
  );
}

/* =========================================================================
   React Bits · OrbitImages (src/tailwind/Animations/OrbitImages, Dominik Koch)
   Değişiklikler: Tailwind sınıfları satır içi stile çevrildi; resim yolu yerine hazır öğe (logo düğümü) alıyor;
   yalnızca bu sayfada kullanılan "circle" şekli bırakıldı. Hareket mantığı birebir.
   ========================================================================= */
function generateCirclePath(cx, cy, r) {
  return `M ${cx - r} ${cy} A ${r} ${r} 0 1 0 ${cx + r} ${cy} A ${r} ${r} 0 1 0 ${cx - r} ${cy}`;
}
function OrbitItem({ item, index, totalItems, path, itemSize, rotation, progress, fill }) {
  const itemOffset = fill ? (index / totalItems) * 100 : 0;
  const offsetDistance = useTransform(progress, p => `${(((p + itemOffset) % 100) + 100) % 100}%`);
  return (
    <motion.div style={{ position: 'absolute', width: itemSize, height: itemSize, offsetPath: `path("${path}")`, offsetRotate: '0deg', offsetAnchor: 'center center', offsetDistance, willChange: 'transform' }}>
      <div style={{ transform: `rotate(${-rotation}deg)`, width: '100%', height: '100%' }}>{item}</div>
    </motion.div>
  );
}
function OrbitImages({ items = [], baseWidth = 420, radius = 160, rotation = 0, duration = 60, itemSize = 52, direction = 'normal', fill = true, paused = false, centerContent }) {
  const ref = useRef(null);
  const [scale, setScale] = useState(null);
  const c = baseWidth / 2;
  const path = useMemo(() => generateCirclePath(c, c, radius), [c, radius]);
  useLayoutEffect(() => {
    if (!ref.current) return;
    const upd = () => ref.current && setScale(ref.current.clientWidth / baseWidth);
    upd();
    const ro = new ResizeObserver(upd); ro.observe(ref.current);
    return () => ro.disconnect();
  }, [baseWidth]);
  const progress = useMotionValue(0);
  useEffect(() => {
    if (paused) return;
    const controls = animate(progress, direction === 'reverse' ? -100 : 100, { duration, ease: 'linear', repeat: Infinity, repeatType: 'loop' });
    return () => controls.stop();
  }, [progress, duration, direction, paused]);
  return (
    <div ref={ref} style={{ position: 'relative', width: '100%', aspectRatio: '1 / 1' }}>
      <div style={{ position: 'absolute', left: '50%', top: '50%', width: baseWidth, height: baseWidth, transform: scale !== null ? `translate(-50%, -50%) scale(${scale})` : undefined, visibility: scale === null ? 'hidden' : undefined, transformOrigin: 'center' }} aria-hidden="true">
        <div className="orbit-ring" style={{ left: c - radius, top: c - radius, width: radius * 2, height: radius * 2 }} />
        <div className="orbit-ring" style={{ left: c - radius * 0.62, top: c - radius * 0.62, width: radius * 1.24, height: radius * 1.24, borderStyle: 'solid', borderColor: '#EAF2F7' }} />
        <div style={{ position: 'relative', width: '100%', height: '100%', transform: `rotate(${rotation}deg)` }}>
          {items.map((item, i) => <OrbitItem key={i} item={item} index={i} totalItems={items.length} path={path} itemSize={itemSize} rotation={rotation} progress={progress} fill={fill} />)}
        </div>
      </div>
      {centerContent && <div style={{ position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1 }}>{centerContent}</div>}
    </div>
  );
}

/* =========================================================================
   React Bits · RotatingText (src/tailwind/TextAnimations/RotatingText)
   Değişiklikler: Tailwind sınıfları .rt-* sınıflarına çevrildi; kullanılmayan stagger seçenekleri sadeleşti.
   ========================================================================= */
const RotatingText = forwardRef((props, ref) => {
  // React Bits RotatingText'ten uyarlandı: harf harf aşağıdan gelme efekti framer-motion yerine CSS animasyonuyla
  const { texts, rotationInterval = 2000, staggerDuration = 0, auto = true, mainClassName = '' } = props;
  const [idx, setIdx] = useState(0);
  const rotated = useRef(false);
  const split = t => (typeof Intl !== 'undefined' && Intl.Segmenter) ? Array.from(new Intl.Segmenter('tr', { granularity: 'grapheme' }).segment(t), x => x.segment) : Array.from(t);
  const words = useMemo(() => texts[idx].split(' ').map((w, i, arr) => ({ chars: split(w), space: i !== arr.length - 1 })), [texts, idx]);
  const next = useCallback(() => { rotated.current = true; setIdx(i => (i === texts.length - 1 ? 0 : i + 1)); }, [texts.length]);
  useImperativeHandle(ref, () => ({ next }), [next]);
  useEffect(() => { if (!auto) return; const id = setInterval(next, rotationInterval); return () => clearInterval(id); }, [next, rotationInterval, auto]);
  let n = 0;
  return (
    <span className={`rt-main ${mainClassName}`}>
      <span className="sr-only">{texts[idx]}</span>
      <span key={idx} className="rt-main" aria-hidden="true">
        {words.map((w, wi) => (
          <span key={wi} className="rt-word">
            {w.chars.map((ch, ci) => <span key={ci} className={`rt-char${rotated.current ? ' rt-in' : ''}`} style={rotated.current ? { animationDelay: `${(n++) * staggerDuration}s` } : undefined}>{ch}</span>)}
            {w.space && <span style={{ whiteSpace: 'pre' }}> </span>}
          </span>
        ))}
      </span>
    </span>
  );
});

function DailyCheck({ onNav }) {
  const TOTAL = 76;
  const [i, setI] = useState(0);
  const [ok, setOk] = useState(0);
  const [fixed, setFixed] = useState(0);
  const [editing, setEditing] = useState(false);
  const [txt, setTxt] = useState('');
  const done = ok + fixed;
  const r = REVIEW[i % REVIEW.length];
  const nextItem = () => { setI(n => n + 1); setEditing(false); setTxt(''); };
  const approve = () => { setOk(n => n + 1); nextItem(); };
  const saveFix = () => { if (!txt.trim()) return; setFixed(n => n + 1); nextItem(); };
  useEffect(() => {
    const onKey = e => {
      if (/INPUT|TEXTAREA/.test(e.target.tagName)) return;
      if (e.key === 'd' || e.key === 'D') { e.preventDefault(); approve(); }
      if (e.key === 'e' || e.key === 'E') { e.preventDefault(); setEditing(true); setTxt(r.a); }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  });
  return (
    <div className="pz">
      <header className="pz-h">
        <div><h1>Günlük kontrol</h1><p>Asistanın dün verdiği cevaplara hızlıca göz at. Doğruysa onayla, yanlışsa düzelt; düzelttiklerini öğrenir.</p></div>
      </header>
      <div className="rv-prog"><b className="num">{done} / {TOTAL}</b><span>cevap incelendi</span><span className="tr"><i style={{ width: `${done / TOTAL * 100}%` }} /></span><span>{TOTAL - done} kaldı</span></div>
      <div className="review">
        <div className="rv-card">
          <div className="rv-top">
            {r.ch === 'web' ? <Icon icon={I.Globe02} size={16} /> : <img src={LOGOS.instagram} alt="" />}
            <b>{r.who}</b><span>{r.ch === 'web' ? 'Web sitesi' : 'Instagram'}</span><span style={{ marginLeft: 'auto' }}>{r.asst}, {r.t}</span>
          </div>
          <div className="rv-body">
            <div className="bub c">{r.q}<small>Müşteri</small></div>
            <div className="bub a">{r.a}<small>{r.asst}</small></div>

              <div className="chcards">{on.filter(match).map((x, i) => <ChannelCard key={i} x={x} />)}</div>
            </section>
          )}
          {groups.map(([k, l]) => {
            const items = CH_ALL.filter(x => x.g === k && match(x));
            if (!items.length) return null;
            const nOn = items.filter(x => x.on).length;
            return (
              <section key={k} className="chsec">
                <div className="chsec-h"><h2>{l}</h2><span>{nOn ? `${nOn} bağlı, ` : ''}{items.length - nOn} bağlanabilir</span></div>
                <div className="chcards">{items.map((x, i) => <ChannelCard key={i} x={x} />)}</div>
              </section>
            );
          })}
        </div>
      </div>
    </div>
  );
}

/* Geçen ay / bu ay ikiz çubukları: görünür olunca alttan büyür (framer-motion) */
function TwinBars({ now, prev, delay = 0 }) {
  const ref = useRef(null);
  const inView = useInView(ref, { once: true, amount: 0.6 });
  const max = Math.max(now, prev, 1);
  const H = 48;
  const h = v => Math.max(v > 0 ? 6 : 0, Math.round(v / max * H));
  const t = reduceMotion ? { duration: 0 } : { type: 'spring', stiffness: 120, damping: 18 };
  return (
    <div className="twin" ref={ref} aria-hidden="true">
      <div className="bar prev">
        <motion.i initial={{ height: 0 }} animate={{ height: inView ? h(prev) : 0 }} transition={{ ...t, delay }} />
        <small>Eyl</small>
      </div>
      <div className={`bar now${now === 0 ? ' zero' : ''}`}>
        {now === 0
          ? <motion.i initial={{ opacity: 0 }} animate={{ opacity: inView ? 1 : 0 }} transition={{ duration: .3, delay: delay + .35 }} />
          : <motion.i initial={{ height: 0 }} animate={{ height: inView ? h(now) : 0 }} transition={{ ...t, delay: delay + .25 }} />}
        <small>Eki</small>
      </div>
    </div>
  );
}

function Delta({ pct, delay = 0 }) {
  return (

      <Icon icon={I.ArrowDownRight01} size={12} sw={2} />%{pct}
    </motion.span>
  );
}
