<title>Ailways Çift Panel Menü</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap&subset=latin-ext" rel="stylesheet">
<style>
  /* Varyant B (refs/image.png): kenardan içeride duran mavi kapsül ikon rayı + bölüm sayfalarını listeleyen ikinci panel.
     Panel kapanınca yalnızca ray kalır, ray ikonları sayfaları açılır bir listede gösterir. Zemin beyaz, tek tema. */
  :root {
    --bg: #FFFFFF;
    --surface: #FFFFFF;
    --surface-2: #F1F5F9;     /* hover, arama kutusu */
    --line: #E3EAF0;
    --fg: #0F1F2C;
    --muted: #64748B;
    --accent: #0A87C5;
    --accent-2: #119DDA;
    --accent-soft: #E6F4FB;
    --rail-top: #16A6E0;      /* ray gradyanı: logonun tonları */
    --rail-bottom: #0A82BE;
    --crit: #D2392F;
    --crit-soft: #FDECEA;
    --warn: #B26100;
    --warn-soft: #FFF3E0;
    --shadow-rail: 0 10px 30px rgba(10, 130, 190, .28);
    --shadow-pop: 0 2px 4px rgba(15, 31, 44, .06), 0 16px 40px rgba(15, 31, 44, .12);
    --font-sans: "Geist", ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    --font-mono: "Geist Mono", ui-monospace, Consolas, monospace;
    color-scheme: light;
  }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-sans); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
  .num { font-variant-numeric: tabular-nums; }
  #root { height: 100%; }
  .app { display: flex; height: 100%; }

  /* ---------- Ray ---------- */
  .rail-wrap { flex: none; padding: 14px 0 14px 14px; height: 100%; box-sizing: border-box; position: relative; z-index: 40; }
  .rail {
    width: 72px; height: 100%; box-sizing: border-box;
    display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 18px 0 16px;
    border-radius: 36px; background: linear-gradient(180deg, var(--rail-top), var(--rail-bottom));
    box-shadow: var(--shadow-rail); color: #fff;
  }
  .rail-logo { width: 42px; height: 42px; border-radius: 13px; display: block; box-shadow: 0 0 0 2px rgba(255,255,255,.55); margin-bottom: 18px; }
  .rail-sep { width: 26px; height: 1px; background: rgba(255,255,255,.35); margin: 10px 0; }
  .rail-btn {
    position: relative; width: 48px; height: 48px; border-radius: 15px; border: 0; background: none; cursor: pointer;
    display: grid; place-items: center; color: rgba(255,255,255,.72);
    transition: background-color 160ms ease, color 160ms ease;
  }
  .rail-btn:hover { background: rgba(255,255,255,.14); color: #fff; }
  .rail-btn[aria-current="true"] { background: #fff; color: var(--accent); box-shadow: 0 4px 12px rgba(4, 60, 90, .22); }
  .rail-btn:focus-visible { outline-color: #fff; }
  .rail-badge { position: absolute; top: 6px; right: 6px; width: 9px; height: 9px; border-radius: 50%; background: #FF5A4E; box-shadow: 0 0 0 2px var(--rail-top); }
  .rail-btn[aria-current="true"] .rail-badge { box-shadow: 0 0 0 2px #fff; }
  .rail-spacer { flex: 1; }
  .rail-avatar { width: 42px; height: 42px; border-radius: 50%; border: 2px solid rgba(255,255,255,.8); background: #fff; color: var(--accent); display: grid; place-items: center; font-weight: 650; cursor: pointer; padding: 0; }

  /* ---------- İkinci panel ---------- */
  .panel {
    flex: none; width: 264px; height: 100%; box-sizing: border-box; overflow: hidden;
    display: flex; flex-direction: column; padding: 30px 18px 18px 22px;
    border-right: 1px solid var(--line);
    transition: width 240ms cubic-bezier(0.23, 1, 0.32, 1), padding 240ms cubic-bezier(0.23, 1, 0.32, 1), opacity 180ms ease;
  }
  .panel[data-closed] { width: 0; padding-left: 0; padding-right: 0; opacity: 0; border-right-color: transparent; }
  .panel-inner { width: 224px; display: flex; flex-direction: column; height: 100%; min-height: 0; }
  .panel-head { display: flex; align-items: center; gap: 8px; margin-bottom: 22px; min-height: 40px; }
  .panel-head h2 { margin: 0; font-size: 22px; font-weight: 650; letter-spacing: -0.02em; flex: 1; min-width: 0; }
  .round-add { width: 38px; height: 38px; border-radius: 50%; border: 0; display: grid; place-items: center; cursor: pointer; color: #fff; background: linear-gradient(180deg, var(--accent-2), var(--accent)); box-shadow: 0 6px 14px rgba(10, 135, 197, .3); flex: none; }
  .round-add:hover { filter: brightness(1.06); }
  .icon-btn { width: 34px; height: 34px; border-radius: 10px; border: 0; background: none; color: var(--muted); display: grid; place-items: center; cursor: pointer; flex: none; transition: background-color 150ms ease, color 150ms ease; }
  .icon-btn:hover { background: var(--surface-2); color: var(--fg); }
  .nav-list { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; margin: 0 -6px; padding: 0 6px; scrollbar-width: thin; }
  .nav-row {
    display: flex; align-items: center; gap: 12px; width: 100%; height: 46px; padding: 0 10px; border: 0; border-radius: 12px;
    background: none; cursor: pointer; text-align: left; color: var(--fg); font-size: 14.5px;
    transition: background-color 150ms ease, color 150ms ease;
  }
  .nav-row:hover { background: var(--surface-2); }
  .nav-row .ic { color: var(--muted); display: inline-grid; flex: none; }
  .nav-row[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .nav-row[aria-current="page"] .ic { color: var(--accent); }
  .nav-row .lbl { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chev { color: var(--muted); display: inline-grid; transition: transform 200ms ease; }
  .chev[data-open] { transform: rotate(180deg); }
  .sub { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 240ms cubic-bezier(0.23, 1, 0.32, 1); }
  .sub[data-open] { grid-template-rows: 1fr; }
  .sub > div { min-height: 0; overflow: hidden; }
  .sub-row { display: flex; align-items: center; gap: 10px; width: 100%; height: 36px; padding: 0 10px 0 46px; border: 0; background: none; border-radius: 10px; cursor: pointer; color: var(--muted); text-align: left; font-size: 14px; }
  .sub-row:hover { color: var(--fg); background: var(--surface-2); }
  .sub-row[aria-current="true"] { color: var(--fg); font-weight: 600; }
  .sub-row .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .pill { display: inline-flex; align-items: center; height: 21px; padding: 0 8px; border-radius: 999px; font-size: 11.5px; font-weight: 650; font-variant-numeric: tabular-nums; flex: none; }
  .pill-accent { background: var(--accent-soft); color: var(--accent); }
  .pill-crit { background: var(--crit-soft); color: var(--crit); }
  .nav-row[aria-current="page"] .pill-accent { background: #fff; }

  .setup { margin-top: 14px; display: flex; gap: 12px; align-items: center; padding: 14px; border-radius: 16px; background: var(--surface-2); border: 0; width: 100%; text-align: left; cursor: pointer; }
  .setup:hover { background: #E9F0F6; }
  .setup-ic { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; flex: none; color: #fff; background: linear-gradient(180deg, #FFB547, #F08A00); box-shadow: 0 6px 14px rgba(240, 138, 0, .28); }
  .setup b { display: block; font-weight: 600; font-size: 13.5px; }
  .setup span { color: var(--muted); font-size: 12.5px; }
  .progress { height: 4px; border-radius: 2px; background: #DCE5EC; margin-top: 7px; overflow: hidden; }
  .progress i { display: block; height: 100%; background: var(--accent); }

  /* ---------- Açılır sayfa listesi (panel kapalıyken) ---------- */
  .fly { position: fixed; z-index: 70; width: 232px; padding: 8px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-pop); }
  .fly-title { font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); padding: 8px 10px 6px; }
  .fly .nav-row { height: 40px; font-size: 14px; }
  .tip { position: fixed; z-index: 60; pointer-events: none; transform: translateY(-50%); padding: 6px 10px; border-radius: 8px; background: var(--fg); color: #fff; font-size: 12.5px; font-weight: 500; white-space: nowrap; }

  /* ---------- Ana alan ---------- */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100%; }
  .topbar { flex: none; display: flex; align-items: center; gap: 14px; padding: 30px 36px 0; min-height: 40px; flex-wrap: wrap; }
  .topbar h1 { margin: 0; font-size: 26px; font-weight: 650; letter-spacing: -0.02em; text-wrap: balance; }
  .info { color: var(--muted); display: inline-grid; }
  .search { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 999px; background: var(--surface-2); color: var(--muted); width: 240px; max-width: 100%; box-sizing: border-box; }
  .search input { border: 0; background: none; outline: none; font: inherit; color: var(--fg); width: 100%; min-width: 0; }
  .vr { width: 1px; height: 28px; background: var(--line); }
  .assist { display: flex; align-items: center; gap: 10px; }
  .assist small { display: block; color: var(--muted); font-size: 12px; line-height: 1.2; }
  .assist b { display: block; font-size: 15px; line-height: 1.2; }
  .stack { display: flex; }
  .stack span { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; border: 2px solid #fff; margin-left: -8px; font-size: 11px; font-weight: 650; color: #fff; }
  .stack span:first-child { margin-left: 0; }
  .content { flex: 1; min-height: 0; overflow-y: auto; padding: 24px 36px 48px; }
  .lead { color: var(--muted); margin: 6px 0 24px; max-width: 62ch; }
  .placeholder { border: 1.5px dashed var(--line); border-radius: 20px; min-height: 320px; display: grid; place-items: center; text-align: center; padding: 32px 16px; color: var(--muted); }
  .placeholder h3 { color: var(--fg); font-size: 16px; font-weight: 600; margin: 12px 0 4px; }
  .placeholder p { margin: 0 auto; max-width: 48ch; }
  kbd { font-family: var(--font-mono); font-size: 11.5px; padding: 1px 6px; border-radius: 5px; border: 1px solid var(--line); background: #fff; color: var(--fg); }
  .support { position: fixed; right: 24px; bottom: 22px; z-index: 30; display: inline-flex; align-items: center; gap: 8px; height: 42px; padding: 0 16px 0 12px; border-radius: 999px; border: 1px solid var(--line); background: #fff; color: var(--accent); font-weight: 600; cursor: pointer; box-shadow: 0 6px 20px rgba(15, 31, 44, .08); }
  .support:hover { border-color: #CFE3EE; }

  @media (max-width: 900px) {
    .panel { display: none; }
    .topbar { padding: 22px 16px 0; }
    .content { padding: 20px 16px 96px; }
    .search { order: 3; width: 100%; }
    .vr, .assist small { display: none; }
  }
  @media (max-width: 520px) {
    .rail-wrap { padding: 8px 0 8px 8px; }
    .rail { width: 60px; border-radius: 30px; }
    .rail-btn { width: 42px; height: 42px; }
    .rail-logo { width: 36px; height: 36px; margin-bottom: 8px; }
    .assist { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .panel, .sub, .chev { transition: none; } }
</style>

const ALL_SECTIONS = [...SECTIONS, SETTINGS];
const findPage = v => { for (const s of ALL_SECTIONS) { const p = s.pages.find(p => p.value === v); if (p) return { s, p }; } };

function PageRows({ section, active, sub, onPage, onSub, compact }) {
  const [open, setOpen] = useState(() => new Set(section.pages.filter(p => p.sub && p.value === active).map(p => p.value)));
  return section.pages.map(p => {
    const isOpen = open.has(p.value);
    return (
      <React.Fragment key={p.value}>
        <button type="button" className="nav-row" aria-current={p.value === active ? 'page' : undefined}
          onClick={() => { onPage(p.value); if (p.sub && !compact) setOpen(o => { const n = new Set(o); n.has(p.value) && p.value === active ? n.delete(p.value) : n.add(p.value); return n; }); }}>
          <span className="ic"><Icon icon={p.icon} size={20} /></span>
          <span className="lbl">{p.label}</span>
          {p.badge ? <span className={`pill ${p.tone === 'crit' ? 'pill-crit' : 'pill-accent'}`}>{p.badge}</span> : null}
          {p.sub && !compact ? <span className="chev" data-open={isOpen ? '' : undefined}><Icon icon={I.ArrowDown01} size={16} /></span> : null}
        </button>
        {p.sub && !compact && (
          <div className="sub" data-open={isOpen ? '' : undefined}>
            <div>
              {p.sub.map(s => (
                <button key={s.id} type="button" className="sub-row" tabIndex={isOpen ? 0 : -1}
                  aria-current={p.value === active && sub === s.id ? 'true' : undefined}
                  onClick={() => { onPage(p.value); onSub(s.id); }}>
                  <span className="dot" style={{ background: s.color }} />{s.label}
                </button>
              ))}
            </div>
          </div>
        )}
      </React.Fragment>
    );
  });
}

function App() {
  const readPanel = () => { try { return localStorage.getItem('ailways-b-panel') !== '0'; } catch { return true; } };
  const [panelOpen, setPanelOpen] = useState(readPanel);
  const [active, setActive] = useState('findings');
  const [sub, setSub] = useState(null);
  const [sectionId, setSectionId] = useState('konusma');
  const [fly, setFly] = useState(null);   // { section, top }
  const [tip, setTip] = useState(null);
  const flyRef = useRef(null);

  const { s: pageSection, p: page } = findPage(active);
  const section = ALL_SECTIONS.find(s => s.id === sectionId);

  useEffect(() => { try { localStorage.setItem('ailways-b-panel', panelOpen ? '1' : '0'); } catch {} }, [panelOpen]);

  const narrow = () => window.matchMedia('(max-width: 900px)').matches;
  const togglePanel = useCallback(() => { setFly(null); setTip(null); setPanelOpen(o => !o); }, []);

  useEffect(() => {
    const onKey = e => {
      if (e.key === 'Escape') setFly(null);
      if (e.key !== '[' || e.metaKey || e.ctrlKey || e.altKey) return;
      const t = e.target; if (t && (t.isContentEditable || /INPUT|TEXTAREA|SELECT/.test(t.tagName))) return;
      e.preventDefault(); togglePanel();
    };
    const onDown = e => { if (flyRef.current && !flyRef.current.contains(e.target) && !e.target.closest('.rail')) setFly(null); };
    window.addEventListener('keydown', onKey); document.addEventListener('mousedown', onDown);
    return () => { window.removeEventListener('keydown', onKey); document.removeEventListener('mousedown', onDown); };
  }, [togglePanel]);

  const onRail = (s, e) => {
    setTip(null);
    setSectionId(s.id);
    if (!panelOpen || narrow()) {
      const r = e.currentTarget.getBoundingClientRect();
      setFly(f => f && f.id === s.id ? null : { id: s.id, top: Math.min(r.top - 8, window.innerHeight - (s.pages.length * 42 + 60)), left: r.right + 18 });
    }
  };
  const goPage = v => { setActive(v); setSub(null); const fp = findPage(v); setSectionId(fp.s.id); setFly(null); };
  const showTip = (e, label) => {
    if (panelOpen && !narrow()) return;
    const r = e.currentTarget.getBoundingClientRect();
    setTip({ label, top: r.top + r.height / 2, left: r.right + 18 });
  };
  const flySection = fly && ALL_SECTIONS.find(s => s.id === fly.id);
  const railBtn = s => (
    <button key={s.id} type="button" className="rail-btn" aria-label={s.label}
      aria-current={sectionId === s.id ? 'true' : undefined} aria-expanded={fly?.id === s.id || undefined}
      onClick={e => onRail(s, e)} onMouseEnter={e => !fly && showTip(e, s.label)} onMouseLeave={() => setTip(null)}>
      <Icon icon={s.icon} size={22} />
      {s.alert && <span className="rail-badge" aria-hidden="true" />}
    </button>
  );
  const subLabel = sub && page.sub?.find(x => x.id === sub)?.label;

  return (
    <div className="app">
      <div className="rail-wrap">
        <nav className="rail" aria-label="Bölümler">
          <img className="rail-logo" src={LOGO} alt="Ailways" />
          {SECTIONS.map(railBtn)}
          <div className="rail-sep" aria-hidden="true" />
          {railBtn(SETTINGS)}
          <div className="rail-spacer" />
          <button type="button" className="rail-btn" aria-label={panelOpen ? 'Paneli kapat' : 'Paneli aç'} aria-expanded={panelOpen}
            onClick={togglePanel} onMouseEnter={e => showTip(e, 'Paneli aç  [')} onMouseLeave={() => setTip(null)}>
            <Icon icon={I.SidebarLeft} size={20} />
          </button>
          <button type="button" className="rail-avatar" aria-label="Hesap: Ailways" title="yusufailways@tuz.com">A</button>
        </nav>
      </div>

      <aside className="panel" data-closed={panelOpen ? undefined : ''} aria-hidden={!panelOpen} inert={panelOpen ? undefined : ''}>
        <div className="panel-inner">
          <div className="panel-head">
            <h2>{section.label}</h2>
            {section.add && <button type="button" className="round-add" aria-label={section.add} title={section.add}><Icon icon={I.Add01} size={20} sw={2} /></button>}
            <button type="button" className="icon-btn" onClick={togglePanel} aria-label="Paneli kapat" title="Paneli kapat  [">
              <Icon icon={I.SidebarLeft} size={18} />
            </button>
          </div>
          <div className="nav-list">
            <PageRows key={section.id} section={section} active={active} sub={sub} onPage={goPage} onSub={setSub} />
          </div>
          <button type="button" className="setup">
            <span className="setup-ic"><Icon icon={I.Rocket01} size={20} /></span>
            <span style={{ flex: 1, minWidth: 0 }}>
              <b>Kurulumu tamamla</b>
              <span className="num">0/5 adım tamamlandı</span>
              <div className="progress" aria-hidden="true"><i style={{ width: '0%' }} /></div>
            </span>
          </button>
        </div>
      </aside>

      <main className="main">
        <header className="topbar">
          <h1>{page.label}{subLabel ? <span style={{ color: 'var(--muted)', fontWeight: 500 }}> · {subLabel}</span> : null}</h1>
          <span className="info" title={page.desc}><Icon icon={I.HelpCircle} size={18} /></span>
          <span style={{ flex: 1 }} />
          <label className="search">
            <Icon icon={I.Search01} size={18} />
            <input id="search" type="search" placeholder="Ara" aria-label="Panelde ara" />
          </label>
          <span className="vr" aria-hidden="true" />
          <div className="assist">
            <div><b className="num">4</b><small>aktif asistan</small></div>
            <div className="stack" aria-hidden="true">
              <span style={{ background: '#119DDA' }}>AA</span>
              <span style={{ background: '#0E7490' }}>MD</span>
              <span style={{ background: '#DB2777' }}>RÇ</span>
              <span style={{ background: '#CA8A04' }}>RG</span>
            </div>
          </div>
        </header>
        <div className="content">
          <p className="lead">{page.desc}</p>
          <div className="placeholder">
            <div>
              <span style={{ display: 'inline-grid', placeItems: 'center', width: 52, height: 52, borderRadius: 16, background: 'var(--accent-soft)', color: 'var(--accent)' }}>
                <Icon icon={page.icon} size={26} />
              </span>
              <h3>Bu ekranın tasarımı sırada</h3>
              <p>Bu prototip sadece menüyü gösteriyor. Raydan bölüm seç, paneli raydaki düğmeyle ya da <kbd>[</kbd> tuşuyla kapat. Panel kapalıyken ray ikonuna tıklayınca sayfalar açılır listede görünür.</p>
            </div>
          </div>
        </div>
      </main>

      <button type="button" className="support"><Icon icon={I.HelpCircle} size={20} />Destek</button>

      {flySection && (
        <div ref={flyRef} className="fly" style={{ top: Math.max(12, fly.top), left: fly.left }} role="dialog" aria-label={flySection.label}>
          <div className="fly-title">{flySection.label}</div>
          <PageRows section={flySection} active={active} sub={sub} onPage={goPage} onSub={setSub} compact />
        </div>
      )}
      {tip && !fly && <div className="tip" style={{ top: tip.top, left: tip.left }} role="tooltip">{tip.label}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
