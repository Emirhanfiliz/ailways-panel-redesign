const LEGAL_DOCS = {"kvkk":{"href":"https://app.ailways.com/kvkk/aydinlatma-metni","blocks":[["p","Kişisel Verilerin İşlenmesi Aydınlatma Metni"],["p","Son güncelleme: 27 Şubat 2026"],["p","İşbu Aydınlatma Metni, 6698 sayılı Kişisel Verilerin Korunması Kanunu (\"KVKK\") m.10 ve Aydınlatma Yükümlülüğünün Yerine Getirilmesinde Uyulacak Usul ve Esaslar Hakkında Tebliğ kapsamında, veri sorumlusu sıfatıyla hazırlanmıştır."],["h2","1. Veri Sorumlusu"],["p","Unvan: Ailways"],["p","E-posta: info@ailways.com"],["h2","2. Kişisel Verilerin İşlenme Amacı"],["p","Ailways olarak aşağıda belirtilen kişisel verilerinizi, yine aşağıda belirtilen amaçlarla işlemekteyiz:"],["h3","a) Üyelik ve Hesap Yönetimi"],["li","Platformumuza kayıt işlemlerinin gerçekleştirilmesi"],["li","Kullanıcı kimliğinin doğrulanması ve oturum yönetimi"],["li","Hesap güvenliğinin sağlanması"],["li","Kullanıcı profil bilgilerinin güncellenmesi"],["h3","b) Hizmet Sunumu"],["li","Yapay zeka destekli sohbet asistanı hizmetinin sağlanması"],["li","Bilgi bankası ve ürün kataloğu yönetimi"],["li","Sipariş oluşturma ve takip süreçlerinin yürütülmesi"],["li","WhatsApp ve Instagram kanal entegrasyonlarının yönetimi"],["li","Kampanya ve promosyon süreçlerinin yürütülmesi"],["h3","c) Müşteri İlişkileri ve İletişim"],["li","Kullanıcı talep ve şikayetlerinin değerlendirilmesi"],["li","Hizmet kalitesinin artırılması"],["li","Platform içi bildirim ve iletişim"],["h3","d) Yasal Yükümlülükler"],["li","6698 sayılı KVKK ve ilgili mevzuattan doğan yükümlülüklerin yerine getirilmesi"],["li","Yetkili kamu kurum ve kuruluşlarına bilgi sunulması"],["li","Hukuki süreçlerin takibi"],["h3","e) Güvenlik ve Denetim"],["li","Bilgi güvenliği süreçlerinin yürütülmesi"],["li","Erişim loglarının tutulması ve denetim faaliyetleri"],["li","Sahteciliğin önlenmesi ve tespit edilmesi"],["li","Oran sınırlama (rate limiting) ile platformun kötüye kullanımının engellenmesi"],["h2","3. İşlenen Kişisel Veri Kategorileri"],["tr","Veri Kategorisi — İşlenen Veriler"],["tr","Kimlik Bilgileri — Ad, soyad"],["tr","İletişim Bilgileri — E-posta adresi, telefon numarası, açık adres"],["tr","Hesap Bilgileri — Kullanıcı kimliği, şifre (şifrelenmiş), şirket adı, web sitesi adresi"],["tr","Sohbet Verileri — Sohbet mesajları, sohbet oturumu bilgileri, gönderilen görseller, ziyaretçi kimliği"],["tr","Sipariş Bilgileri — Müşteri adı, müşteri telefonu, müşteri e-postası, teslimat adresi, sipariş detayları"],["tr","Kanal Verileri — WhatsApp telefon numarası, Instagram kullanıcı adı, Meta işletme hesabı bilgileri"],["tr","İşlem Güvenliği Verileri — IP adresi, tarayıcı bilgisi, erişim zaman damgası, oturum tokenleri"],["tr","Kullanım Verileri — Oturum sayısı, mesaj sayısı, kampanya sayısı, kullanım istatistikleri"],["h2","4. Kişisel Verilerin Toplanma Yöntemi ve Hukuki Sebebi"],["h3","Toplanma Yöntemi"],["li","Platform üzerindeki kayıt ve profil düzenleme formları aracılığıyla"],["li","Sohbet widget'ı üzerinden gerçekleştirilen mesajlaşmalar aracılığıyla"],["li","WhatsApp ve Instagram kanal entegrasyonları aracılığıyla"],["li","Sipariş oluşturma süreçleri aracılığıyla"],["li","Çerezler ve tarayıcı yerel depolama mekanizmaları aracılığıyla"],["li","Otomatik olarak toplanan erişim logları aracılığıyla"],["h3","Hukuki Sebepler"],["li","Sözleşmenin kurulması veya ifası (m.5/2-c): Platform hizmetlerinin sunulması, sipariş süreçlerinin yürütülmesi, hesap oluşturulması ve yönetimi."],["li","Hukuki yükümlülük (m.5/2-ç): Yasal düzenlemeler kapsamındaki yükümlülüklerin karşılanması, yetkili kurumlara bilgi sunulması."],["li","Meşru menfaat (m.5/2-f): Bilgi güvenliğinin sağlanması, sahteciliğin önlenmesi, hizmet kalitesinin artırılması, erişim loglarının tutulması."],["li","Açık rıza (m.5/1): Yukarıdaki hukuki sebeplerin kapsamı dışında kalan veri işleme faaliyetleri için açık rızanız talep edilmektedir."],["h2","5. Kişisel Verilerin Aktarılması"],["h3","a) Yurt İçi Aktarım"],["p","Kişisel verileriniz, yasal zorunluluk halinde yetkili kamu kurum ve kuruluşlarına; hukuki süreçlerin yürütülmesi amacıyla avukatlar ve hukuki danışmanlara aktarılabilmektedir."],["h3","b) Yurt Dışı Aktarım"],["p","Platformumuz, hizmet sunumu için aşağıdaki yurt dışı merkezli hizmet sağlayıcıları kullanmaktadır:"],["tr","Hizmet Sağlayıcı — Aktarılan Veri — Aktarım Amacı"],["tr","Supabase (ABD) — Hesap bilgileri, sohbet verileri, sipariş bilgileri, erişim logları — Veritabanı barındırma, kimlik doğrulama"],["tr","OpenAI (ABD) — Ürün açıklamaları, bilgi bankası içerikleri — Yapay zeka embeddings oluşturma"],["tr","Google / Gemini (ABD) — Sohbet mesajları, bilgi bankası içerikleri — Yapay zeka destekli yanıt üretimi"],["tr","n8n / RepoCloud (Yurt dışı) — Sohbet mesajları, sohbet geçmişi, ziyaretçi bilgileri — Sohbet motoru işleme"],["tr","Anthropic (ABD) — Sohbet mesajları, sohbet geçmişi, ziyaretçi bilgileri, sipariş ve iletişim bilgileri (sohbet motoru çalışma kayıtlarında yer aldığı ölçüde) — Yapay zeka destekli teknik destek ve hata ayıklama"],["tr","Meta Platforms (ABD) — WhatsApp/Instagram mesajları, kanal bilgileri — WhatsApp ve Instagram entegrasyonu"],["p","Yurt dışına veri aktarımı, KVKK m.9 kapsamında standart sözleşme veya açık rızanız doğrultusunda gerçekleştirilmektedir."],["h2","6. Kişisel Veri Sahibinin Hakları"],["p","KVKK m.11 uyarınca, kişisel veri sahibi olarak aşağıdaki haklara sahipsiniz:"],["li","Kişisel verilerinizin işlenip işlenmediğini öğrenme"],["li","Kişisel verileriniz işlenmişse buna ilişkin bilgi talep etme"],["li","Kişisel verilerinizin işlenme amacını ve bunların amacına uygun kullanılıp kullanılmadığını öğrenme"],["li","Yurt içinde veya yurt dışında kişisel verilerinizin aktarıldığı üçüncü kişileri bilme"],["li","Kişisel verilerinizin eksik veya yanlış işlenmiş olması halinde bunların düzeltilmesini isteme"],["li","KVKK m.7 çerçevesinde kişisel verilerinizin silinmesini veya yok edilmesini isteme"],["li","Düzeltme, silme ve yok etme işlemlerinin, kişisel verilerinizin aktarıldığı üçüncü kişilere bildirilmesini isteme"],["li","İşlenen verilerin münhasıran otomatik sistemler vasıtasıyla analiz edilmesi suretiyle aleyhinize bir sonucun ortaya çıkmasına itiraz etme"],["li","Kişisel verilerinizin kanuna aykırı olarak işlenmesi sebebiyle zarara uğramanız halinde zararın giderilmesini talep etme"],["p","Başvuru: Yukarıdaki haklarınızı kullanmak için info@ailways.com adresine e-posta gönderebilirsiniz. Başvurularınız en geç 30 gün içinde sonuçlandırılacaktır."],["h2","7. Kişisel Verilerin Saklama Süresi"],["tr","Veri Kategorisi — Saklama Süresi"],["tr","Hesap ve kimlik bilgileri — Üyelik süresince + yasal saklama süresi"],["tr","Sohbet verileri — Üyelik süresince + 1 yıl"],["tr","Sipariş bilgileri — İşlem tarihinden itibaren 10 yıl (TTK)"],["tr","Erişim ve güvenlik logları — 2 yıl"],["tr","Kullanım istatistikleri — Üyelik süresince"],["h2","8. Kişisel Verilerin Güvenliği"],["h3","Teknik Tedbirler"],["li","AES-256 şifreleme"],["li","Row Level Security (RLS)"],["li","SSL/TLS veri iletim şifrelemesi"],["li","API rate limiting"],["li","SSRF, XSS, SQL injection korumaları"],["li","CSP, HSTS güvenlik başlıkları"],["h3","İdari Tedbirler"],["li","Personel gizlilik taahhütnameleri"],["li","Kişisel veri işleme envanteri"],["li","Saklama ve İmha Politikası"],["li","Düzenli güvenlik denetimleri"],["h2","9. Yapay Zeka ve Otomatik Karar Alma"],["li","Sohbet mesajları, yapay zeka modeli tarafından işlenerek yanıt üretilmektedir."],["li","Yapay zeka eğitimi için kullanıcı verileri doğrudan kullanılmaz; yalnızca anonim veriler kullanılabilir."],["li","Yapay zeka modeline kişisel bilgiler (isim, telefon, adres) gönderilmemeye özen gösterilmektedir."],["li","Otomatik karar alma mekanizmalarına karşı KVKK m.11/1-g kapsamında itiraz hakkınız bulunmaktadır."],["h2","10. Hesap Silme ve Veri İmhası"],["p","Hesabınızı silmek istemeniz durumunda, platform üzerindeki Veri Silme sayfası aracılığıyla veya iletişim kanallarımız üzerinden talepte bulunabilirsiniz. Hesap silme işleminde aşağıdaki veriler kalıcı olarak silinir:"],["li","Hesap bilgileri (e-posta, ad soyad, şifre)"],["li","WhatsApp/Instagram bağlantı verileri ve şifreli erişim tokenları"],["li","Yapay zeka asistan ayarları ve bilgi bankası"],["li","Ürün verileri ve sohbet geçmişi"],["li","Kullanım logları"],["p","Not: Yasal saklama yükümlülüğü bulunan veriler, ilgili mevzuatın öngördüğü süre boyunca muhafaza edilmeye devam eder."],["p","Ailways — Kişisel Verilerin Korunması Hakkında Aydınlatma Metni Son Güncelleme: 11 Eylül 2026"]]},"privacy":{"href":"https://app.ailways.com/privacy","blocks":[["p","Son güncelleme: 18 Şubat 2026"],["h2","1. Veri Sorumlusu ve İletişim"],["p","İşbu Gizlilik Politikası ve Aydınlatma Metni, 6698 sayılı Kişisel Verilerin Korunması Kanunu (\"KVKK\"), Avrupa Birliği Genel Veri Koruma Tüzüğü (\"GDPR\") ve yürürlükteki sair mevzuat kapsamında veri sorumlusu sıfatıyla hareket eden Ailways (\"Platform\", \"biz\") tarafından hazırlanmıştır."],["p","İletişim: info@ailways.com"],["h2","2. Tanımlar ve Tarafların Konumu"],["p","Platform, işletmelere (\"Kullanıcı\" veya \"İşletme Kullanıcı\") yapay zekâ destekli iletişim yönetim hizmeti sunan bir yazılım aracısıdır. İşletme Kullanıcı, kendi müşterileri (\"Son Kullanıcı\") ile olan iletişiminde bağımsız veri sorumlusu sıfatını taşır. Platform, İşletme Kullanıcının talimatları doğrultusunda veri işleyen konumundadır."],["p","İşletme Kullanıcı, Son Kullanıcılarından gerekli açık rızaları almak, aydınlatma yükümlülüğünü yerine getirmek ve ilgili mevzuata uygun şekilde kişisel veri işlemek konusunda münhasıran sorumludur. Platform, İşletme Kullanıcının mevzuata aykırı veri işleme faaliyetlerinden dolayı hiçbir sorumluluk kabul etmez."],["h2","3. İşlenen Kişisel Veriler"],["p","Hizmetin sunulması amacıyla aşağıdaki kategorilerde kişisel veri işlenebilir:"],["li","Kimlik ve İletişim Verileri: Ad, soyad, e-posta adresi, telefon numarası"],["li","Hesap Verileri: Kullanıcı kimlik bilgileri, oturum verileri"],["li","Kanal Bağlantı Verileri: Üçüncü taraf mesajlaşma platformlarına ait hesap tanımlayıcıları ve erişim yetkilendirmeleri"],["li","İletişim İçerikleri: İşletme Kullanıcı tarafından Platform üzerinden yönetilen mesaj içerikleri"],["li","Teknik Veriler: IP adresi, tarayıcı bilgisi, erişim logları"],["li","Kullanım Verileri: Platform üzerindeki etkileşim ve kullanım istatistikleri"],["h2","4. Yapay Zekâ ile Otomatik Veri İşleme"],["p","Platform, İşletme Kullanıcının tercihine bağlı olarak yapay zekâ teknolojileri aracılığıyla otomatik yanıt üretme hizmeti sunmaktadır. Bu kapsamda:"],["li","İletişim içerikleri, yanıt üretimi amacıyla üçüncü taraf yapay zekâ altyapı sağlayıcılarına iletilebilir."],["li","Yapay zekâ tarafından üretilen yanıtlar tavsiye niteliğindedir; doğruluğu, eksiksizliği veya belirli bir amaca uygunluğu garanti edilmez."],["li","İşletme Kullanıcı, yapay zekâ ile üretilen yanıtları Son Kullanıcılarına iletmeden önce gerekli kontrolü sağlamakla yükümlüdür."],["li","Platform, yapay zekâ tarafından üretilen içeriklerin İşletme Kullanıcı tarafından kullanılmasından doğabilecek doğrudan veya dolaylı zararlardan sorumlu tutulamaz."],["h2","5. Verilerin İşlenme Amaçları ve Hukuki Dayanağı"],["p","Kişisel veriler, KVKK m.5/2 ve GDPR m.6 kapsamında aşağıdaki hukuki dayanaklarla işlenmektedir:"],["li","Sözleşmenin ifası: Hizmet sözleşmesinin kurulması ve yerine getirilmesi"],["li","Meşru menfaat: Platformun güvenliğinin sağlanması, dolandırıcılık önleme, hizmet kalitesinin iyileştirilmesi"],["li","Hukuki yükümlülük: Yasal düzenlemeler ve yetkili makam taleplerine uyum"],["li","Açık rıza: Yukarıdaki dayanakların kapsamı dışında kalan işleme faaliyetleri için"],["h2","6. Verilerin Aktarımı"],["p","Kişisel veriler, hizmetin sunulması amacıyla aşağıdaki alıcı gruplarına aktarılabilir:"],["li","Altyapı hizmet sağlayıcıları: Sunucu barındırma, veritabanı ve bulut hizmetleri sağlayıcıları"],["li","Üçüncü taraf platform operatörleri: İşletme Kullanıcının bağladığı mesajlaşma platformlarının işleticileri (bu platformların kendi gizlilik politikaları geçerlidir)"],["li","Yapay zekâ altyapı sağlayıcıları: Otomatik yanıt üretimi için kullanılan hizmet sağlayıcıları"],["li","Yetkili kamu kurum ve kuruluşları: Yasal zorunluluk hallerinde"],["p","Yurt Dışı Aktarım Bildirimi: Hizmetin sunulması kapsamında kişisel veriler, yeterli koruma bulunan veya KVKK m.9 ve GDPR m.46 kapsamında uygun güvencelerin sağlandığı yurt dışındaki sunuculara aktarılabilir. İşletme Kullanıcı, Platformu kullanmaya başlamakla bu aktarımı kabul etmiş sayılır."],["h2","7. Google Kullanıcı Verileri (Google Takvim Entegrasyonu)"],["p","İşletme Kullanıcı, randevu yönetimi için Google Takvim hesabını Platforma isteğe bağlı olarak bağlayabilir. Bu bölüm, Platformun Google kullanıcı verilerine nasıl eriştiğini, bu verileri nasıl kullandığını, nerede sakladığını ve kimlerle paylaştığını açıklar. Bağlantı kurulmadığı sürece Platform hiçbir Google verisine erişmez."],["h3","7.1. Talep Edilen İzinler ve Gerekçeleri"],["p","Platform, işlevi için gereken asgari izin kümesini talep eder:"],["li","E-posta adresi (openid, email): Hangi Google hesabının bağlandığının panelde gösterilmesi ve aynı hesabın birden çok kez bağlanmasının önlenmesi için kullanılır."],["li","Takvim listesi — salt okunur (calendar.calendarlist.readonly): İşletme Kullanıcının, randevuların hangi takvime yazılacağını seçebilmesi için yalnızca takvimlerin adları ve kimlikleri okunur; etkinlik içerikleri bu izinle okunmaz."],["li","Meşguliyet bilgisi (calendar.freebusy): Uygun randevu saatlerinin hesaplanması için yalnızca \"bu aralık dolu mu?\" bilgisi alınır. Bu izin, etkinliklerin başlığını, katılımcılarını veya içeriğini vermez."],["li","Etkinlikler (calendar.events): Alınan randevunun takvime yazılması, değişiklikte güncellenmesi, iptalde silinmesi ve müşterinin davetli olarak eklenmesi için kullanılır. Takvim ayarlarını değiştirmeyi veya takvim silmeyi kapsamaz."],["p","Takvim entegrasyonu kapsamında Platform, Google Drive, Gmail veya kişiler gibi başka hiçbir Google hizmetine erişim talep etmez (Google Analytics bağlantısı ayrıdır ve isteğe bağlıdır, bkz. Bölüm 7B); takvimin tam erişim ( calendar ) ve tüm etkinlik içeriğini okuma ( calendar.readonly ) izinleri bilinçli olarak istenmemektedir ."],["h3","7.2. Saklanan Veriler"],["li","Erişim ve yenileme jetonları: AES-256-GCM ile şifrelenerek saklanır; hiçbir kayıt ortamına (log) yazılmaz."],["li","Bağlanan Google hesabının e-posta adresi ve seçilen takvimin kimliği."],["li","Senkronizasyon jetonları: Yalnızca değişen kayıtların çekilebilmesi için tutulur."],["li","Takvimden içe alınan etkinlikler: İşletme Kullanıcının takviminde Platform dışında oluşturulmuş etkinlikler randevu takvimine yansıtılır. Bu kapsamda etkinliğin başlığı, başlangıç ve bitiş zamanı, varsa konum ve açıklama metni ile Platform üzerinden gönderilmiş davetlerin yanıt durumu (katıldı / reddetti / yanıtsız) saklanır. Amaç, dolu saatlerin müşteriye boş gösterilmesini ve çifte rezervasyonu önlemektir."],["h3","7.3. Kullanım Biçimi"],["p","Google verisi yalnızca İşletme Kullanıcının kendi randevu işleyişi için kullanılır: boş saatlerin hesaplanması, randevunun takvime yazılması ve müşteri yanıtının randevuya işlenmesi. Uygun saat hesabında yapay zekâ bileşenine yalnızca boş/dolu zaman aralıkları iletilir; takvim etkinliklerinin içeriği bu hesaba dâhil edilmez."],["h3","7.4. Paylaşım ve Sınırlı Kullanım Taahhüdü"],["p","Platformun Google API'lerinden aldığı bilgileri kullanması ve bu bilgileri başka bir tarafa aktarması, Google API Hizmetleri Kullanıcı Verileri Politikası 'na ve bu politikanın Sınırlı Kullanım (Limited Use) gerekliliklerine tabidir ve bunlara uygun şekilde gerçekleştirilir."],["li","Google kullanıcı verileri satılmaz."],["li","Reklam gösterimi veya hedefleme amacıyla kullanılmaz."],["li","Yapay zekâ modellerinin eğitiminde kullanılmaz."],["li","Kullanıcıya görünür işlevin sunulması dışında üçüncü taraflara aktarılmaz; aktarım yalnızca yasal zorunluluk hâlinde veya İşletme Kullanıcının açık talimatıyla yapılır."],["li","Verilere insan eliyle erişilmez; erişim yalnızca kullanıcının açık izniyle, güvenlik soruşturması veya hukuki yükümlülük gibi istisnai hâllerde söz konusu olabilir."],["h3","7.5. Saklama, İzin İptali ve Silme"],["p","İşletme Kullanıcı, bağlantıyı panelden dilediği an koparabilir. Bağlantı koparıldığında Platform jetonu Google nezdinde iptal eder (revoke) ve saklanan erişim/yenileme jetonlarını siler. Ayrıca izinler myaccount.google.com/permissions adresinden doğrudan Google üzerinden de geri alınabilir. Hesabın silinmesi hâlinde bağlantı kaydı ve ona bağlı veriler silinir; ayrıntı için Veri Silme Talebi sayfasına bakınız."],["h3","7.6. Yapay Zekâ Modelleri ve Model Eğitimi"],["p","Platform, randevu sohbetini yürütmek için üçüncü taraf büyük dil modeli (LLM) servislerinden yararlanır. Google kullanıcı verilerinin bu servislerle ilişkisi aşağıdaki gibidir:"],["li","Etkinlik içeriği yapay zekâya iletilmez. Google Takvim'den okunan etkinliklerin başlığı, açıklaması, konumu ve katılımcı bilgisi hiçbir yapay zekâ modeline gönderilmez."],["li","İletilen tek takvim türevi bilgi meşguliyettir. Uygun randevu saatlerinin hesaplanması sonucunda ortaya çıkan boş/dolu zaman aralıkları yapay zekâ bileşenine iletilir. Bu bilgi, hangi etkinliğin o aralığı doldurduğunu içermez."],["li","Model eğitimi yapılmaz. Google kullanıcı verileri — ham, toplulaştırılmış, anonimleştirilmiş veya türetilmiş biçimde — temel (foundational) ya da genelleştirilmiş yapay zekâ/makine öğrenmesi modellerinin geliştirilmesinde, eğitilmesinde veya iyileştirilmesinde kullanılmaz. Platform kendi modelini eğitmez."],["li","Sağlayıcı katmanı. Platform, model sağlayıcılarının yalnızca ücretli (paid tier) hizmet katmanlarını kullanır; bu katmanlarda sağlayıcı, API üzerinden gönderilen veriyi kendi modellerinin eğitiminde kullanmamayı sözleşmeyle taahhüt eder."],["p","Limited Use Compliance Statement: Ailways' use of information received from Google Workspace APIs will adhere to the Google Workspace API User Data and Developer Policy , including the Limited Use requirements. Google Workspace user data — whether raw, aggregated, anonymized, or derived — is never used, transferred, or sold to develop, improve, or train generalized or foundational artificial intelligence or machine learning models, either by Ailways or by any third-party service Ailways integrates with."],["h2","7A. eBay Satıcı Hesabı Verileri (eBay Entegrasyonu)"],["p","İşletme Kullanıcı, eBay satıcı hesabını eBay'in OAuth yetkilendirme ekranı üzerinden kendi onayıyla bağlar. Platform eBay şifresini hiçbir zaman görmez; yalnızca eBay'in verdiği erişim ve yenileme jetonlarını şifreli (AES-256-GCM) olarak saklar. İstenen izinler: hesap kimliğini doğrulama (salt okuma), ilan/envanter bilgisini okuma (salt okuma) ve alıcı mesajlarını okuyup cevaplama."],["li","Saklanan veriler: eBay kullanıcı kimliği ve adı, marketplace; eBay'den çekilen ürün bilgileri (ad, açıklama, fiyat, stok, görsel, ilan bağlantısı); alıcıların satıcıya gönderdiği mesajlar, alıcının eBay kullanıcı adı ve bu mesajlara verilen cevaplar."],["li","Kullanım: Alıcı mesajları, İşletme Kullanıcının seçtiği asistanın cevap taslağı üretmesi için Bölüm 4'te belirtilen yapay zekâ altyapısına iletilir. Cevaplar, İşletme Kullanıcının ayarına göre otomatik olarak ya da onayıyla yalnızca ilgili eBay konuşmasına gönderilir. Veriler başka bir amaçla kullanılmaz ve model eğitiminde kullanılmaz."],["li","Bağlantıyı kaldırma: Panelden bağlantı kaldırıldığında saklanan jetonlar derhâl silinir ve yeni mesaj çekilmez; eBay'deki ilanlar ve mesajlar etkilenmez. Uygulama izni ayrıca eBay hesap ayarlarından da geri alınabilir."],["li","eBay hesabının kapatılması: eBay, bir hesabın kapatıldığını bildirdiğinde o satıcı hesabına ait eBay bağlantısı ve jetonları silinir; alıcı hesabı kapatıldıysa saklanan eBay kullanıcı adı anonimleştirilir."],["li","Hesabın silinmesi hâlinde eBay bağlantısı ve ilgili kayıtlar da silinir; ayrıntı için Veri Silme Talebi sayfasına bakınız."],["h2","7B. Google Analytics Verileri (Kampanya İstatistikleri)"],["p","İşletme Kullanıcı, Ailways bağlantılarıyla mağazasına gelen ziyaretlerin istatistiklerini görmek için Google Analytics 4 hesabını Platforma isteğe bağlı olarak bağlayabilir. Bağlantı kurulmadığı sürece Platform hiçbir Google Analytics verisine erişmez."],["li","İstenen izin: Google Analytics verilerini görüntüleme, salt okunur ( analytics.readonly ). Bu izin, İşletme Kullanıcının erişebildiği GA4 mülklerinin listelenmesi ve seçilen mülkte yalnızca utm_source=ailways parametresiyle gelen oturumlara ait raporların (oturum, kullanıcı, satış, ciro, giriş sayfası, cihaz, konum gibi toplu istatistikler) okunması için kullanılır. Platform Analytics verisini değiştirmez, silmez ve Analytics ayarlarına erişmez; bu nedenle yazma izni istenmez."],["li","Saklanan veriler: Şifreli (AES-256-GCM) erişim ve yenileme jetonları, bağlanan hesabın e-posta adresi ve seçilen mülkün kimliği. Rapor sonuçları yalnızca performans için kısa süreli (en fazla 10 dakika) önbellekte tutulur, kalıcı olarak saklanmaz."],["li","Kullanım ve paylaşım: Veriler yalnızca İşletme Kullanıcının kendisine panelde gösterilir. 7.4'teki Sınırlı Kullanım taahhütleri bu bölüm için de geçerlidir: satılmaz, reklamda kullanılmaz, yapay zekâ modellerinin eğitiminde kullanılmaz, üçüncü taraflara aktarılmaz."],["li","İptal ve silme: Bağlantı panelden kaldırıldığında jeton Google nezdinde iptal edilir ve saklanan jetonlar silinir. İzin, myaccount.google.com/permissions adresinden de geri alınabilir."],["h2","8. Veri Güvenliği"],["p","Platform, kişisel verilerin korunması için teknik ve idari tedbirler uygulamaktadır. Ancak internet üzerinden gerçekleştirilen hiçbir veri iletiminin veya elektronik depolama yönteminin %100 güvenli olduğu garanti edilemez. Platform, makul güvenlik standartlarını uygulamakla birlikte, kendi kontrolü dışındaki güvenlik ihlallerinden sorumlu tutulamaz."],["li","Endüstri standardı şifreleme protokolleri"],["li","Güvenli veri iletim kanalları (TLS/SSL)"],["li","Erişim kontrolü ve yetkilendirme mekanizmaları"],["li","Düzenli güvenlik değerlendirmeleri"],["h2","9. Veri Saklama Süresi"],["p","Kişisel veriler, işlenme amaçlarının gerektirdiği süre boyunca ve her halükârda yasal saklama yükümlülüklerinin öngördüğü asgari süreler boyunca saklanır. Saklama süresinin sona ermesinin ardından kişisel veriler silinir, yok edilir veya anonim hâle getirilir. İşletme Kullanıcı, hesabını sildiğinde ilgili veriler makul süre içinde sistemden kaldırılır; ancak yasal saklama yükümlülükleri ve yedekleme döngüleri kapsamında belirli veriler mevzuatın öngördüğü süre boyunca muhafaza edilebilir."],["h2","10. İşletme Kullanıcının Yükümlülükleri"],["p","İşletme Kullanıcı, Platformu kullanırken aşağıdaki yükümlülükleri kabul ve taahhüt eder:"],["li","Son Kullanıcılardan mesaj göndermek için gerekli açık rızayı (opt-in) almak"],["li","Son Kullanıcılara yeterli aydınlatma yapmak ve veri işleme hakkında bilgilendirmek"],["li","Abonelikten çıkma (opt-out) taleplerini derhal işleme almak"],["li","İlgili mesajlaşma platformlarının kullanım koşullarına ve ticaret politikalarına uymak"],["li","Platformu spam, toplu istenmeyen mesaj veya mevzuata aykırı amaçlarla kullanmamak"],["li","İşlediği kişisel verilerin doğruluğunu ve güncelliğini sağlamak"],["li","Yasaklı içerik (kumar, yasa dışı ürün/hizmet tanıtımı vb.) göndermemek"],["p","İşletme Kullanıcının bu yükümlülüklerini ihlal etmesi nedeniyle Platform'un veya üçüncü tarafların uğrayacağı her türlü zarar, münhasıran İşletme Kullanıcıya aittir. Platform, bu ihlaller nedeniyle maruz kalacağı her türlü zarar, ceza, idari para cezası ve masrafı İşletme Kullanıcıya rücu etme hakkını saklı tutar."],["h2","11. Sorumluluk Sınırlandırması"],["p","Platform, aşağıdaki hususlarda sorumluluk kabul etmez:"],["li","İşletme Kullanıcının mevzuata aykırı veri işleme faaliyetleri"],["li","Üçüncü taraf platform operatörlerinin politika değişiklikleri, hesap kısıtlamaları veya hizmet kesintileri"],["li","Yapay zekâ tarafından üretilen yanıtların içeriği, doğruluğu veya uygunluğu"],["li","İşletme Kullanıcının Son Kullanıcılarla olan ilişkisinden doğan uyuşmazlıklar"],["li","Mücbir sebep halleri (doğal afet, siber saldırı, altyapı sağlayıcı kesintileri, yasal düzenleme değişiklikleri vb.)"],["li","İşletme Kullanıcının hesap bilgilerinin yetkisiz kişilerce kullanılması"],["p","Platformun herhangi bir nedenle sorumlu tutulması halinde, toplam sorumluluk tutarı her halükârda İşletme Kullanıcının zararın gerçekleştiği tarihten önceki son 3 (üç) aylık dönemde Platform'a ödediği toplam hizmet bedeli ile sınırlıdır."],["h2","12. KVKK Kapsamındaki Haklar"],["p","KVKK m.11 uyarınca, İşletme Kullanıcı aşağıdaki haklara sahiptir:"],["li","Kişisel verilerinin işlenip işlenmediğini öğrenme"],["li","Kişisel verileri işlenmişse buna ilişkin bilgi talep etme"],["li","Kişisel verilerin işlenme amacını ve bunların amacına uygun kullanılıp kullanılmadığını öğrenme"],["li","Yurt içinde veya yurt dışında kişisel verilerin aktarıldığı üçüncü kişileri bilme"],["li","Kişisel verilerin eksik veya yanlış işlenmiş olması hâlinde bunların düzeltilmesini isteme"],["li","KVKK m.7 çerçevesinde kişisel verilerin silinmesini veya yok edilmesini isteme"],["li","Düzeltme ve silme işlemlerinin, verilerin aktarıldığı üçüncü kişilere bildirilmesini isteme"],["li","İşlenen verilerin münhasıran otomatik sistemler vasıtasıyla analiz edilmesi suretiyle aleyhe bir sonucun ortaya çıkmasına itiraz etme"],["li","Kişisel verilerin kanuna aykırı olarak işlenmesi sebebiyle zarara uğranması hâlinde zararın giderilmesini talep etme"],["p","Başvurular, info@ailways.com adresine yazılı olarak veya Kişisel Verileri Koruma Kurumu tarafından belirlenen diğer yöntemlerle yapılabilir. Başvurular en geç 30 (otuz) gün içinde sonuçlandırılır."],["h2","13. GDPR Kapsamındaki Haklar"],["p","Avrupa Ekonomik Alanı'nda ikamet eden kullanıcılar, GDPR kapsamında ek olarak aşağıdaki haklara sahiptir:"],["li","Veri taşınabilirliği hakkı (GDPR m.20)"],["li","İşlemenin kısıtlanmasını talep etme hakkı (GDPR m.18)"],["li","Meşru menfaate dayalı işlemeye itiraz hakkı (GDPR m.21)"],["li","Yetkili veri koruma otoritesine şikâyette bulunma hakkı"],["h2","14. Çerezler"],["p","Platform, oturum yönetimi ve hizmetin işlevselliği için zorunlu çerezler kullanmaktadır. Analitik ve tercih çerezleri, kullanıcının onayına bağlı olarak kullanılabilir. Çerez tercihlerinizi tarayıcı ayarlarınızdan yönetebilirsiniz; ancak zorunlu çerezlerin devre dışı bırakılması hizmetin işlevselliğini olumsuz etkileyebilir."],["h2","15. Uygulanacak Hukuk ve Uyuşmazlık Çözümü"],["p","İşbu Gizlilik Politikası, Türkiye Cumhuriyeti hukukuna tâbidir. İşbu Politika'dan doğan veya işbu Politika ile bağlantılı her türlü uyuşmazlığın çözümünde İstanbul Mahkemeleri ve İcra Daireleri münhasıran yetkilidir."],["h2","16. Değişiklikler"],["p","Platform, işbu Gizlilik Politikası'nı önceden bildirimde bulunmaksızın güncelleme hakkını saklı tutar. Güncellemeler, Platform üzerinde yayımlandığı tarihte yürürlüğe girer. İşletme Kullanıcının güncelleme sonrasında Platformu kullanmaya devam etmesi, güncellenmiş politikayı kabul ettiği anlamına gelir."],["h2","17. İletişim"],["p","Gizlilik ve kişisel veri koruma ile ilgili tüm soru, talep ve başvurularınız için:"],["p","E-posta: info@ailways.com"],["p","Konu: \"KVKK Başvurusu\" veya \"Gizlilik Talebi\" ibaresi ile"]]},"cookies":{"href":"https://app.ailways.com/kvkk/cerez-politikasi","blocks":[["p","Çerez ve tarayıcı depolama kullanımı hakkında bilgilendirme"],["p","Son güncelleme: 27 Şubat 2026"],["p","İşbu Çerez Politikası, Ailways tarafından işletilen platformda kullanılan çerezler ve benzeri teknolojiler hakkında sizi bilgilendirmek amacıyla 6698 sayılı Kişisel Verilerin Korunması Kanunu (\"KVKK\") ve ilgili mevzuat kapsamında hazırlanmıştır."],["h2","1. Çerez Nedir?"],["p","Çerez (cookie), web sitelerinin tarayıcınıza gönderdiği ve cihazınızda depolanan küçük metin dosyalarıdır. Çerezler, web sitesinin sizi tanımasını, tercihlerinizi hatırlamasını ve size daha iyi bir deneyim sunmasını sağlar. Benzer şekilde localStorage ve sessionStorage gibi tarayıcı depolama mekanizmaları da benzer amaçlarla kullanılmaktadır."],["h2","2. Çerez Türleri"],["h3","Zorunlu Çerezler"],["p","Platformun düzgün çalışması için gereklidir ve devre dışı bırakılamaz. Oturum yönetimi ve güvenlik gibi temel işlevleri yerine getirir."],["h3","İşlevsel Çerezler"],["p","Platformdaki tercihlerinizi (dil, tema vb.) hatırlamak için kullanılır. Bu çerezler olmadan bazı özellikler düzgün çalışmayabilir."],["h3","Analitik Çerezler"],["p","Platformun nasıl kullanıldığını anlamamıza yardımcı olur. Toplanan veriler anonimleştirilmiştir."],["h2","3. Kullanılan Çerezler ve Depolama"],["h3","Zorunlu Çerezler"],["tr","Çerez Adı — Sağlayıcı — Amacı — Süre"],["tr","sb-*-auth-token — Supabase — Kimlik doğrulama ve oturum yönetimi — Oturum süresince"],["h3","Tarayıcı Yerel Depolama (localStorage)"],["tr","Anahtar — Amacı — Süre"],["tr","ailways_vid — Sohbet widget ziyaretçi kimliği — Kalıcı"],["tr","ailways_sid_* — Sohbet oturum kimliği — Kalıcı"],["tr","ailways_auth_blocked_until — Güvenlik amaçlı oran sınırlama — 2 dakika"],["h2","4. Çerez Tercihlerinizin Yönetimi"],["h3","Tarayıcı Ayarları Üzerinden"],["li","Chrome: Ayarlar → Gizlilik ve Güvenlik → Çerezler"],["li","Firefox: Ayarlar → Gizlilik ve Güvenlik → Çerezler ve Site Verileri"],["li","Safari: Tercihler → Gizlilik → Çerezler"],["li","Edge: Ayarlar → Çerezler ve Site İzinleri"],["h3","localStorage Verilerini Silme"],["p","Tarayıcınızın geliştirici araçlarından (F12) → Application → Local Storage bölümünden ailways ile başlayan kayıtları silebilirsiniz."],["p","Not: Zorunlu çerezleri devre dışı bırakmanız halinde platformun bazı temel işlevleri çalışmayabilir."],["h2","5. Üçüncü Taraf Çerezleri"],["p","Platformumuz, hizmet sunumu kapsamında aşağıdaki üçüncü taraf hizmet sağlayıcılarının çerezlerini kullanabilmektedir:"],["tr","Hizmet Sağlayıcı — Amacı"],["tr","Supabase — Kimlik doğrulama ve oturum yönetimi"],["h2","6. Kişisel Verilerin İşlenmesi"],["p","Çerezler aracılığıyla toplanan kişisel veriler, KVKK kapsamında işlenmektedir. Detaylı bilgi için Kişisel Verilerin İşlenmesi Aydınlatma Metni 'ni inceleyebilirsiniz."],["p","Ailways — Çerez (Cookie) Politikası Son Güncelleme: 27 Şubat 2026"]]},"transfer":{"href":"https://app.ailways.com/kvkk/yurt-disi-veri-aktarimi","blocks":[["p","Kişisel verilerin yurt dışına aktarılmasına ilişkin bilgilendirme"],["p","Son güncelleme: 27 Şubat 2026"],["p","6698 sayılı Kişisel Verilerin Korunması Kanunu (\"KVKK\") m.9 uyarınca, kişisel verilerinizin yurt dışına aktarılabilmesi için aşağıdaki bilgilendirmenin yapılması ve açık rızanızın alınması gerekmektedir."],["h2","1. Yurt Dışına Aktarılacak Kişisel Veriler"],["p","Ailways platformunun hizmet sunumu kapsamında, aşağıda belirtilen kişisel verileriniz yurt dışında bulunan sunuculara ve hizmet sağlayıcılara aktarılmaktadır:"],["tr","Veri Kategorisi — Aktarılan Veriler"],["tr","Kimlik ve İletişim — Ad, soyad, e-posta adresi, telefon numarası"],["tr","Hesap Bilgileri — Kullanıcı kimliği (UUID), şirket adı, web sitesi"],["tr","Sohbet Verileri — Sohbet mesajları, sohbet geçmişi, ziyaretçi bilgileri, görseller"],["tr","Sipariş Bilgileri — Müşteri adı, telefonu, teslimat adresi, sipariş detayları"],["tr","Kanal Verileri — WhatsApp telefon numarası, Instagram kullanıcı adı"],["tr","Güvenlik Verileri — IP adresi, erişim logları, oturum bilgileri"],["tr","Ürün ve İçerik — Ürün açıklamaları, bilgi bankası içerikleri"],["h2","2. Yurt Dışı Hizmet Sağlayıcılar"],["tr","Hizmet Sağlayıcı — Ülke — Aktarım Amacı"],["tr","Supabase Inc. — ABD — Veritabanı barındırma, kimlik doğrulama, dosya depolama"],["tr","OpenAI Inc. — ABD — Yapay zeka vektör temsilleri (embeddings) oluşturma"],["tr","Google LLC (Gemini) — ABD — Yapay zeka destekli yanıt üretimi (Gemini API)"],["tr","n8n / RepoCloud — Yurt dışı — Yapay zeka destekli sohbet motorunun çalıştırılması"],["tr","Anthropic PBC — ABD — Yapay zeka destekli teknik destek ve hata ayıklama (sohbet motoru çalışma kayıtlarının incelenmesi)"],["tr","Meta Platforms Inc. — ABD — WhatsApp ve Instagram kanal entegrasyonu"],["h2","3. Aktarım Nedeni"],["p","Ailways, bulut tabanlı (cloud-based) bir SaaS platformudur. Platformun temel işlevlerini yerine getirebilmesi için yukarıda belirtilen hizmet sağlayıcıların altyapısından yararlanılmaktadır. Bu hizmet sağlayıcıların sunucuları yurt dışında konumlandığından, platformun kullanılması sırasında kişisel verileriniz yurt dışına aktarılmaktadır."],["h2","4. Alınan Güvenlik Tedbirleri"],["p","Tüm veri aktarımları SSL/TLS şifrelemesi ile korunmaktadır"],["p","Hassas veriler AES-256 algoritması ile şifrelenerek saklanmaktadır"],["p","Hizmet sağlayıcılarla veri güvenliğine ilişkin sözleşmeler yapılmaktadır"],["p","Erişim yetkilendirmeleri ve loglama ile güvenlik denetlenmektedir"],["h2","5. Muhtemel Riskler"],["p","KVKK m.9 uyarınca, yurt dışına veri aktarımına ilişkin muhtemel riskleri bilginize sunarız:"],["li","Aktarılan veriler, yurt dışındaki hizmet sağlayıcının tabi olduğu yerel mevzuata göre korunacaktır. Türkiye ile söz konusu ülkeler arasında veri koruma düzeyi farklılık gösterebilir."],["li","Hizmet sağlayıcının bulunduğu ülkenin yetkili makamları, kendi mevzuatları çerçevesinde verilere erişim talep edebilir."],["li","Ailways, bu riskleri en aza indirmek için teknik ve hukuki tedbirleri almaktadır; ancak yurt dışı mevzuat farklılıklarından kaynaklanan riskler tamamen ortadan kaldırılamayabilir."],["h2","6. Önemli Bilgilendirme"],["li","Açık rızanız tamamen isteğe bağlıdır . Ancak, platformun bulut tabanlı yapısı gereği, yurt dışı veri aktarımına rıza verilmemesi halinde platformun hizmet sunması teknik olarak mümkün olmayacaktır."],["li","Verdiğiniz açık rızayı dilediğiniz zaman geri alabilirsiniz. Rızanızın geri alınması halinde hesabınız kapatılacak ve verileriniz imha edilecektir."],["li","Rızanızın geri alınması, geri alma tarihine kadar yapılan veri aktarımlarının hukuka uygunluğunu ortadan kaldırmaz."],["p","Ailways — Yurt Dışına Kişisel Veri Aktarımına İlişkin Bilgilendirme Son Güncelleme: 11 Eylül 2026"]]}};
const pageFromHash = () => (location.hash.startsWith('#register') ? 'register' : location.hash.startsWith('#reset') ? 'reset' : 'login');
function Preview() {
  const [page, setPage] = useState(pageFromHash);
  const [st, setSt] = useState('normal');
  useEffect(() => {
    const on = () => setPage(pageFromHash());
    window.addEventListener('hashchange', on);
    return () => window.removeEventListener('hashchange', on);
  }, []);
  const go = p => { location.hash = p; setSt('normal'); };
  // Yalnızca önizleme: #register-doc adresi açılışta ilk belge penceresini açar
  useEffect(() => {
    if (location.hash === '#reset-sent') setSt('sent');
    if (location.hash === '#register-otp') setTimeout(() => document.querySelector('.alw-box-btn:not(.is-icon)')?.click(), 300);
    if (location.hash === '#register-doc') setTimeout(() => document.querySelector('.alw-doclink')?.click(), 300);
  }, []);
  const common = { logo: LOGO, channels: CHANNELS, loading: st === 'loading', onSubmit: () => setSt('loading') };
  return (
    <>
      {page === 'login'
        ? <LoginPage {...common} registerHref="#register" forgotHref="#reset" error={st === 'error' ? 'E-posta ya da şifre hatalı. Tekrar dene.' : ''} />
        : page === 'register'
        ? <RegisterPage {...common} loginHref="#login" legalDocs={LEGAL_DOCS} error={st === 'error' ? 'Bu e-posta adresiyle zaten bir hesap var.' : ''} />
        : <ResetPasswordPage {...common} loginHref="#login" onSubmit={() => setSt('sent')} sent={st === 'sent'} error={st === 'error' ? 'Bu e-posta adresiyle kayıtlı bir hesap bulunamadı.' : ''} />}
      <div className="pv-bar">
        <div className="pv-states" role="group" aria-label="Sayfa">
          {[['login', 'Giriş'], ['register', 'Kayıt'], ['reset', 'Şifre sıfırla']].map(([k, l]) => (
            <button key={k} type="button" aria-pressed={page === k} onClick={() => go(k)}>{l}</button>
          ))}
        </div>
        <div className="pv-states" role="group" aria-label="Form durumu">
          {[['normal', 'Normal'], ['error', 'Hata'], ['loading', 'Yükleniyor'], ...(page === 'reset' ? [['sent', 'Gönderildi']] : [])].map(([k, l]) => (
            <button key={k} type="button" aria-pressed={st === k} onClick={() => setSt(k)}>{l}</button>
          ))}
        </div>
      </div>
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Preview />);
</script>
