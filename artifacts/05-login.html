<title>Ailways Giriş</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&family=Outfit:wght@300&display=swap&subset=latin-ext" rel="stylesheet">
<style>
body { margin: 0; background: #fff; }
/* Ailways · Giriş ve kayıt sayfaları. Token'lar panel prototipiyle aynı; hepsi .alw-login altında. */
.alw-login {
  --alw-bg: #FFFFFF;
  --alw-fg: #0F1F2C;
  --alw-muted: #4F6170;
  --alw-faint: #8A9AA8;
  --alw-line: #E3E9EE;
  --alw-soft: #F5F8FA;
  --alw-accent: #0A87C5;
  --alw-accent-2: #119DDA;
  --alw-accent-soft: #E8F5FC;
  --alw-navy: #0B2B40;
  --alw-navy-hover: #133A55;
  --alw-crit: #C8372F;
  --alw-crit-soft: #FCE8E6;
  --alw-font: "IBM Plex Sans", ui-sans-serif, system-ui, "Segoe UI", sans-serif;
  --alw-font-head: "Manrope", "IBM Plex Sans", system-ui, sans-serif;

  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  display: grid;
  grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
  background: var(--alw-bg);
  color: var(--alw-fg);
  font-family: var(--alw-font);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.alw-login *, .alw-login *::before, .alw-login *::after { box-sizing: border-box; }
.alw-login :focus-visible { outline: 2px solid var(--alw-accent); outline-offset: 2px; }
.alw-sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

/* ---------- Sağ: form (kartsız, beyaz zemin, arkada kayan ışık) ---------- */
.alw-login-form-side {
  position: relative; isolation: isolate;
  display: grid; grid-template-rows: minmax(0, 1fr) auto; justify-items: center;
  padding: 24px 56px 20px; min-width: 0; min-height: 0; overflow-y: auto;
}
/* İki yumuşak ışık alanın içinde arka plan olarak kayar; kenardan taşmaz, kaydırma çubuğu çıkarmaz */
.alw-login-form-side::before, .alw-login-form-side::after {
  content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none; background-repeat: no-repeat;
}
.alw-login-form-side::before {
  background-image: radial-gradient(circle, rgba(17, 157, 218, .16) 0%, rgba(17, 157, 218, .06) 40%, rgba(17, 157, 218, 0) 68%);
  background-size: 600px 600px; background-position: 115% -25%;
  animation: alw-drift-a 16s ease-in-out infinite alternate;
}
.alw-login-form-side::after {
  background-image: radial-gradient(circle, rgba(92, 196, 238, .13) 0%, rgba(92, 196, 238, .04) 45%, rgba(92, 196, 238, 0) 70%);
  background-size: 520px 520px; background-position: -20% 120%;
  animation: alw-drift-b 19s ease-in-out infinite alternate;
}
@keyframes alw-drift-a { to { background-position: 70% 25%; } }
@keyframes alw-drift-b { to { background-position: 35% 75%; } }

.alw-form-wrap { align-self: center; width: 100%; max-width: 420px; margin: 16px 0; }

/* Sayfa başlığı yerine büyük logo + Ailways */
/* Logo yazısı: logodaki ince geometrik yazı tipi (Outfit 300); form alanlarının ortasına hizalı */
.alw-brand { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 0; font-family: "Outfit", "Century Gothic", var(--alw-font-head); font-weight: 300; font-size: 52px; line-height: 1; letter-spacing: 0; color: var(--alw-fg); }
.alw-brand img { width: 58px; height: 58px; border-radius: 15px; display: block; }

.alw-alert { margin: 24px 0 0; padding: 11px 14px; border-radius: 10px; background: var(--alw-crit-soft); color: #9E2A23; font-size: 14px; }

.alw-form { margin-top: 36px; display: flex; flex-direction: column; gap: 14px; }

/* Form alanı: simge + içeride küçük etiket + değer; sağda isteğe bağlı düğme */
.alw-box {
  display: flex; align-items: center; height: 60px; border: 1px solid var(--alw-line); border-radius: 14px; background: #fff;
  transition: border-color .15s, box-shadow .15s;
}
.alw-box:hover { border-color: #C6D5E0; }
.alw-box:focus-within { border-color: var(--alw-accent-2); box-shadow: 0 0 0 4px rgba(17, 157, 218, .12); }
.alw-box.is-invalid { border-color: var(--alw-crit); }
.alw-box.is-invalid:focus-within { box-shadow: 0 0 0 4px rgba(200, 55, 47, .1); }
.alw-box-icon { flex: none; margin-left: 16px; color: var(--alw-faint); transition: color .15s; }
.alw-box:focus-within .alw-box-icon { color: var(--alw-accent); }
.alw-box-main { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 3px; padding: 0 14px 0 12px; height: 100%; cursor: text; }
.alw-box-main label { font-size: 12px; font-weight: 600; line-height: 1; color: var(--alw-muted); cursor: text; }
.alw-box:focus-within .alw-box-main label { color: var(--alw-accent); }
.alw-box-main input { width: 100%; border: 0; padding: 0; margin: 0; background: none; outline: none; font: inherit; font-size: 16px; line-height: 1.3; color: var(--alw-fg); }
.alw-box-main input::placeholder { color: var(--alw-faint); }
.alw-login .alw-box-main input:focus-visible { outline: none; }
.alw-box-btn {
  flex: none; height: 40px; margin-right: 8px; padding: 0 12px; border: 0; border-radius: 10px; background: var(--alw-accent-soft);
  color: var(--alw-accent); font: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: background .15s, color .15s;
}
.alw-box-btn:hover { background: #D6EEFA; }
.alw-box-btn.is-icon { width: 40px; padding: 0; display: grid; place-items: center; background: none; color: var(--alw-muted); }
.alw-box-btn.is-icon:hover { background: var(--alw-soft); color: var(--alw-fg); }

.alw-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 2px; }

.alw-link { color: var(--alw-accent); font-size: 13.5px; font-weight: 500; text-decoration: none; }
.alw-link:hover { text-decoration: underline; text-underline-offset: 3px; }

.alw-check { display: inline-flex; align-items: center; gap: 9px; font-size: 14px; color: var(--alw-fg); cursor: pointer; align-self: flex-start; min-height: 24px; }
.alw-check input { width: 17px; height: 17px; margin: 0; accent-color: var(--alw-navy); cursor: pointer; }

.alw-btn {
  position: relative; overflow: hidden;
  margin-top: 6px; height: 50px; border: 0; border-radius: 12px; background: var(--alw-navy); color: #fff;
  font: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 10px; transition: background .15s;
}
.alw-btn:hover { background: var(--alw-navy-hover); }
.alw-btn:disabled { cursor: progress; opacity: .85; }
/* Butonun üzerinden ara ara geçen parıltı */
.alw-btn::after {
  content: ""; position: absolute; top: 0; bottom: 0; left: -60%; width: 45%; pointer-events: none;
  background: linear-gradient(100deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, .22), rgba(255, 255, 255, 0));
  animation: alw-shine 5s ease-in-out infinite;
}
@keyframes alw-shine { 0%, 62% { left: -60%; } 100% { left: 130%; } }
.alw-spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .35); border-top-color: #fff; animation: alw-spin .7s linear infinite; }
@keyframes alw-spin { to { transform: rotate(360deg); } }

/* ---------- Kayıt formu ---------- */
.alw-form.is-register { margin-top: 28px; gap: 10px; }
.alw-form.is-register .alw-box { height: 56px; }
.alw-reveal { animation: alw-reveal .35s cubic-bezier(.2, .9, .3, 1.1) both; }
@keyframes alw-reveal { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
.alw-consents { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }
.alw-consent { display: flex; align-items: flex-start; gap: 10px; font-size: 13px; line-height: 1.5; color: var(--alw-muted); cursor: pointer; }
.alw-consent input { flex: none; width: 17px; height: 17px; margin: 1px 0 0; accent-color: var(--alw-navy); cursor: pointer; }
/* Onay metnindeki belge adları: bağlantı gibi görünür, pencere açar */
.alw-doclink { display: inline; padding: 0; border: 0; background: none; font: inherit; color: var(--alw-accent); font-weight: 600; cursor: pointer; text-align: left; }
.alw-doclink:hover { text-decoration: underline; text-underline-offset: 3px; }

/* ---------- Belge penceresi ---------- */
.alw-modal-backdrop {
  position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px;
  background: rgba(11, 31, 44, .42); backdrop-filter: blur(3px); animation: alw-fade .2s ease both;
}
.alw-modal {
  width: 100%; max-width: 640px; max-height: min(80vh, 760px); display: flex; flex-direction: column;
  background: #fff; border-radius: 20px; box-shadow: 0 24px 64px rgba(11, 31, 44, .28); overflow: hidden;
  animation: alw-pop .28s cubic-bezier(.2, .9, .3, 1.1) both;
}
.alw-modal-head { display: flex; align-items: center; gap: 12px; padding: 20px 20px 16px 24px; border-bottom: 1px solid var(--alw-line); }
.alw-modal-head h2 { flex: 1; margin: 0; font-family: var(--alw-font-head); font-size: 20px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.25; }
.alw-modal-x { flex: none; width: 40px; height: 40px; border: 0; border-radius: 10px; background: none; color: var(--alw-muted); display: grid; place-items: center; cursor: pointer; }
.alw-modal-x:hover { background: var(--alw-soft); color: var(--alw-fg); }
.alw-modal-body { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 24px 20px; font-size: 14px; line-height: 1.6; color: #2B3B48; }
.alw-modal-body h3 { margin: 20px 0 6px; font-family: var(--alw-font-head); font-size: 15.5px; font-weight: 700; color: var(--alw-fg); letter-spacing: -0.01em; }
.alw-modal-body p { margin: 8px 0; }
.alw-modal-body ul { margin: 6px 0; padding-left: 20px; }
.alw-modal-body li { margin: 3px 0; }
.alw-modal-body .alw-doc-row { margin: 0; padding: 7px 0; border-bottom: 1px solid var(--alw-line); font-size: 13.5px; }
.alw-modal-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--alw-line); background: #fff; }
.alw-btn-ghost {
  height: 44px; padding: 0 18px; border: 1px solid var(--alw-line); border-radius: 12px; background: #fff;
  color: var(--alw-fg); font: inherit; font-size: 14.5px; font-weight: 600; cursor: pointer;
}
.alw-btn-ghost:hover { border-color: #C6D5E0; background: var(--alw-soft); }
.alw-btn.is-link { margin: 0; height: 44px; padding: 0 18px; text-decoration: none; font-size: 14.5px; gap: 8px; }
.alw-btn.is-link::after { display: none; }
@keyframes alw-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes alw-pop { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: none; } }

/* ---------- Şifre sıfırlama ---------- */
.alw-subhead { margin: 32px 0 0; font-family: var(--alw-font-head); font-size: 22px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.25; color: var(--alw-fg); }
.alw-subtext { margin: 6px 0 0; font-size: 15px; line-height: 1.55; color: var(--alw-muted); }
.alw-subtext b { color: var(--alw-fg); font-weight: 600; word-break: break-all; }
.alw-form.is-compact { margin-top: 24px; }
.alw-btn svg { flex: none; }
.alw-sent { display: flex; flex-direction: column; align-items: flex-start; }
.alw-sent-icon { margin-top: 32px; width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; background: var(--alw-accent-soft); color: var(--alw-accent); }
.alw-sent .alw-subhead { margin-top: 18px; }
.alw-sent-btn { margin-top: 22px; }
.alw-back { display: inline-flex; align-items: center; gap: 6px; }

/* 6 haneli kod kutuları */
.alw-otp-wrap { display: flex; flex-direction: column; gap: 6px; }
.alw-otp-label { font-size: 12.5px; font-weight: 600; color: var(--alw-muted); }
.alw-otp { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
/* Çerçeve = kutunun 2px'lik dolgusu; odakta bu dolgu dönen mavi bir ışığa (conic-gradient) dönüşür */
@property --alw-ang { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
.alw-otp-cell { display: block; padding: 2px; border-radius: 12px; background: var(--alw-line); transition: background .15s, box-shadow .15s; }
.alw-otp-cell:hover { background: #C6D5E0; }
.alw-otp-cell.is-filled { background: #B9DDF0; }
.alw-otp-cell:focus-within {
  background: conic-gradient(from var(--alw-ang), rgba(17, 157, 218, .18) 0deg, var(--alw-accent-2) 100deg, var(--alw-accent) 170deg, rgba(17, 157, 218, .18) 230deg, rgba(17, 157, 218, .18) 360deg);
  box-shadow: 0 0 0 4px rgba(17, 157, 218, .1);
  animation: alw-ang 1.6s linear infinite;
}
@keyframes alw-ang { to { --alw-ang: 360deg; } }
.alw-otp input {
  display: block; width: 100%; height: 52px; padding: 0; border: 0; border-radius: 10px; background: #fff; outline: none;
  text-align: center; font-family: var(--alw-font-head); font-size: 22px; font-weight: 700; color: var(--alw-fg); caret-color: var(--alw-accent);
  transition: background .15s;
}
.alw-login .alw-otp input:focus-visible { outline: none; }
.alw-otp-cell.is-filled input { background: #F7FBFE; }

/* Giriş ↔ kayıt geçişi */
.alw-switch { margin: 22px 0 0; text-align: center; font-size: 14px; color: var(--alw-muted); }
.alw-switch .alw-link { font-size: 14px; font-weight: 600; }

.alw-foot { position: relative; margin: 0; color: var(--alw-faint); font-size: 12.5px; }

/* ---------- Sol: başlık + kanal yörüngesi ---------- */
.alw-login-hero { border-right: 1px solid var(--alw-line); display: flex; align-items: center; padding: 32px 56px; min-width: 0; min-height: 0; overflow: hidden; }
.alw-hero-inner { width: 100%; max-width: 560px; margin: 0 auto; }
.alw-lede { margin: 0; font-family: var(--alw-font-head); font-size: clamp(26px, 2.5vw, 36px); line-height: 1.18; font-weight: 700; letter-spacing: -0.03em; text-align: center; }
/* İki sabit satır: kanal adı uzayıp kısalınca satırlar kaymaz, yörünge yerinde kalır */
.alw-lede-line { display: block; white-space: nowrap; }
.alw-pill { display: inline-flex; vertical-align: bottom; overflow: hidden; padding: 0 .14em; margin: 0 -.02em; border-radius: 12px; background: var(--alw-accent-soft); color: var(--alw-accent); line-height: 1.12; }
.alw-rt { display: inline-flex; flex-wrap: wrap; white-space: pre-wrap; position: relative; }
.alw-rt-word { display: inline-flex; overflow: hidden; padding-bottom: .08em; }
.alw-rt-char { display: inline-block; }
.alw-rt-char.is-in { animation: alw-rt-in .42s cubic-bezier(.2, .9, .3, 1.2) both; }
@keyframes alw-rt-in { from { transform: translateY(100%); opacity: 0; } to { transform: none; opacity: 1; } }

.alw-orbit { container-type: inline-size; position: relative; width: min(100%, 500px, calc(100vh - 230px)); width: min(100%, 500px, calc(100dvh - 230px)); aspect-ratio: 1; margin: 20px auto 0; }
/* Üç satırlı cümlede yörünge biraz küçülür, alçak ekranda da sığar */
.alw-hero-inner.has-lead .alw-orbit { width: min(100%, 480px, calc(100vh - 275px)); width: min(100%, 480px, calc(100dvh - 275px)); }
.alw-orbit::before { content: ""; position: absolute; inset: 9%; border-radius: 50%; background: radial-gradient(circle, #EEF7FC 0%, #F6FBFE 55%, rgba(255, 255, 255, 0) 72%); }
.alw-orbit-ring { position: absolute; inset: 9%; border-radius: 50%; border: 1px dashed #CFE3EE; }
.alw-orbit-ring.is-inner { inset: 26.5%; border: 1px solid #EAF2F7; }
.alw-orbit-spin { position: absolute; inset: 0; animation: alw-orbit 60s linear infinite; }
.alw-orbit-node { position: absolute; z-index: 1; width: var(--alw-node, 13.5%); aspect-ratio: 1; transform: translate(-50%, -50%); transition: transform .45s cubic-bezier(.2, .9, .3, 1.2); }
.alw-orbit-node.is-active { z-index: 2; transform: translate(-50%, -50%) scale(1.18); }
.alw-orbit-node .alw-orbit-face { transition: box-shadow .35s; }
.alw-orbit-node.is-active .alw-orbit-face { box-shadow: 0 0 0 2px var(--alw-accent-2), 0 0 0 7px rgba(17, 157, 218, .14), 0 10px 24px rgba(10, 135, 197, .22); }
/* Merkezden etkin kanala çizilen ince çizgi; her kanal değişiminde baştan çizilir */
.alw-orbit-link { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.alw-orbit-link line { stroke: var(--alw-accent-2); stroke-width: .32; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: alw-link-in .5s ease-out forwards; }
@keyframes alw-link-in { to { stroke-dashoffset: 0; } }
.alw-orbit-face {
  width: 100%; height: 100%; border-radius: 50%; background: #fff; display: grid; place-items: center; color: var(--alw-accent);
  box-shadow: 0 0 0 1px #E4EBF1, 0 6px 16px rgba(14, 34, 51, .08);
  animation: alw-orbit 60s linear infinite reverse;
}
.alw-orbit-face img { width: 56%; height: 56%; object-fit: contain; border-radius: 6px; }
.alw-orbit-face img.is-wide { width: 80%; height: 40%; border-radius: 0; }
/* Logosu olmayan kanal: kısa harf işareti */
.alw-orbit-mark { font-family: var(--alw-font-head); font-weight: 800; font-size: 3.4cqi; letter-spacing: -0.02em; color: var(--alw-navy); }
@keyframes alw-orbit { to { transform: rotate(360deg); } }
.alw-orbit-core {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 33%; aspect-ratio: 1; border-radius: 50%;
  background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  box-shadow: 0 0 0 1px #E4EBF1, 0 18px 40px rgba(10, 135, 197, .16);
}
.alw-orbit-core img { width: 44%; border-radius: 12px; display: block; }

/* Merkezde logo ile "Yapay zeka, gerçek satış" yer değiştirir */
.alw-core-logo { transition: opacity .35s ease, transform .5s cubic-bezier(.2, .9, .3, 1.2); }
.alw-core-logo.is-out { opacity: 0; transform: scale(.6); }
.alw-core-text {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  font-family: var(--alw-font-head); font-weight: 700; font-size: 4.3cqi; line-height: 1.14; letter-spacing: -0.02em; color: var(--alw-fg);
  opacity: 0; transition: opacity .3s ease; pointer-events: none;
}
.alw-core-text.is-on { opacity: 1; }
.alw-core-line { display: flex; overflow: hidden; padding-bottom: .06em; }
.alw-core-line.is-accent { color: var(--alw-accent); }

/* Alçak ekran (ör. 1366×640): form sıkışır, sayfa yine kaydırmasız sığar */
/* Kayıt formu uzun: ekran yeterince yüksek değilse alanlar incelir */
@media (max-height: 900px) and (min-width: 861px) {
  .alw-form.is-register { margin-top: 20px; gap: 8px; }
  .alw-form.is-register .alw-box { height: 50px; }
  .alw-otp input { height: 44px; font-size: 20px; }
  .alw-form.is-register .alw-box-main { gap: 2px; }
  .alw-form.is-register .alw-box-main input { font-size: 15px; }
  .alw-form.is-register ~ .alw-switch { margin-top: 14px; }
  .alw-consent { font-size: 12.5px; line-height: 1.45; }
}

/* Alçak ekran (ör. 1366×640): form sıkışır, sayfa yine kaydırmasız sığar */
@media (max-height: 760px) and (min-width: 861px) {
  .alw-brand { font-size: 44px; }
  .alw-brand img { width: 50px; height: 50px; border-radius: 13px; }
  .alw-form { margin-top: 24px; gap: 12px; }
  .alw-box { height: 54px; }
  .alw-form.is-register .alw-box { height: 46px; }
  .alw-form.is-register .alw-box-main label { font-size: 11px; }
  .alw-btn { height: 46px; }
  .alw-switch { margin-top: 16px; }
}

@media (prefers-reduced-motion: reduce) {
  .alw-rt-char.is-in, .alw-orbit-spin, .alw-orbit-face { animation: none; }
  .alw-orbit-link line { animation: none; stroke-dashoffset: 0; }
  .alw-orbit-node, .alw-core-logo { transition: none; }
  .alw-otp-cell:focus-within { animation: none; background: var(--alw-accent-2); }
  .alw-login-form-side::before, .alw-login-form-side::after, .alw-btn::after, .alw-modal, .alw-modal-backdrop, .alw-reveal { animation: none; }
}

/* ---------- Dar ekran ---------- */
@media (max-width: 1100px) {
  .alw-login-hero { padding: 40px 36px; }
}
@media (max-width: 860px) {
  .alw-login { grid-template-columns: 1fr; }

<script type="text/babel" data-presets="react">
const { useCallback, useEffect, useMemo, useRef, useState } = React;
/* ---- AuthLayout.jsx ---- */
/* Ailways · Giriş ve kayıt sayfalarının ortak iskeleti
   Yalnızca React'a bağlı; stiller Auth.css içinde, hepsi .alw-login altında (projedeki diğer stillere taşmaz).
   Fontlar: projede Manrope (600–800), IBM Plex Sans (400–600) ve logo yazısı için Outfit (300) yüklü olmalı.

   Sol: "Asistanın [kanal] müşterilerine cevap veriyor." + kanal yörüngesi. Cümlede adı geçen kanal yörüngede büyür,
        merkeze çizgiyle bağlanır; merkezde Ailways logosu ile "Yapay zeka, gerçek satış" sırayla yer değiştirir.
   Sağ: büyük Ailways logosu + sayfanın formu (children); arkada yavaşça kayan mavi ışık.
   lede: soldaki cümle, { lead?, before: 'Asistanın', after: 'müşterilerine cevap veriyor.' } — dönen kanal before'un ardından gelir;
         lead verilirse en üstte ayrı bir satır olur (uzun kanal adlarında ilk satır taşmasın diye).
   Field / PasswordField: iki sayfanın ortak form alanları.

   channels: [{ label: 'Trendyol', src: trendyolUrl, phrase: 'Trendyol’da' }, { label: 'Web sitesi', phrase: 'web sitende' }, …]
     wide: true yazı logoları (ör. Trendyol) yuvarlakta geniş gösterilir; src yoksa mark (ör. 'CS') harfleri, o da yoksa küre ikonu; phrase olan kanallar sırayla cümlede döner ve yörüngede vurgulanır. */



const ROT_INTERVAL = 2400;   // kanal başına süre
const SWAP_INTERVAL = 3200;  // merkez: logo ↔ yazı
const DEFAULT_TAGLINE = ['Yapay zeka', 'gerçek satış'];
const EMAIL_EXAMPLES = ['ornek@magazan.com', 'destek@butigin.com', 'siparis@markan.com.tr'];

const prefersReducedMotion = () =>
  typeof window !== 'undefined' && window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;

function useReducedMotion() {
  return useMemo(prefersReducedMotion, []);
}

/* E-posta alanının örnek metni harf harf yazılır, bekler, silinir; sıradaki örneğe geçer */
function useTypedPlaceholder(texts, enabled) {
  const [txt, setTxt] = useState(texts[0]);
  useEffect(() => {
    if (!enabled) { setTxt(texts[0]); return; }
    let i = 0, n = 0, dir = 1, t;
    const step = () => {
      const full = texts[i];
      n += dir;
      setTxt(full.slice(0, n));
      if (dir === 1 && n === full.length) { dir = -1; t = setTimeout(step, 1800); return; }
      if (dir === -1 && n === 0) { dir = 1; i = (i + 1) % texts.length; t = setTimeout(step, 350); return; }
      t = setTimeout(step, dir === 1 ? 75 : 32);
    };
    setTxt('');
    t = setTimeout(step, 700);
    return () => clearTimeout(t);
  }, [texts, enabled]);
  return txt;
}

/* React Bits RotatingText'ten uyarlandı (panel ana sayfasındakiyle aynı): harfler CSS animasyonuyla aşağıdan gelir.
   Sıra dışarıdan (idx) gelir; böylece yörüngedeki vurgu ile aynı anda değişir. */
function RotatingText({ texts, idx, stagger = 0.018 }) {
  const rotated = useRef(false);
  const first = useRef(idx);
  if (idx !== first.current) rotated.current = true;
  const split = t => (typeof Intl !== 'undefined' && Intl.Segmenter)
    ? Array.from(new Intl.Segmenter('tr', { granularity: 'grapheme' }).segment(t), x => x.segment)
    : Array.from(t);
  const words = useMemo(
    () => texts[idx].split(' ').map((w, i, arr) => ({ chars: split(w), space: i !== arr.length - 1 })),
    [texts, idx]
  );
  let n = 0;
  return (
    <span className="alw-rt">
      <span className="alw-sr">{texts[idx]}</span>
      <span key={idx} className="alw-rt" aria-hidden="true">
        {words.map((w, wi) => (
          <span key={wi} className="alw-rt-word">
            {w.chars.map((ch, ci) => (
              <span
                key={ci}
                className={`alw-rt-char${rotated.current ? ' is-in' : ''}`}
                style={rotated.current ? { animationDelay: `${(n++) * stagger}s` } : undefined}
              >{ch}</span>
            ))}
            {w.space && <span style={{ whiteSpace: 'pre' }}> </span>}
          </span>
        ))}
      </span>
    </span>
  );
}

const GlobeIcon = () => (
  <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" aria-hidden="true">
    <circle cx="12" cy="12" r="9" /><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z" />
  </svg>
);

const orbitPos = (i, n) => {
  const a = (i / n) * 2 * Math.PI - Math.PI / 2;
  return { x: 50 + 41 * Math.cos(a), y: 50 + 41 * Math.sin(a) };
};
// Kanal sayısı arttıkça düğümler küçülür, birbirine değmez
const nodeSize = n => `${Math.min(13.5, 210 / Math.max(n, 1))}%`;

/* Ana sayfadaki kanal yörüngesi; framer-motion yerine saf CSS dönüşü.
   active: cümlede adı geçen kanal; büyür, mavi halka alır ve merkeze ince bir çizgiyle bağlanır. */
function ChannelOrbit({ channels, active, core }) {
  const target = active >= 0 ? orbitPos(active, channels.length) : null;
  return (
    <div className="alw-orbit" style={{ '--alw-node': nodeSize(channels.length) }} aria-hidden="true">
      <span className="alw-orbit-ring" />
      <span className="alw-orbit-ring is-inner" />
      <div className="alw-orbit-spin">
        {target && (
          <svg key={active} className="alw-orbit-link" viewBox="0 0 100 100" preserveAspectRatio="none">
            <line x1="50" y1="50" x2={target.x} y2={target.y} pathLength="1" />
          </svg>
        )}
        {channels.map((c, i) => {
          const p = orbitPos(i, channels.length);
          return (
            <span key={c.label} className={`alw-orbit-node${i === active ? ' is-active' : ''}`} style={{ left: `${p.x}%`, top: `${p.y}%` }} title={c.label}>
              <span className="alw-orbit-face">{c.src ? <img className={c.wide ? 'is-wide' : undefined} src={c.src} alt="" /> : c.mark ? <b className="alw-orbit-mark">{c.mark}</b> : <GlobeIcon />}</span>
            </span>
          );
        })}
      </div>
      {core}
    </div>
  );
}

/* Merkez: Ailways logosu ile "Yapay zeka, gerçek satış" sırayla yer değiştirir; yazı harf harf gelir. */
function OrbitCore({ logo, tagline, reduce }) {
  const [tick, setTick] = useState(0);
  useEffect(() => {
    if (reduce) return;
    const id = setInterval(() => setTick(t => t + 1), SWAP_INTERVAL);
    return () => clearInterval(id);
  }, [reduce]);
  const showText = tick % 2 === 1;
  let n = 0;
  const chars = t => Array.from(t).map((ch, i) => (
    <span key={i} className="alw-rt-char is-in" style={{ animationDelay: `${(n++) * 0.03}s` }}>{ch === ' ' ? ' ' : ch}</span>
  ));
  return (
    <div className="alw-orbit-core">
      {logo && <img className={`alw-core-logo${showText ? ' is-out' : ''}`} src={logo} alt="" />}
      <span key={tick} className={`alw-core-text${showText ? ' is-on' : ''}`}>
        <span className="alw-core-line">{showText && chars(tagline[0])}</span>
        <span className="alw-core-line is-accent">{showText && chars(tagline[1])}</span>
      </span>
    </div>
  );
}

/* Form alanı: solda simge, etiket alanın içinde üstte küçük; sağda isteğe bağlı düğme (şifre göster, kod gönder) */
const ICONS = {
  user: <><circle cx="12" cy="8" r="4" /><path d="M4 20c1.5-3.5 4.5-5 8-5s6.5 1.5 8 5" /></>,
  mail: <><rect x="3" y="5" width="18" height="14" rx="2.5" /><path d="M3.5 7l8.5 6 8.5-6" /></>,
  phone: <path d="M6.5 3.5h3l1.5 4-2 1.5a11 11 0 0 0 6 6l1.5-2 4 1.5v3a2 2 0 0 1-2 2A16.5 16.5 0 0 1 4.5 5.5a2 2 0 0 1 2-2z" />,
  lock: <><rect x="4.5" y="10.5" width="15" height="10" rx="2.5" /><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3" /></>,
  key: <><circle cx="8" cy="15" r="4" /><path d="M11 12l9-9M17 6l2 2M15 8l2 2" /></>,
};

function Field({ id, label, icon, invalid, trailing, children }) {
  return (
    <div className={`alw-box${invalid ? ' is-invalid' : ''}`}>
      {icon && (
        <svg className="alw-box-icon" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          {ICONS[icon]}
        </svg>
      )}
      <div className="alw-box-main">
        <label htmlFor={id}>{label}</label>
        {children}
      </div>
      {trailing}
    </div>
  );
}

const EyeIcon = ({ off }) => (
  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
    <path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z" /><circle cx="12" cy="12" r="3" />
    {off && <path d="M4 4l16 16" />}
  </svg>
);

/* Şifre alanı: göster / gizle düğmesiyle */
function PasswordField({ id, label = 'Şifre', value, onChange, autoComplete, invalid }) {
  const [show, setShow] = useState(false);
  return (
    <Field
      id={id} label={label} icon="lock" invalid={invalid}
      trailing={
        <button type="button" className="alw-box-btn is-icon" onClick={() => setShow(v => !v)} aria-label={show ? 'Şifreyi gizle' : 'Şifreyi göster'} aria-pressed={show}>
          <EyeIcon off={show} />
        </button>
      }
    >
      <input id={id} type={show ? 'text' : 'password'} autoComplete={autoComplete} required value={value} onChange={onChange} aria-invalid={invalid || undefined} />
    </Field>
  );
}

/* lede: soldaki cümle; ilk satır + dönen kanal, ikinci satır */
const DEFAULT_LEDE = { before: 'Asistanın', after: 'müşterilerine cevap veriyor.' };

function AuthLayout({ logo, channels = [], tagline = DEFAULT_TAGLINE, lede = DEFAULT_LEDE, children }) {
  const reduce = useReducedMotion();

  // Cümlede dönen kanal ve yörüngedeki vurgu aynı sırayı izler
  const spoken = useMemo(() => channels.map((c, i) => ({ i, phrase: c.phrase })).filter(c => c.phrase), [channels]);
  const [turn, setTurn] = useState(0);
  useEffect(() => {
    if (reduce || spoken.length < 2) return;
    const id = setInterval(() => setTurn(t => (t + 1) % spoken.length), ROT_INTERVAL);
    return () => clearInterval(id);
  }, [reduce, spoken.length]);
  const idx = turn % (spoken.length || 1);
  const current = spoken[idx];
  const phrases = spoken.map(c => c.phrase);

  return (
    <div className="alw-login">
      <aside className="alw-login-hero" aria-label="Ailways">
        <div className={`alw-hero-inner${lede.lead ? ' has-lead' : ''}`}>
          <p className="alw-lede">
            {lede.lead && <span className="alw-lede-line">{lede.lead}</span>}
            <span className="alw-lede-line">
              {lede.before}{' '}
              {current && (
                <span className="alw-pill">
                  {reduce ? current.phrase : <RotatingText texts={phrases} idx={idx} />}
                </span>
              )}
            </span>
            <span className="alw-lede-line">{lede.after}</span>
          </p>
          {channels.length > 0 && (
            <ChannelOrbit
              channels={channels}
              active={current ? current.i : -1}
              core={<OrbitCore logo={logo} tagline={tagline} reduce={reduce} />}
            />
          )}
        </div>
      </aside>

      <main className="alw-login-form-side">
        <div className="alw-form-wrap">
          <h1 className="alw-brand">
            {logo && <img src={logo} alt="" />}
            <span>Ailways</span>
          </h1>
          {children}
        </div>
        <p className="alw-foot">© {new Date().getFullYear()} Ailways</p>
      </main>
    </div>
  );
}

/* ---- LoginPage.jsx ---- */
/* Ailways · Giriş sayfası
   Kullanım:
     import LoginPage from './login/LoginPage';
     <LoginPage
       logo={logoUrl}
       channels={[{ label: 'Trendyol', src: trendyolUrl, phrase: 'Trendyol’da' }, …]}   // bkz. AuthLayout
       onSubmit={({ email, password, remember }) => …}
       forgotHref="/auth/forgot-password"
       registerHref="/auth/register"   // verilmezse "Hesabın yok mu?" satırı çıkmaz
       loading={false}
       error="E-posta ya da şifre hatalı."
     />
   Giriş mantığı bu bileşende yok; form verisini onSubmit'e verir. */



function LoginPage({
  logo,
  channels = [],
  tagline,
  onSubmit,
  forgotHref = '#',
  registerHref,
  loading = false,
  error = '',
}) {
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [remember, setRemember] = useState(true);
  const reduce = useReducedMotion();
  const emailHint = useTypedPlaceholder(EMAIL_EXAMPLES, !reduce);

  const submit = e => {
    e.preventDefault();
    if (!loading) onSubmit?.({ email, password, remember });
  };

  return (
    <AuthLayout logo={logo} channels={channels} tagline={tagline}>
      {error && <p className="alw-alert" role="alert">{error}</p>}

      <form className="alw-form" onSubmit={submit} noValidate aria-label="Giriş">
        <Field id="alw-email" label="E-posta" icon="mail" invalid={!!error}>
          <input
            id="alw-email" type="email" autoComplete="email" inputMode="email" required
            placeholder={emailHint}
            value={email} onChange={e => setEmail(e.target.value)}
            aria-invalid={error ? true : undefined}
          />
        </Field>

        <PasswordField id="alw-password" autoComplete="current-password" value={password} onChange={e => setPassword(e.target.value)} invalid={!!error} />

        <div className="alw-row">
          <label className="alw-check">
            <input type="checkbox" checked={remember} onChange={e => setRemember(e.target.checked)} />
            Beni hatırla
          </label>
          <a href={forgotHref} className="alw-link">Şifremi unuttum</a>
        </div>

        <button type="submit" className="alw-btn" disabled={loading} aria-busy={loading || undefined}>
          {loading && <span className="alw-spin" aria-hidden="true" />}
          {loading ? 'Giriş yapılıyor' : 'Giriş yap'}
        </button>
      </form>

      {registerHref && (
        <p className="alw-switch">Hesabın yok mu? <a href={registerHref} className="alw-link">Kayıt ol</a></p>
      )}
    </AuthLayout>
  );
}

/* ---- RegisterPage.jsx ---- */
/* Ailways · Kayıt sayfası
   Alanlar mevcut kayıt ekranıyla aynı (app.ailways.com/auth/register):
   ad soyad, e-posta, telefon + doğrulama kodu, şifre, şifre tekrar,
   KVKK / gizlilik / çerez onayı ve yurt dışına veri aktarımı açık rızası.
   Belge bağlantıları önce pencerede (modal) açılır; penceredeki "Sayfada aç" belgenin kendi sayfasına götürür.

   Kullanım:
     import RegisterPage from './login/RegisterPage';
     <RegisterPage
       logo={logoUrl}
       channels={…}                                   // bkz. AuthLayout
       onSendCode={phone => …}                         // "Kod gönder"e basılınca
       onSubmit={({ name, email, phone, code, password, passwordAgain, consentTerms, consentTransfer }) => …}
       loginHref="/auth/login"
       legalDocs={{ kvkk: { content: <KvkkText /> }, … }}   // pencerede gösterilecek metin; başlık ve adres varsayılanları aşağıda
       loading={false}
       error=""
     />
   Kayıt mantığı ve doğrulama bu bileşende yok; form verisini onSubmit'e verir. */



/* 6 haneli doğrulama kodu: her hane ayrı kutu. Yazınca sonrakine geçer, Backspace bir öncekine döner,
   oklarla gezilir, yapıştırılan kod kutulara dağıtılır. onChange birleşik kodu verir. */
function OtpInput({ id, label, length = 6, onChange }) {
  const [digits, setDigits] = useState(() => Array(length).fill(''));
  const refs = useRef([]);
  const focus = i => refs.current[Math.max(0, Math.min(length - 1, i))]?.focus();
  const update = next => { setDigits(next); onChange?.(next.join('')); };
  const fillFrom = (i, str) => {
    const chars = str.replace(/\D/g, '').slice(0, length - i).split('');
    if (!chars.length) return;
    const next = digits.slice();
    chars.forEach((ch, k) => { next[i + k] = ch; });
    update(next);
    focus(i + chars.length);
  };
  const onInput = (i, e) => {
    const v = e.target.value.replace(/\D/g, '');
    if (!v) { const next = digits.slice(); next[i] = ''; update(next); return; }
    // Tek hane yazıldıysa eski haneyi atıp yenisini al; daha uzunsa (otomatik doldurma) kutulara dağıt
    if (v.length > 2) { fillFrom(i, v); return; }
    fillFrom(i, v.length === 2 ? (v.slice(-1) === digits[i] ? v.slice(0, -1) : v.slice(-1)) : v);
  };
  const onKeyDown = (i, e) => {
    if (e.key === 'Backspace' && !digits[i] && i > 0) {
      e.preventDefault();
      const next = digits.slice(); next[i - 1] = ''; update(next); focus(i - 1);
    } else if (e.key === 'ArrowLeft') { e.preventDefault(); focus(i - 1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); focus(i + 1); }
  };
  const onPaste = (i, e) => {
    e.preventDefault();
    fillFrom(i, e.clipboardData.getData('text'));
  };
  return (
    <div className="alw-otp-wrap">
      <span className="alw-otp-label" id={`${id}-label`}>{label}</span>
      <div className="alw-otp" role="group" aria-labelledby={`${id}-label`}>
        {digits.map((d, i) => (
          // Kutu çerçevesi: odaktaki kutuda etrafında mavi bir ışık döner
          <span key={i} className={`alw-otp-cell${d ? ' is-filled' : ''}`}>
            <input
              ref={el => { refs.current[i] = el; }}
              id={i === 0 ? id : undefined}
              type="text" inputMode="numeric" pattern="[0-9]*"
              autoComplete={i === 0 ? 'one-time-code' : 'off'}
              aria-label={`${i + 1}. hane`}
              value={d}
              onChange={e => onInput(i, e)}
              onKeyDown={e => onKeyDown(i, e)}
              onPaste={e => onPaste(i, e)}
              onFocus={e => e.target.select()}
            />
          </span>
        ))}
      </div>
    </div>
  );
}

const REGISTER_LEDE = { before: 'Asistanın', after: 'hemen işe başlasın.' };

// Belgeler: pencere başlığı ve "Sayfada aç" adresi. content (JSX) ya da blocks ([['h2'|'p'|'li'|'tr', metin], …]) ile metin verilir.
const DEFAULT_DOCS = {
  kvkk: { title: 'KVKK Aydınlatma Metni', href: '/kvkk/aydinlatma-metni' },
  privacy: { title: 'Gizlilik Politikası', href: '/privacy' },
  cookies: { title: 'Çerez Politikası', href: '/kvkk/cerez-politikasi' },
  transfer: { title: 'Yurt Dışına Veri Aktarımı Bilgilendirmesi', href: '/kvkk/yurt-disi-veri-aktarimi' },
};

const CloseIcon = () => (
  <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
);
const ExternalIcon = () => (
  <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4" /></svg>
);

/* blocks → başlık, paragraf, madde ve tablo satırları; ardışık maddeler tek listede */
function DocBody({ blocks }) {
  const out = [];
  blocks.forEach(([t, txt], i) => {
    if (t === 'li') {
      const last = out[out.length - 1];
      if (last && last.type === 'ul') last.items.push(txt); else out.push({ type: 'ul', items: [txt], key: i });
    } else out.push({ type: t, txt, key: i });
  });
  return out.map(b =>
    b.type === 'ul' ? <ul key={b.key}>{b.items.map((x, j) => <li key={j}>{x}</li>)}</ul>
    : b.type === 'h2' || b.type === 'h3' || b.type === 'h4' ? <h3 key={b.key}>{b.txt}</h3>
    : b.type === 'tr' ? <p key={b.key} className="alw-doc-row">{b.txt}</p>
    : <p key={b.key}>{b.txt}</p>
  );
}

// Onay metnindeki belge adı: tıklayınca pencere açılır (onay kutusunu değiştirmez)
const Doc = ({ k, onOpen, children }) => (
  <button type="button" className="alw-doclink" onClick={e => { e.preventDefault(); onOpen(k); }}>{children}</button>
);

function LegalModal({ doc, onClose }) {
  const closeRef = useRef(null);
  useEffect(() => {
    closeRef.current?.focus();
    const onKey = e => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [onClose]);
  return (
    <div className="alw-modal-backdrop" onMouseDown={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="alw-modal" role="dialog" aria-modal="true" aria-labelledby="alw-modal-title">
        <header className="alw-modal-head">
          <h2 id="alw-modal-title">{doc.title}</h2>
          <button ref={closeRef} type="button" className="alw-modal-x" onClick={onClose} aria-label="Kapat"><CloseIcon /></button>
        </header>
        <div className="alw-modal-body">
          {doc.content || (doc.blocks?.length ? <DocBody blocks={doc.blocks} /> : <p>Metnin tamamını sayfasında okuyabilirsin.</p>)}
        </div>
        <footer className="alw-modal-foot">
          <button type="button" className="alw-btn-ghost" onClick={onClose}>Kapat</button>
          <a href={doc.href} className="alw-btn is-link" target="_blank" rel="noopener noreferrer">Sayfada aç<ExternalIcon /></a>
        </footer>
      </div>
    </div>
  );
}

function RegisterPage({
  logo,
  channels = [],
  tagline,
  onSendCode,
  onSubmit,
  loginHref,
  legalDocs = {},
  loading = false,
  error = '',
}) {
  const [f, setF] = useState({ name: '', email: '', phone: '', code: '', password: '', passwordAgain: '', consentTerms: false, consentTransfer: false });
  const [codeSent, setCodeSent] = useState(false);
  const [openDoc, setOpenDoc] = useState(null);
  const closeDoc = useCallback(() => setOpenDoc(null), []);
  const reduce = useReducedMotion();
  const emailHint = useTypedPlaceholder(EMAIL_EXAMPLES, !reduce);
  const set = k => e => setF(v => ({ ...v, [k]: e.target.type === 'checkbox' ? e.target.checked : e.target.value }));
  const docs = Object.fromEntries(Object.entries(DEFAULT_DOCS).map(([k, d]) => [k, { ...d, ...legalDocs[k] }]));

  const sendCode = () => {
    onSendCode?.(f.phone);
    setCodeSent(true);
  };
  const submit = e => {
    e.preventDefault();
    if (!loading) onSubmit?.(f);
  };

  return (
    <AuthLayout logo={logo} channels={channels} tagline={tagline} lede={REGISTER_LEDE}>
      {error && <p className="alw-alert" role="alert">{error}</p>}

      <form className="alw-form is-register" onSubmit={submit} noValidate aria-label="Kayıt">
        <Field id="alw-name" label="Ad soyad" icon="user">
          <input id="alw-name" type="text" autoComplete="name" required value={f.name} onChange={set('name')} />
        </Field>

        <Field id="alw-email" label="E-posta" icon="mail">
          <input id="alw-email" type="email" autoComplete="email" inputMode="email" required placeholder={emailHint} value={f.email} onChange={set('email')} />
        </Field>

        <Field
          id="alw-phone" label="Telefon" icon="phone"
          trailing={<button type="button" className="alw-box-btn" onClick={sendCode}>{codeSent ? 'Tekrar gönder' : 'Kod gönder'}</button>}
        >
          <input id="alw-phone" type="tel" autoComplete="tel" inputMode="tel" required placeholder="05XX XXX XX XX" value={f.phone} onChange={set('phone')} />
        </Field>

        {codeSent && (
          <div className="alw-reveal">
            <OtpInput id="alw-code" label="Telefonuna gelen 6 haneli kod" onChange={code => setF(v => ({ ...v, code }))} />
          </div>
        )}

        <PasswordField id="alw-password" autoComplete="new-password" value={f.password} onChange={set('password')} />
        <PasswordField id="alw-password-2" label="Şifre tekrar" autoComplete="new-password" value={f.passwordAgain} onChange={set('passwordAgain')} />

        <div className="alw-consents">
          <label className="alw-consent">
            <input type="checkbox" checked={f.consentTerms} onChange={set('consentTerms')} />
            <span>
              <Doc k="kvkk" onOpen={setOpenDoc}>KVKK Aydınlatma Metni</Doc>’ni okudum, <Doc k="privacy" onOpen={setOpenDoc}>Gizlilik Politikası</Doc>’nı ve{' '}
              <Doc k="cookies" onOpen={setOpenDoc}>Çerez Politikası</Doc>’nı kabul ediyorum.
            </span>
          </label>
          <label className="alw-consent">
            <input type="checkbox" checked={f.consentTransfer} onChange={set('consentTransfer')} />
            <span>
              Kişisel verilerimin <Doc k="transfer" onOpen={setOpenDoc}>Yurt Dışına Veri Aktarımı Bilgilendirmesi</Doc>’nde belirtilen
              yurt dışındaki hizmet sağlayıcılara aktarılmasına açık rızam ile onay veriyorum.
            </span>
          </label>
        </div>

        <button type="submit" className="alw-btn" disabled={loading} aria-busy={loading || undefined}>
          {loading && <span className="alw-spin" aria-hidden="true" />}
          {loading ? 'Hesap oluşturuluyor' : 'Hesap oluştur'}
        </button>
      </form>

      {loginHref && (
        <p className="alw-switch">Zaten hesabın var mı? <a href={loginHref} className="alw-link">Giriş yap</a></p>
      )}

      {openDoc && <LegalModal doc={docs[openDoc]} onClose={closeDoc} />}
    </AuthLayout>
  );
}

/* ---- ResetPasswordPage.jsx ---- */
/* Ailways · Şifre sıfırlama sayfası
   Alanlar mevcut ekranla aynı (app.ailways.com/auth/reset-password): e-posta + "Sıfırlama bağlantısı gönder", "Giriş sayfasına dön".
   Gönderildikten sonra (sent) "E-postanı kontrol et" görünümü çıkar.

   Kullanım:
     import ResetPasswordPage from './login/ResetPasswordPage';
     <ResetPasswordPage
       logo={logoUrl}
       channels={…}                         // bkz. AuthLayout
       onSubmit={({ email }) => …}
       onResend={email => …}                // "Tekrar gönder"
       sent={false}                         // istek başarılıysa true
       loginHref="/auth/login"
       loading={false}
       error=""
     />
   Sıfırlama mantığı bu bileşende yok; form verisini onSubmit'e verir. */



const RESET_LEDE = { before: 'Asistanın', after: 'sen olmayınca da çalışıyor.' };

const ArrowIcon = ({ back }) => (
  <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
    {back ? <path d="M19 12H5M11 6l-6 6 6 6" /> : <path d="M5 12h14M13 6l6 6-6 6" />}
  </svg>
);
const MailSentIcon = () => (
  <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
    <rect x="3" y="5" width="18" height="14" rx="2.5" /><path d="M3.5 7l8.5 6 8.5-6" />
  </svg>
);

function ResetPasswordPage({
  logo,
  channels = [],
  tagline,
  onSubmit,
  onResend,
  sent = false,
  loginHref = '#',
  loading = false,
  error = '',
}) {
  const [email, setEmail] = useState('');
  const reduce = useReducedMotion();
  const emailHint = useTypedPlaceholder(EMAIL_EXAMPLES, !reduce && !sent);

  const submit = e => {
    e.preventDefault();
    if (!loading) onSubmit?.({ email });
  };

  return (
    <AuthLayout logo={logo} channels={channels} tagline={tagline} lede={RESET_LEDE}>
      {sent ? (
        <div className="alw-sent alw-reveal" role="status">
          <span className="alw-sent-icon"><MailSentIcon /></span>
          <h2 className="alw-subhead">E-postanı kontrol et</h2>
          <p className="alw-subtext">
            {email ? <><b>{email}</b> adresine</> : 'E-posta adresine'} şifre sıfırlama bağlantısı gönderdik.
            Gelmediyse spam klasörüne de bak.
          </p>
          <button type="button" className="alw-btn-ghost alw-sent-btn" onClick={() => onResend?.(email)}>Tekrar gönder</button>
        </div>
      ) : (
        <>
          <h2 className="alw-subhead">Şifre sıfırla</h2>
          <p className="alw-subtext">E-posta adresine şifre sıfırlama bağlantısı göndereceğiz.</p>

          {error && <p className="alw-alert" role="alert">{error}</p>}

          <form className="alw-form is-compact" onSubmit={submit} noValidate aria-label="Şifre sıfırlama">
            <Field id="alw-email" label="E-posta" icon="mail" invalid={!!error}>
              <input
                id="alw-email" type="email" autoComplete="email" inputMode="email" required
                placeholder={emailHint}
                value={email} onChange={e => setEmail(e.target.value)}
                aria-invalid={error ? true : undefined}
              />
            </Field>

            <button type="submit" className="alw-btn" disabled={loading} aria-busy={loading || undefined}>
              {loading && <span className="alw-spin" aria-hidden="true" />}
              {loading ? 'Gönderiliyor' : <>Sıfırlama bağlantısı gönder<ArrowIcon /></>}
            </button>
          </form>
        </>
      )}

      <p className="alw-switch"><a href={loginHref} className="alw-link alw-back"><ArrowIcon back />Giriş sayfasına dön</a></p>
    </AuthLayout>
  );
}
